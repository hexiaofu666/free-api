<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公积金贷款计算器 - 词海工具箱</title>
<meta name="description" content="在线公积金贷款计算器，按月供金额、总利息与还款总额双口径对比等额本息与等额本金两种还款方式的差异。">

<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

</head>
<body data-tool="gongjijin" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>贷款金额（万元）</label><input type="text" id="amt" value="80"></div>
      <div class="fitem"><label>年利率（%）</label><input type="text" id="rate" value="2.85"></div>
      <div class="fitem"><label>贷款年限（年）</label>
        <select id="years"><option>5</option><option>10</option><option>15</option><option>20</option><option selected>30</option></select>
      </div>
      <div class="fitem"><label>还款方式</label>
        <select id="method"><option value="benxi">等额本息（每月相同）</option><option value="benjin">等额本金（逐月递减）</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算月供</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写参数后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于公积金贷款计算器介绍：</h4>
    <ol>
      <li>等额本息：月供固定，月供 = 本金 × 月利率 × (1+月利率)^期数 ÷ ((1+月利率)^期数 − 1)，前期利息占比高。</li>
      <li>等额本金：每月偿还本金固定，利息按剩余本金计算，月供逐月递减，首月最高、末月最低。</li>
      <li>在相同利率与期限下，等额本金支付的总利息少于等额本息，但前期还款压力更大，适合收入较高且稳定的人群。</li>
      <li>公积金贷款利率由各地住房公积金管理中心公布并可能随政策调整，本工具默认值仅供参考，请以当地最新公布利率为准。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfMonthlyPayment(P, ratePct, months) {
  var i = ratePct / 100 / 12;
  if (i <= 0) return P / months;
  var p = Math.pow(1 + i, months);
  return P * i * p / (p - 1);
}
function __xfTotalRepay(P, ratePct, months) {
  return __xfMonthlyPayment(P, ratePct, months) * months;
}
function __xfTotalInterest(P, ratePct, months) {
  return __xfTotalRepay(P, ratePct, months) - P;
}
function __xfPrincipalFirst(P, ratePct, months) {
  var i = ratePct / 100 / 12;
  return P / months + P * i;
}
function __xfPrincipalPrincipal(P, months) { return P / months; }
function __xfPrincipalTotalInterest(P, ratePct, months) {
  var i = ratePct / 100 / 12;
  return i * P * (months + 1) / 2;
}
function __xfPrincipalLast(P, ratePct, months) {
  var i = ratePct / 100 / 12;
  return P / months + (P / months) * i;
}
function __xfRound2(v) { return Math.round(v * 100) / 100; }
function __xfWan(v) { return v / 10000; }
function run() {
  var wan = Number($("amt").value), rate = Number($("rate").value);
  var years = Number($("years").value) || 30;
  var method = $("method").value || "benxi";
  if (!(wan > 0) || !(rate >= 0) || !(years > 0)) { $("tip").textContent = "⚠️ 请填写有效的贷款金额、利率与年限"; $("res").innerHTML = ""; return null; }
  var P = wan * 10000, months = years * 12;
  var rows, ret;
  if (method === "benjin") {
    var first = __xfPrincipalFirst(P, rate, months), last = __xfPrincipalLast(P, rate, months);
    var interest = __xfPrincipalTotalInterest(P, rate, months);
    rows = "<div>每月偿还本金：" + __xfRound2(__xfPrincipalPrincipal(P, months)) + " 元（固定）</div>" +
      "<div>首月月供：<b style='color:#2f9e6e;font-size:16px;'>" + __xfRound2(first) + " 元</b></div>" +
      "<div>末月月供：<b style='color:#2f9e6e;font-size:16px;'>" + __xfRound2(last) + " 元</b></div>" +
      "<div>支付利息总额：" + __xfRound2(interest) + " 元</div>" +
      "<div>累计还款总额：" + __xfRound2(P + interest) + " 元</div>";
    ret = __xfRound2(first);
  } else {
    var m = __xfMonthlyPayment(P, rate, months), ti = __xfTotalInterest(P, rate, months);
    rows = "<div>每月月供：<b style='color:#2f9e6e;font-size:16px;'>" + __xfRound2(m) + " 元</b></div>" +
      "<div>支付利息总额：" + __xfRound2(ti) + " 元</div>" +
      "<div>累计还款总额：" + __xfRound2(P + ti) + " 元</div>" +
      "<div style='color:#888;'>其中利息占还款总额的 " + __xfRound2(ti / (P + ti) * 100) + "%</div>";
    ret = __xfRound2(m);
  }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>贷款 " + wan + " 万元，年利率 " + rate + "%，期限 " + years + " 年（" + months + " 期）</div>" + rows;
  return ret;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
