  <div class="resttips">
    <h4>关于中国省份简称及省会大全介绍：</h4>
    <ol>
      <li>中国共有三十四个省级行政区，包括二十三个省、五个自治区、四个直辖市和两个特别行政区。</li>
      <li>省级行政区简称多取自历史地名或名称中的关键字，部分省份有两个简称，如四川简称川或蜀、云南简称滇或云。</li>
      <li>自治区与特别行政区的行政中心称为首府或驻地，不称省会，例如内蒙古自治区首府为呼和浩特。</li>
      <li>车牌号、行政区划代码与邮政编码的首位数字都与省级行政区对应，掌握简称有助于快速识别证件与单号信息。</li>
    </ol>

<script>
var $ = function (id) { return document.getElementById(id); };
var DATA = [{"k":"北京市","v":"简称 京｜驻地 北京","d":"直辖市"},{"k":"天津市","v":"简称 津｜驻地 天津","d":"直辖市"},{"k":"上海市","v":"简称 沪｜驻地 上海","d":"直辖市"},{"k":"重庆市","v":"简称 渝｜驻地 重庆","d":"直辖市"},{"k":"河北省","v":"简称 冀｜省会 石家庄","d":"华北地区"},{"k":"山西省","v":"简称 晋｜省会 太原","d":"华北地区"},{"k":"辽宁省","v":"简称 辽｜省会 沈阳","d":"东北地区"},{"k":"吉林省","v":"简称 吉｜省会 长春","d":"东北地区"},{"k":"黑龙江省","v":"简称 黑｜省会 哈尔滨","d":"东北地区"},{"k":"江苏省","v":"简称 苏｜省会 南京","d":"华东地区"},{"k":"浙江省","v":"简称 浙｜省会 杭州","d":"华东地区"},{"k":"安徽省","v":"简称 皖｜省会 合肥","d":"华东地区"},{"k":"福建省","v":"简称 闽｜省会 福州","d":"华东地区"},{"k":"江西省","v":"简称 赣｜省会 南昌","d":"华东地区"},{"k":"山东省","v":"简称 鲁｜省会 济南","d":"华东地区"},{"k":"河南省","v":"简称 豫｜省会 郑州","d":"华中地区"},{"k":"湖北省","v":"简称 鄂｜省会 武汉","d":"华中地区"},{"k":"湖南省","v":"简称 湘｜省会 长沙","d":"华中地区"},{"k":"广东省","v":"简称 粤｜省会 广州","d":"华南地区"},{"k":"海南省","v":"简称 琼｜省会 海口","d":"华南地区"},{"k":"四川省","v":"简称 川（蜀）｜省会 成都","d":"西南地区"},{"k":"贵州省","v":"简称 黔（贵）｜省会 贵阳","d":"西南地区"},{"k":"云南省","v":"简称 滇（云）｜省会 昆明","d":"西南地区"},{"k":"陕西省","v":"简称 陕（秦）｜省会 西安","d":"西北地区"},{"k":"甘肃省","v":"简称 甘（陇）｜省会 兰州","d":"西北地区"},{"k":"青海省","v":"简称 青｜省会 西宁","d":"西北地区"},{"k":"内蒙古自治区","v":"简称 内蒙古｜首府 呼和浩特","d":"自治区"},{"k":"广西壮族自治区","v":"简称 桂｜首府 南宁","d":"自治区"},{"k":"西藏自治区","v":"简称 藏｜首府 拉萨","d":"自治区"},{"k":"宁夏回族自治区","v":"简称 宁｜首府 银川","d":"自治区"},{"k":"新疆维吾尔自治区","v":"简称 新｜首府 乌鲁木齐","d":"自治区"},{"k":"香港特别行政区","v":"简称 港｜驻地 香港","d":"1997 年 7 月 1 日回归祖国"},{"k":"澳门特别行政区","v":"简称 澳｜驻地 澳门","d":"1999 年 12 月 20 日回归祖国"},{"k":"台湾省","v":"简称 台｜省会 台北","d":"中国神圣领土不可分割的一部分"}];
function __xfList() { return DATA; }
function __xfSearch(kw) {
  var k = String(kw == null ? "" : kw).trim().toLowerCase();
  if (!k) return DATA.slice();
  return DATA.filter(function (it) {
    return (it.k + " " + it.v + " " + (it.d || "")).toLowerCase().indexOf(k) >= 0;
  });
}
function __xfRender(list, kw) {
  if (!list.length) return "<div style='padding:14px 15px;color:#999;'>没有匹配「" + kw + "」的条目</div>";
  return list.map(function (it) {
    return "<div style='padding:10px 15px;border-bottom:1px solid #f0f0f0;'>" +
      "<b style='color:#9c4221;font-family:Consolas,monospace;'>" + it.k + "</b>" +
      "<span style='margin-left:10px;color:#333;'>" + it.v + "</span>" +
      (it.d ? "<div style='color:#999;font-size:12px;margin-top:4px;'>" + it.d + "</div>" : "") +
      "</div>";
  }).join("");
}
function run() {
  var kw = $("kw").value;
  var list = __xfSearch(kw);
  $("res").innerHTML = __xfRender(list, kw);
  $("tip").textContent = kw ? "筛选到 " + list.length + " 条" : "共 " + DATA.length + " 条，输入关键词可即时筛选";
  return list;
}
$("kw").oninput = run;
$("allBtn").onclick = function () { $("kw").value = ""; return run(); };
$("clrBtn").onclick = function () { $("kw").value = ""; return run(); };
run();
function __xfRow(name) {
  for (var i = 0; i < DATA.length; i++) { if (DATA[i].k === String(name).trim()) return DATA[i]; }
  return null;
}
function __xfAbbr(name) {
  var r = __xfRow(name);
  if (!r) return "";
  var m = /简称 ([^｜]+)/.exec(String(r.v));
  return m ? m[1].trim() : "";
}
function __xfCapital(name) {
  var r = __xfRow(name);
  if (!r) return "";
  var m = /(?:省会|首府|驻地) ([^｜]+)/.exec(String(r.v));
  return m ? m[1].trim() : "";
}
function __xfIsMunicipality(name) {
  var r = __xfRow(name);
  return r ? /直辖市/.test(String(r.d)) : false;
}
