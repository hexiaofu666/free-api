<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法定退休年龄在线计算 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.4"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.4">
<style>
.ret-result { font-size: 13px; line-height: 2.2; }
.ret-result b { color: #ff6500; font-size: 15px; }
.ret-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="按延迟退休新规计算法定退休年龄">
<link rel="canonical" href="https://tools.hdemba.cn/tools/calc_retireage.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="calc_retireage" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>出生年月</label><input id="birth" placeholder="如 1985-06" value="1985-06"></div>
      <div class="fitem"><label>人员类别</label>
        <select id="type">
          <option value="m">男职工（原 60 岁退休）</option>
          <option value="f55">女职工（原 55 岁退休）</option>
          <option value="f50">女职工（原 50 岁退休）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始计算</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout on" id="outBox">
      <div class="vhead"><strong>计算结果</strong></div>
      <div class="ret-result" id="result">填写出生年月后点击「开始计算」。</div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于法定退休年龄计算介绍：</h4>
    <ol>
      <li>按 2024 年通过的渐进式延迟退休政策计算：</li>
      <li>男职工：自 1965 年 1 月起，每 4 个月延迟 1 个月，最高延至 63 岁。</li>
      <li>原 55 岁退休女职工：自 1970 年 1 月起，每 4 个月延迟 1 个月，最高延至 58 岁。</li>
      <li>原 50 岁退休女职工：自 1975 年 1 月起，每 2 个月延迟 1 个月，最高延至 55 岁。</li>
      <li>计算结果仅供参考，具体以人社部门认定为准。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.4"></script>
<script src="../assets/chrome.js?v=1.5.4"></script>
<script>
const $=id=>document.getElementById(id);
const CONF={m:{base:60,startY:1965,step:4,cap:36},f55:{base:55,startY:1970,step:4,cap:36},f50:{base:50,startY:1975,step:2,cap:60}};
$("runBtn").onclick=()=>{
  const m=$("birth").value.trim().match(/^(\d{4})[-/年.](\d{1,2})?/);
  if(!m) return alert("请输入出生年月，如 1985-06");
  const by=+m[1], bm=+(m[2]||1);
  if(bm<1||bm>12) return alert("月份不正确");
  const c=CONF[$("type").value];
  const idx=Math.max(0,(by-c.startY)*12+(bm-1));
  const delay=Math.min(Math.floor(idx/c.step)+1,c.cap);
  const ageY=c.base+Math.floor(delay/12), ageM=delay%12;
  /* 退休年月 = 出生年月 + 退休月龄 */
  const total=by*12+(bm-1)+(c.base*12+delay);
  const ry=Math.floor(total/12), rm=total%12+1;
  $("result").innerHTML=`
    <div class="ret-row"><span>退休年龄</span><b>${ageY} 岁 ${ageM?ageM+" 个月":""}</b></div>
    <div class="ret-row"><span>延迟</span><span>${delay} 个月</span></div>
    <div class="ret-row"><span>预计退休时间</span><b>${ry} 年 ${rm} 月</b></div>`;
};
$("clearBtn").onclick=()=>{$("result").innerHTML="填写出生年月后点击「开始计算」。";};
</script>
</body>
</html>
