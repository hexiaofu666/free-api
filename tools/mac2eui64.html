<meta name="description" content="在线 EUI-64 转换器，支持将 MAC 地址快速转换为 IPv6 接口标识符与完整 IPv6 地址，兼容冒号、短横线、Cisco 点分、连续 hex 四种 MAC 格式，自动生成 Link-Local 地址，浏览器本地处理。">
<link rel="canonical" href="https://tools.hdemba.cn/tools/mac2eui64.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="mac2eui64" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="fitem" style="margin-bottom:12px;"><label>MAC 地址（支持 00:1A:2B:3C:4D:5E / 00-1A-2B-3C-4D-5E / 001A.2B3C.4D5E / 001A2B3C4D5E）</label><input id="mac" placeholder="00:1A:2B:3C:4D:5E" spellcheck="false"></div>
    <div class="fitem" style="margin-bottom:12px;"><label>IPv6 前缀（留空默认 fe80::，生成链路本地地址）</label><input id="prefix" placeholder="fe80::" spellcheck="false"></div>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="fbtn blue" id="convBtn">立即转换</button>
      <button class="fbtn" id="demoBtn">填充示例</button>
      <button class="fbtn" id="copyBtn">复制完整地址</button>
      <button class="fbtn" id="clearBtn">清空</button>
    </div>
    <div class="macres" id="res"></div>
  </div>
  <div class="resttips">
    <h4>关于MAC地址转EUI-64转换器介绍：</h4>
    <p>1、EUI-64 是将 48 位 MAC 地址扩展为 64 位 IPv6 接口标识符的标准方法：在 MAC 中间（OUI 与设备号之间）插入 FFFE，并将第 1 字节的 U/L 位（bit 1，次低位）取反。</p>
    <p>2、得到接口标识符后，与前缀拼接即得完整 IPv6 地址；默认前缀 fe80:: 生成链路本地地址（Link-Local），也可填入全球单播前缀（如 2001:db8:1::/64）。</p>
    <p>3、支持冒号、短横线、Cisco 点分、连续 hex 四种 MAC 输入格式，自动去除分隔符。转换在浏览器本地完成。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.9"></script>
<script src="../assets/chrome.js?v=1.5.9"></script>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_PREFIX_GROUPS = ["fe80", "0000", "0000", "0000"];
function cleanMacInput(s) { return s.replace(/[^0-9a-f]/gi, "").toLowerCase(); }
function convertMacToEUI64(mac) {
  const withFFFE = mac.slice(0, 6) + "fffe" + mac.slice(6);
  const first = parseInt(withFFFE.slice(0, 2), 16);
  const flipped = (first ^ 2).toString(16).padStart(2, "0");
  const id = flipped + withFFFE.slice(2);
  const groups = [id.slice(0, 4), id.slice(4, 8), id.slice(8, 12), id.slice(12, 16)];
  return { interfaceId: groups.join(":"), groups };
}
function expandPrefix(p) {
  p = p.split("/")[0].trim().toLowerCase();
  if (!p) return null;
  if ((p.match(/::/g) || []).length > 1) return null;
  const seg = p.split("::");
  const head = seg[0] ? seg[0].split(":") : [];
  const tail = seg.length > 1 && seg[1] ? seg[1].split(":") : [];
  const all = head.concat(tail);
  if (all.some(x => !/^[0-9a-f]{1,4}$/i.test(x))) return null;
  const mid = 8 - (head.length + tail.length);
  if (mid < 0) return null;
  const out = [...head];
  if (seg.length > 1) { for (let i = 0; i < mid; i++) out.push("0"); out.push(...tail); }
  else { for (let i = 0; i < mid; i++) out.push("0"); }
  return out.map(x => x.padStart(4, "0").toLowerCase());
}
function compressIPv6(groups) {
  const short = groups.map(g => g.replace(/^0+/, "") || "0");
  let bestStart = -1, bestLen = 0, i = 0;
  while (i < groups.length) {
    if (groups[i] === "0000") {
      let j = i; while (j < groups.length && groups[j] === "0000") j++;
      const len = j - i;
      if (len > bestLen && len >= 2) { bestStart = i; bestLen = len; }
      i = j;
    } else i++;
  }
  if (bestStart !== -1) {
    const head = short.slice(0, bestStart), tail = short.slice(bestStart + bestLen);
    if (head.length === 0) return "::" + tail.join(":");
    return tail.length === 0 ? head.join(":") + "::" : head.join(":") + "::" + tail.join(":");
  }
  return short.join(":");
}
const row = (label, val) => `<div class="row"><span>${label}</span><div>${val}</div></div>`;
$("convBtn").onclick = () => {
  const mac = cleanMacInput($("mac").value);
  if (!mac) { alert("请输入 MAC 地址"); return; }
  if (mac.length !== 12) { alert("需要 12 位十六进制字符，当前检测到 " + mac.length + " 位。支持格式：00:1A:2B:3C:4D:5E、00-1A-2B-3C-4D-5E、001A.2B3C.4D5E、001A2B3C4D5E"); return; }
  const { interfaceId, groups } = convertMacToEUI64(mac);
  let prefixGroups = DEFAULT_PREFIX_GROUPS;
  const pv = $("prefix").value.trim();
  if (pv) {
    const parsed = expandPrefix(pv);
    if (!parsed) { alert("前缀格式无效，已使用默认 fe80::"); }
    else prefixGroups = parsed.slice(0, 4);
  }
  const full = compressIPv6([...prefixGroups, ...groups]);
  $("res").innerHTML = row("接口标识符（EUI-64）", interfaceId) + row("完整 IPv6 地址", full);
  $("res").style.display = "block";
};
$("demoBtn").onclick = () => { $("mac").value = "00:1A:2B:3C:4D:5E"; $("prefix").value = ""; $("res").style.display = "none"; };
$("copyBtn").onclick = () => {
  const el = $("res").querySelectorAll(".row div");
  if (!el.length) return alert("还没有转换结果");
  navigator.clipboard.writeText(el[el.length - 1].textContent).then(() => alert("✅ 已复制到剪贴板"));
};
$("clearBtn").onclick = () => { $("mac").value = ""; $("prefix").value = ""; $("res").style.display = "none"; };
</script>
</body>
</html>
