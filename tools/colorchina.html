<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统色查询 - 词海工具箱</title>
<meta name="description" content="收录胭脂、朱砂、天青、月白等中国传统色名与色值，支持关键词检索并生成色卡，便于国风设计与前端取色。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/colorchina.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="colorchina" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>搜索</label><input type="text" id="kw" value="" placeholder="输入色名或色值，如 青 或 9d"></div>
      <div class="fitem"><label>每行显示</label><input type="number" id="col" value="4" min="1" max="8"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查询</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">色卡</strong><span id="state"></span></div>
      <div id="sw" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;"></div>
      <textarea id="res" readonly style="height:170px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于中国传统色查询介绍：</h4>
    <ol>
      <li>中国传统色名多来自矿物、植物与器物，如朱砂取自矿物、靛青取自染草。</li>
      <li>搜索支持名称模糊匹配，输入青可以同时找到群青、藏青、靛青与竹青。</li>
      <li>国风页面常用月白、象牙白做底，用胭脂、朱砂做点缀，对比鲜明又不刺眼。</li>
      <li>同一色名在不同资料中取值略有差异，本表采用较通行的近似值供参考。</li>
      <li>复制结果可直接用于配色文档，或再配合配色方案工具生成完整的色阶。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var CHINA_COLORS = {
  "胭脂": "#9d2933", "朱砂": "#ff461f", "朱红": "#ff4c00", "丹色": "#ff4e20", "石榴红": "#f20c00",
  "妃色": "#ed5736", "品红": "#f00056", "桃红": "#f47983", "海棠红": "#db5a6b", "藕荷": "#e4c6d0",
  "青莲": "#8d4bbb", "紫罗兰": "#d3a4ff", "群青": "#4c8dae", "宝蓝": "#3b2e7e", "藏青": "#2e4e7e",
  "靛青": "#177cb0", "碧色": "#1bd1a5", "松花色": "#bce672", "竹青": "#789262", "柳绿": "#afdd22",
  "葱绿": "#9ed900", "豆绿": "#9ed048", "鹅黄": "#fff143", "藤黄": "#ffb61e", "姜黄": "#ffc773",
  "橘黄": "#ff8936", "杏黄": "#ffa631", "棕红": "#b25d25", "赭色": "#955539", "酱色": "#8e3d3d",
  "驼色": "#a88462", "秋色": "#896c39", "米色": "#f9e9cd", "象牙白": "#fffbf0", "月白": "#d6ecf0",
  "素色": "#e0f0e9", "玄青": "#3d3b4f", "墨色": "#50616d", "黛色": "#4a4266", "白色": "#ffffff"
};
function __xfChinaList(kw) {
  var k = String(kw || "").trim().toLowerCase();
  return Object.keys(CHINA_COLORS).filter(function (n) {
    if (!k) return true;
    return n.toLowerCase().indexOf(k) >= 0 || CHINA_COLORS[n].indexOf(k) >= 0;
  }).map(function (n) { return { name: n, hex: CHINA_COLORS[n] }; });
}
function __xfChinaColor(name) {
  var n = String(name).trim();
  return CHINA_COLORS.hasOwnProperty(n) ? { name: n, hex: CHINA_COLORS[n] } : null;
}
window.__xfChinaList = __xfChinaList;
window.__xfChinaColor = __xfChinaColor;
window.CHINA_COLORS = CHINA_COLORS;
function run() {
  var list = __xfChinaList($("kw").value);
  var sw = $("sw");
  sw.style.gridTemplateColumns = "repeat(" + (parseInt($("col").value, 10) || 4) + ",1fr)";
  sw.innerHTML = "";
  list.forEach(function (c) {
    var d = document.createElement("div");
    d.style.cssText = "background:" + c.hex + ";height:38px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:#fff;text-shadow:0 0 2px #000;";
    d.textContent = c.name;
    sw.appendChild(d);
  });
  $("res").value = list.map(function (c) { return c.name + "  " + c.hex; }).join("\n");
  $("state").textContent = list.length + " 个色";
  $("tip").textContent = "✅ 共 " + Object.keys(CHINA_COLORS).length + " 个传统色";
  return list;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
