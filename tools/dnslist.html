<div class="main"><div class="center"><div class="tools">

      <div class="fitem"><label>搜索</label><input type="text" id="kw" placeholder="输入 IP 或厂商名，如 223.5.5.5、阿里"></div>

  <div class="resttips">
    <h4>关于公共 DNS 服务器地址大全介绍：</h4>
    <ol>
      <li>公共 DNS 可替代运营商默认 DNS，改善部分网站解析缓慢或跳转广告的问题，修改后建议重启网络或刷新 DNS 缓存。</li>
      <li>国内用户优选阿里云、腾讯与 114DNS，海外服务如 8.8.8.8 在国内可能延迟较高甚至不稳定。</li>
      <li>主用与备用 DNS 建议选择同一家服务商的两个地址，避免解析结果不一致导致访问异常。</li>
      <li>修改 DNS 只能改变域名解析环节，无法提升带宽与线路质量，遇到访问故障时应先排查本地网络与目标服务器状态。</li>
    </ol>
  </div>

<script>

var DATA = [{"k":"223.5.5.5","v":"阿里云公共 DNS｜备用 223.6.6.6","d":"国内解析速度快，支持防劫持与恶意网站拦截"},{"k":"223.6.6.6","v":"阿里云公共 DNS（备用）｜主用 223.5.5.5","d":"与主用地址成对配置"},{"k":"119.29.29.29","v":"腾讯 DNSPod 公共 DNS｜备用 182.254.116.116","d":"国内老牌公共 DNS，支持 DNSSEC"},{"k":"182.254.116.116","v":"腾讯 DNSPod 公共 DNS（备用）｜主用 119.29.29.29","d":""},{"k":"114.114.114.114","v":"114DNS（江苏南京）｜备用 114.114.115.115","d":"国内使用最广泛的公共 DNS 之一"},{"k":"114.114.115.115","v":"114DNS（江苏南京，备用）｜主用 114.114.114.114","d":""},{"k":"180.76.76.76","v":"百度公共 DNS","d":"接入百度自有解析节点"},{"k":"1.1.1.1","v":"Cloudflare 公共 DNS｜备用 1.0.0.1","d":"强调隐私保护，承诺不记录用户数据"},{"k":"1.0.0.1","v":"Cloudflare 公共 DNS（备用）｜主用 1.1.1.1","d":""},{"k":"8.8.8.8","v":"Google 公共 DNS｜备用 8.8.4.4","d":"全球节点覆盖广，国内访问延迟偏高"},{"k":"8.8.4.4","v":"Google 公共 DNS（备用）｜主用 8.8.8.8","d":""},{"k":"9.9.9.9","v":"Quad9 公共 DNS｜备用 149.112.112.112","d":"自动拦截已知恶意域名"},{"k":"149.112.112.112","v":"Quad9 公共 DNS（备用）｜主用 9.9.9.9","d":""},{"k":"208.67.222.222","v":"OpenDNS 公共 DNS｜备用 208.67.220.220","d":"提供内容过滤与家长控制功能"},{"k":"208.67.220.220","v":"OpenDNS 公共 DNS（备用）｜主用 208.67.222.222","d":""},{"k":"202.96.128.86","v":"中国电信广东 DNS","d":"运营商本地 DNS，就近解析速度快"},{"k":"202.96.134.133","v":"中国电信广东 DNS（深圳）","d":""},{"k":"101.226.4.6","v":"中国电信上海 DNS","d":""},{"k":"123.125.81.6","v":"中国联通北京 DNS","d":""},{"k":"210.2.4.8","v":"中国科学院网络信息中心 DNS","d":"教育与科研网络可选"},{"k":"168.95.1.1","v":"中国台湾 HiNet DNS｜备用 168.95.192.1","d":"中国台湾地区运营商 DNS"},{"k":"168.95.192.1","v":"中国台湾 HiNet DNS（备用）｜主用 168.95.1.1","d":""}];
function __xfList() { return DATA; }
function __xfSearch(kw) {
  var k = String(kw == null ? "" : kw).trim().toLowerCase();
  if (!k) return DATA.slice();
  return DATA.filter(function (it) {
    return (it.k + " " + it.v + " " + (it.d || "")).toLowerCase().indexOf(k) >= 0;
  });
}
function __xfRender(list, kw) {
  if (!list.length) return "<div style='padding:14px 15px;color:#999;'>没有匹配「" + kw + "」的条目</div>";
  return list.map(function (it) {
    return "<div style='padding:10px 15px;border-bottom:1px solid #f0f0f0;'>" +
      "<b style='color:#2f9e6e;font-family:Consolas,monospace;'>" + it.k + "</b>" +
      "<span style='margin-left:10px;color:#333;'>" + it.v + "</span>" +
      (it.d ? "<div style='color:#999;font-size:12px;margin-top:4px;'>" + it.d + "</div>" : "") +
      "</div>";
  }).join("");
}
function run() {
  var kw = $("kw").value;
  var list = __xfSearch(kw);
  $("res").innerHTML = __xfRender(list, kw);
  $("tip").textContent = kw ? "筛选到 " + list.length + " 条" : "共 " + DATA.length + " 条，输入关键词可即时筛选";
  return list;
}
$("kw").oninput = run;
$("allBtn").onclick = function () { $("kw").value = ""; return run(); };
$("clrBtn").onclick = function () { $("kw").value = ""; return run(); };
run();
function __xfIsIp(s) {
  var p = String(s == null ? "" : s).trim().split(".");
  if (p.length !== 4) return false;
  for (var i = 0; i < 4; i++) {
    if (!/^\d{1,3}$/.test(p[i])) return false;
    var n = +p[i];
    if (n < 0 || n > 255) return false;
  }
  return true;
}
function __xfDns(ip) {
  var k = String(ip == null ? "" : ip).trim();
  for (var i = 0; i < DATA.length; i++) { if (DATA[i].k === k) return DATA[i]; }
  return null;
}
function __xfIps() { return DATA.map(function (it) { return it.k; }); }
function __xfAllValid() { return __xfIps().every(function (ip) { return __xfIsIp(ip); }); }
