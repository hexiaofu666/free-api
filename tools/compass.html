<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线指南针 - 词海工具箱</title>
<meta name="description" content="在线指南针：调用手机方向传感器实时显示方位角与 16 方位，支持屏幕旋转修正与手动校准，无需安装 App。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/compass.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="compass" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>屏幕方向</label>
        <select id="orient">
          <option value="0" selected>竖屏（0°）</option>
          <option value="90">横屏左转（90°）</option>
          <option value="270">横屏右转（270°）</option>
        </select>
      </div>
      <div class="fitem"><label>校准偏移</label><input type="number" id="offset" value="0" step="1" placeholder="例如 -5"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="startBtn">开始测量</button>
      <button class="fbtn brown" id="stopBtn">停止</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">方位读数</strong><span id="status">未开始</span></div>
      <div id="res" style="padding:20px 15px;text-align:center;">
        <div style="font-size:44px;font-weight:700;color:#3f6092;" id="deg">--°</div>
        <div style="font-size:18px;margin-top:6px;" id="dir">请点击「开始测量」并允许方向权限</div>
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于在线指南针介绍：</h4>
    <ol>
      <li>本工具调用设备方向传感器（DeviceOrientation），手机浏览器可直接使用；桌面电脑一般没有该传感器。</li>
      <li>iOS Safari 需要用户点击按钮后才可申请方向权限，这是系统安全限制，不是工具故障。</li>
      <li>方位角以正北为 0°、顺时针增加；16 方位名是将 360° 均分为 16 份后的中文命名。</li>
      <li>若读数与真实方向有固定偏差，可在「校准偏移」里填补偿角度（会直接加到读数上）。</li>
      <li>横屏使用时请把「屏幕方向」切到对应的 90° 或 270°，避免方位跟着屏幕转。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var DIRS = ["北", "北东北", "东北", "东东北", "东", "东东南", "东南", "南东南", "南", "南西南", "西南", "西西南", "西", "西西北", "西北", "北西北"];

/* 方位角 → 16 方位名 */
function __xfDirName(deg) {
  var d = ((Number(deg) % 360) + 360) % 360;
  var idx = Math.round(d / 22.5) % 16;
  return DIRS[idx];
}
/* 传感器原始值 → 方位角（度，0=正北，顺时针） */
function __xfCompassHeading(alpha, beta, gamma, orient) {
  var a = Number(alpha) || 0, b = Number(beta) || 0, g = Number(gamma) || 0;
  var o = Number(orient) || 0;
  // 设备平放：heading = 360 - alpha；倾斜时用 beta/gamma 修正
  var rad = Math.PI / 180;
  var x = b * Math.cos(a * rad) + g * Math.sin(a * rad);
  var pitch = Math.abs(x) > 90 ? 180 - x : x;
  var h = 360 - a + (pitch < 0 ? 0 : 0);
  h = (h % 360 + 360) % 360;
  h = (h + o) % 360;
  return Math.round(h * 10) / 10;
}
/* 归一化到 0-360 */
function __xfNorm360(deg) { return ((Number(deg) % 360) + 360) % 360; }
window.__xfDirName = __xfDirName;
window.__xfCompassHeading = __xfCompassHeading;
window.__xfNorm360 = __xfNorm360;

var $ = function (id) { return document.getElementById(id); };
var handler = null;
function paint(h) {
  h = __xfNorm360(h + (parseFloat($("offset").value) || 0));
  $("deg").textContent = h.toFixed(0) + "°";
  $("dir").textContent = __xfDirName(h) + "（" + h.toFixed(1) + "°）";
}
function start() {
  if (typeof DeviceOrientationEvent === "undefined") {
    $("status").textContent = "设备不支持";
    $("dir").textContent = "当前设备/浏览器不支持方向传感器（桌面端一般无此能力）";
    return;
  }
  handler = function (e) {
    var h = __xfCompassHeading(e.alpha, e.beta, e.gamma, (typeof screen !== "undefined" && screen.orientation ? screen.orientation.angle : 0));
    paint(h);
  };
  window.addEventListener("deviceorientation", handler, true);
  $("status").textContent = "测量中";
}
function stop() {
  if (handler) window.removeEventListener("deviceorientation", handler, true);
  handler = null;
  $("status").textContent = "已停止";
}
$("startBtn").onclick = function () {
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().then(function (r) { if (r === "granted") start(); else $("status").textContent = "权限被拒绝"; }).catch(function () { $("status").textContent = "权限请求失败"; });
  } else start();
};
$("stopBtn").onclick = stop;
$("orient").onchange = function () { $("offset").value = this.value === "0" ? 0 : (this.value === "90" ? 90 : 270); };
paint(0);
</script>
</body>
</html>
