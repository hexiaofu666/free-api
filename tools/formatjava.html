<div class="main"><div class="center"><div class="tools">

    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>缩进</label>
        <select id="indent"><option value="4" selected>4 个空格</option><option value="2">2 个空格</option><option value="tab">Tab</option></select>
      </div>
      <div class="fitem"><label>左大括号</label>
        <select id="brace"><option value="same" selected>同一行（K&R）</option><option value="next">另起一行（Allman）</option></select>
      </div>
      <div class="fitem"><label>保留空行</label>
        <select id="blank"><option value="yes" selected>是</option><option value="no">否</option></select>
      </div>

    <div class="abar">
      <button class="fbtn teal" id="runBtn">格式化</button>
      <button class="fbtn gray" id="minBtn">压缩为单行</button>

    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">Java 代码</div>
      <textarea id="src" style="min-height:170px;">public class Demo { public static void main(String[] args) { int a = 1; if (a > 0) { System.out.println("正数"); } else { System.out.println("非正数"); } for (int i = 0; i < 3; i++) { System.out.println("i=" + i); } } }</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">格式化结果</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:240px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Java代码格式化介绍：</h4>
    <ol>
      <li>格式化按大括号与分号断行，并使用状态机保护字符串与注释，因此字符串里的 `;` 或 `{` 不会被误断行。</li>
      <li>左大括号风格可选「同一行」（K&R，Java 社区主流）或「另起一行」（Allman，部分团队规范）。</li>
      <li>格式化只是排版，不会改变代码语义；但请保留原文件备份，避免团队代码风格冲突。</li>
      <li>压缩为单行仅做去注释与合并空白，不做变量重命名等可能破坏代码的优化。</li>
      <li>如需严格的团队风格（如 Google Java Style），建议使用 IDE 的代码格式化功能或 Checkstyle。</li>
    </ol>
  </div>

<script>
/* 通用类 C 语法格式化：按 { } ; 断行，保护字符串与注释 */
function __xfFormatCLike(code, indentStr, braceNext, keepBlank) {
  var ind = indentStr === "tab" ? "\t" : new Array((parseInt(indentStr, 10) || 4) + 1).join(" ");
  var src = String(code).replace(/\r\n/g, "\n");
  var lines = src.split("\n"), out = [], depth = 0;
  var inBlockComment = false;
  lines.forEach(function (raw) {
    var line = raw.trim();
    if (!line) { if (keepBlank !== "no" && out.length) out.push(""); return; }
    if (inBlockComment) {
      out.push(new Array(depth + 1).join(ind) + line);
      if (line.indexOf("*/") >= 0) inBlockComment = false;
      return;
    }
    var parts = [], buf = "", state = "code";
    for (var i = 0; i < line.length; i++) {
      var c = line[i], c2 = line[i + 1];
      if (state === "code") {
        if (c === "\"" || c === "'") { state = c; buf += c; continue; }
        if (c === "/" && c2 === "/") { break; }
        if (c === "/" && c2 === "*") { state = "block"; buf += c + c2; i++; continue; }
        if (c === "{" || c === "}" || c === ";") { buf += c; parts.push(buf.trim()); buf = ""; continue; }
        buf += c; continue;
      }
      if (state === "block") { buf += c; if (c === "*" && c2 === "/") { buf += c2; i++; state = "code"; } continue; }
      if (c === "\\") { buf += c + (c2 || ""); i++; continue; }
      if (c === state) state = "code";
      buf += c;
    }
    if (buf.trim()) parts.push(buf.trim());
    parts.forEach(function (p) {
      if (p === "}") {
        depth = Math.max(0, depth - 1);
        out.push(new Array(depth + 1).join(ind) + p);
        return;
      }
      if (p === "{") { out.push(new Array(depth + 1).join(ind) + "{"); depth++; return; }
      if (/^\}/.test(p)) {
        depth = Math.max(0, depth - 1);
        out.push(new Array(depth + 1).join(ind) + p);
        if (/\{$/.test(p)) depth++;
        return;
      }
      if (/\{$/.test(p)) {
        var head = p.slice(0, -1).trim();
        if (braceNext === "next") {
          out.push(new Array(depth + 1).join(ind) + head);
          out.push(new Array(depth + 1).join(ind) + "{");
        } else out.push(new Array(depth + 1).join(ind) + head + " {");
        depth++;
        return;
      }
      out.push(new Array(depth + 1).join(ind) + p);
    });
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n");
}
function __xfMinifyCLike(code) {
  var out = "", state = "code", src = String(code);
  for (var i = 0; i < src.length; i++) {
    var c = src[i], c2 = src[i + 1];
    if (state === "code") {
      if (c === "\"" || c === "'") { state = c; out += c; continue; }
      if (c === "/" && c2 === "/") { state = "line"; i++; continue; }
      if (c === "/" && c2 === "*") { state = "block"; i++; continue; }
      if (/\s/.test(c)) {
        var prev = out.slice(-1), next = src[i + 1] || "";
        if (/[\w$\]\)}]/.test(prev) && /[\w$(\[{]/.test(next)) out += " ";
        continue;
      }
      out += c; continue;
    }
    if (state === "line") { if (c === "\n") state = "code"; continue; }
    if (state === "block") { if (c === "*" && c2 === "/") { state = "code"; i++; } continue; }
    if (c === "\\") { out += c + (c2 || ""); i++; continue; }
    if (c === state) state = "code";
    out += c;
  }
  return out;
}
function __xfCodeStats(code) {
  var s = String(code);
  var lines = s.split("\n").length;
  var noComment = s.replace(/\/\/[^\n]*/g, "").replace(/\/\*[\s\S]*?\*\//g, "");
  return { lines: lines, chars: s.length, codeLines: noComment.split("\n").filter(function (l) { return l.trim(); }).length, braces: (s.match(/\{/g) || []).length };
}
window.__xfFormatCLike = __xfFormatCLike;
window.__xfMinifyCLike = __xfMinifyCLike;
window.__xfCodeStats = __xfCodeStats;

var $ = function (id) { return document.getElementById(id); };
$("runBtn").onclick = function () {
  var out = __xfFormatCLike($("src").value, $("indent").value, $("brace").value, $("blank").value);
  $("res").value = out;
  $("state").textContent = out.split("\n").length + " 行";
  $("tip").textContent = "✅ 格式化完成";
};
$("minBtn").onclick = function () {
  var out = __xfMinifyCLike($("src").value);
  $("res").value = out;
  $("state").textContent = out.length + " 字符";
  $("tip").textContent = "✅ 已压缩为单行";
};
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
$("runBtn").click();
</script>
