<style>
.fake-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 99999;
  background: #1b3a57;
  color: #fff;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  cursor: none;
}
.fake-overlay.show { display: flex; }
.fake-ring {
  width: 52px; height: 52px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  animation: spin 1s linear infinite;
  margin-bottom: 28px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.fake-title { font-size: 20px; margin-bottom: 12px; }
.fake-sub { font-size: 13px; color: rgba(255,255,255,.75); }
.fake-pct { margin-top: 22px; width: 260px; height: 5px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
.fake-pct div { height: 100%; width: 0; background: #fff; }
.fake-tip { color: #888ea2; font-size: 13px; line-height: 2; margin-bottom: 14px; }
</style>

<body data-tool="fakeupdate" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mlf" style="text-align:center;padding-top:50px;">
      <div class="fake-tip">点击按钮后全屏模拟系统升级画面，上班摸鱼神器。<br>按 <b style="color:#ff6500">ESC</b> 键或点击屏幕任意位置退出。</div>
      <button class="fbtn blue" id="startBtn" style="width:220px;margin:0 auto;">💻 开始假装升级</button>
    </div>
  </div>
  <div class="resttips">
    <h4>关于假装系统在升级工具介绍：</h4>
    <p>一款趣味摸鱼工具，一键让屏幕进入"系统正在更新"的全屏画面，进度缓慢推进，按 ESC 退出。请适度使用哦~</p>
  </div>
</div></div></div>

<div class="fake-overlay" id="overlay">
  <div class="fake-ring"></div>
  <div class="fake-title">正在处理更新 <span id="pct">0</span>%</div>
  <div class="fake-sub">请不要关闭计算机</div>
  <div class="fake-pct"><div id="bar"></div></div>
</div>

<script src="../assets/tools-data.js?v=1.5.3"></script>
<script src="../assets/chrome.js?v=1.5.3"></script>
<script>
const overlay = document.getElementById("overlay");
document.getElementById("startBtn").onclick = () => {
  overlay.classList.add("show");
  let p = 0;
  document.getElementById("bar").style.width = "0";
  const timer = setInterval(() => {
    p = Math.min(99, p + Math.floor(Math.random() * 4) + 1);
    document.getElementById("pct").textContent = p;
    document.getElementById("bar").style.width = p + "%";
  }, 2500);
  overlay._timer = timer;
};
function stop() {
  if (overlay.classList.contains("show")) {
    clearInterval(overlay._timer);
    overlay.classList.remove("show");
  }
}
overlay.onclick = stop;
document.addEventListener("keydown", e => { if (e.key === "Escape") stop(); });
</script>
