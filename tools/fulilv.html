<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复利计算器 - 词海工具箱</title>
<meta name="description" content="在线复利计算器，输入本金、年利率、年限与每年复利次数，算出到期本息合计与利息总额，直观感受利滚利效果。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/fulilv.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="fulilv" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>本金（元）</label><input type="text" id="p" value="100000"></div>
      <div class="fitem"><label>年利率（%）</label><input type="text" id="rate" value="3"></div>
      <div class="fitem"><label>存款年限（年）</label><input type="text" id="years" value="10"></div>
      <div class="fitem"><label>每年复利次数</label>
        <select id="m"><option value="1">1 次（按年）</option><option value="2">2 次（半年）</option><option value="4">4 次（按季）</option><option value="12">12 次（按月）</option><option value="365">365 次（按日）</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算本息</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写参数后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于复利计算器介绍：</h4>
    <ol>
      <li>复利公式：终值 = 本金 × (1 + 年利率 ÷ 复利次数) 的 复利次数×年限 次方。</li>
      <li>复利次数越多利息越高，按月复利比按年复利收益略高。</li>
      <li>结果为本息合计与利息总额，可用于比较不同产品的复利效果。</li>
      <li>实际理财产品的收益受费用、税费与利率波动影响，结果仅供参考。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfCompound(p, ratePct, years, m) {
  var r = ratePct / 100;
  return p * Math.pow(1 + r / m, m * years);
}
function __xfCompoundInterest(p, ratePct, years, m) { return __xfCompound(p, ratePct, years, m) - p; }
function __xfSimpleTotal(p, ratePct, years) { return p * (1 + ratePct / 100 * years); }
function __xfRound2(v) { return Math.round(v * 100) / 100; }
function run() {
  var p = Number($("p").value), rate = Number($("rate").value), years = Number($("years").value);
  var m = Number($("m").value) || 1;
  if (!(p > 0) || !(rate > 0) || !(years > 0)) { $("tip").textContent = "⚠️ 请填写大于 0 的本金、利率与年限"; $("res").innerHTML = ""; return null; }
  var fv = __xfCompound(p, rate, years, m), interest = fv - p, simple = __xfSimpleTotal(p, rate, years);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>本金 " + p + " 元，年利率 " + rate + "%，存期 " + years + " 年，每年复利 " + m + " 次</div>" +
    "<div>到期本息：<b style='color:#c9a227;font-size:16px;'>" + __xfRound2(fv) + " 元</b></div>" +
    "<div>利息总额：" + __xfRound2(interest) + " 元</div>" +
    "<div style='color:#888;'>对比单利：" + __xfRound2(simple - p) + " 元，复利多赚 " + __xfRound2(interest - (simple - p)) + " 元</div>";
  return fv;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
