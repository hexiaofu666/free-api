<style>
.chg-wrap { max-width: 760px; margin: 5px auto 0; }
.chg-item { position: relative; padding: 0 0 26px 30px; }
.chg-item::before {
  content: ""; position: absolute; left: 6px; top: 8px; bottom: -4px;
  width: 2px; background: #eee;
}
.chg-item:last-child::before { display: none; }
.chg-dot {
  position: absolute; left: 0; top: 4px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #ff6500; box-shadow: 0 0 0 3px #ffe3d1;
}
.chg-item:first-child .chg-dot { background: #00b277; box-shadow: 0 0 0 3px #d1f3e6; }
.chg-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chg-head h3 { font-size: 15px; font-weight: 700; color: #333; }
.chg-date { font-size: 12px; color: #999; }
.chg-tag {
  font-size: 11px; line-height: 1; padding: 4px 8px;
  border-radius: 3px; color: #fff; font-style: normal;
}
.chg-tag.new  { background: #ff6500; }
.chg-tag.fix  { background: #e74c3c; }
.chg-tag.opt  { background: #2196F3; }
.chg-tag.api  { background: #00b277; }
.chg-body { margin-top: 9px; border: 1px solid #eee; border-radius: 6px; background: #fafbfc; padding: 12px 15px; }
.chg-body ul { list-style: none; }
.chg-body li { font-size: 13px; color: #555; line-height: 2; position: relative; padding-left: 14px; }
.chg-body li::before {
  content: ""; position: absolute; left: 0; top: .95em;
  width: 5px; height: 5px; background: #ff9136;
}
html.dark .chg-item::before { background: #2c2f33; }
html.dark .chg-head h3 { color: #f0f2f5; }
html.dark .chg-body { background: #1f2224; border-color: #2c2f33; }
html.dark .chg-body li { color: #a8adb8; }
html.dark .chg-dot { box-shadow: 0 0 0 3px #3a2b1f; }
html.dark .chg-item:first-child .chg-dot { box-shadow: 0 0 0 3px #16352c; }
@media (max-width: 768px) { .chg-wrap { margin-top: 0; } }
</style>
