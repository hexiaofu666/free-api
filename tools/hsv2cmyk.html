<body data-tool="hsv2cmyk" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="cp-box" id="preview">#FF6500</div>
    <div class="crow">
      <div class="side">

        <div class="fin"><label>饱和度 S (0~100%)</label><input id="s" type="number" min="0" max="100" step="0.1" value="100"></div>
        <div class="fin"><label>明度 V (0~100%)</label><input id="v" type="number" min="0" max="100" step="0.1" value="100"></div>
      </div>
      <span class="to">TO</span>
      <div class="side">
        <div class="fin"><label>青 C (0~100%)</label><input id="c" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>品红 M (0~100%)</label><input id="m" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>黄 Y (0~100%)</label><input id="y" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>黑 K (0~100%)</label><input id="k" type="number" min="0" max="100" step="0.1"></div>
      </div>
    </div>
    <p style="font-size:12px;color:#bbb;line-height:2;">修改任意一侧的值，另一侧实时同步转换（内部经 RGB 换算）。</p>

  <div class="resttips">
    <h4>关于HSV/CMYK相互转换工具介绍：</h4>
    <p>1、HSV 基于色调、饱和度、明度描述颜色，常用于调色；CMYK 是印刷四色模型。</p>
    <p>2、两者不能直接转换，本工具以 RGB 作为中间桥梁完成换算。</p>
    <p>3、修改任意一侧的值即可实时得到另一侧的转换结果。</p>

<script>
const $ = id => document.getElementById(id);
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  return [h, max ? +(d / max * 100).toFixed(1) : 0, +(max * 100).toFixed(1)];
}
function hsv2rgb(h, s, v) {
  s /= 100; v /= 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let rgb;
  if (h < 60) rgb = [c, x, 0];
  else if (h < 120) rgb = [x, c, 0];
  else if (h < 180) rgb = [0, c, x];
  else if (h < 240) rgb = [0, x, c];
  else if (h < 300) rgb = [x, 0, c];
  else rgb = [c, 0, x];
  return rgb.map(u => Math.round((u + m) * 255));
}
function rgb2cmyk(r, g, b) {
  const R = r / 255, G = g / 255, B = b / 255;
  const k = 1 - Math.max(R, G, B);
  if (k === 1) return [0, 0, 0, 100];
  return [(1 - R - k) / (1 - k), (1 - G - k) / (1 - k), (1 - B - k) / (1 - k), k].map(u => +(u * 100).toFixed(1));
}
function cmyk2rgb(c, m, y, k) { return [c, m, y].map(u => Math.round(255 * (1 - u / 100) * (1 - k / 100))); }
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase(); }
function paint(r, g, b) {
  const hex = toHex(r, g, b);
  $("preview").style.background = hex;
  $("preview").textContent = hex;
}
function pct(id) { return Math.min(100, Math.max(0, +$(id).value || 0)); }
function fromHsv() {
  let h = +$("h").value || 0, s = pct("s"), v = pct("v");
  h = ((h % 360) + 360) % 360;
  const [r, g, b] = hsv2rgb(h, s, v);
  const [c, m, y, k] = rgb2cmyk(r, g, b);
  $("c").value = c; $("m").value = m; $("y").value = y; $("k").value = k;
  paint(r, g, b);
}
function fromCmyk() {
  const [r, g, b] = cmyk2rgb(pct("c"), pct("m"), pct("y"), pct("k"));
  const [h, s, v] = rgb2hsv(r, g, b);
  $("h").value = h; $("s").value = s; $("v").value = v;
  paint(r, g, b);
}
["h", "s", "v"].forEach(id => $(id).addEventListener("input", fromHsv));
["c", "m", "y", "k"].forEach(id => $(id).addEventListener("input", fromCmyk));
fromHsv();
</script>
