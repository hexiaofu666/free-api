<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大龄宝宝在线计算 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.3"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.3">
<style>
.baby-result { text-align: center; margin-top: 30px; font-size: 15px; color: #888ea2; line-height: 2.4; }
.baby-result b { font-size: 32px; color: #ff6500; margin: 0 4px; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];

</head>
<body data-tool="babyage" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mdiv">
      <div class="mlf" style="display:flex;align-items:center;justify-content:center;">
        <div class="baby-result" id="result">选择出生日期，看看你是多少个月的宝宝~</div>
      </div>
      <div class="mlr">
        <div class="fbox">
          <div class="fitem"><label>出生日期</label><input type="date" id="birth"></div>
        </div>
        <p style="font-size:12px;color:#bbb;line-height:2;">输入出生日期，计算你已经出生多少个月、多少天。</p>
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于大龄宝宝计算器工具介绍：</h4>
    <p>不管你多少岁，在妈妈眼里永远是宝宝。本工具根据出生日期计算你是"多少个月的宝宝"，并展示已出生的总天数，趣味十足。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.3"></script>
<script src="../assets/chrome.js?v=1.5.3"></script>
<script>
document.getElementById("birth").addEventListener("change", e => {
  const b = new Date(e.target.value);
  const out = document.getElementById("result");
  if (isNaN(b.getTime())) { out.textContent = "请选择有效日期"; return; }
  const now = new Date();
  if (b > now) { out.textContent = "🤔 未来出生？请检查日期"; return; }
  let months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) months--;
  const days = Math.floor((now - b) / 86400000);
  out.innerHTML = `你已经 <b>${months}</b> 个月的宝宝啦<br>也就是 ${Math.floor(months / 12)} 岁 ${months % 12} 个月，共活了 <b style="font-size:20px">${days.toLocaleString()}</b> 天`;
});
</script>
</body>
</html>
