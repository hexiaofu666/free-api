<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半球体积计算器 - 词海工具箱</title>
<meta name="description" content="在线半球体积计算器，输入半径或直径即可按 V = 2/3πr³ 算出半球体体积，附带公式与计算步骤。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();

<link rel="canonical" href="https://tools.hdemba.cn/tools/hemivolume.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="hemivolume" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知量</label>
        <select id="mode"><option value="r">半径 r</option><option value="d">直径 d</option></select>
      </div>
      <div class="fitem"><label>数值</label><input type="text" id="val" value="3"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算体积</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">输入半径或直径后计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于半球体积计算器介绍：</h4>
    <ol>
      <li>半球体体积公式：V = 2/3 × π × r³，其中 r 为球体半径。</li>
      <li>若已知直径，半径等于直径的一半，工具会自动换算。</li>
      <li>计算结果保留四位小数，π 取 3.141592653589793。</li>
      <li>半球在工程中常见于球形储罐、穹顶结构的容积估算。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var PI = Math.PI;
function __xfHemiVolume(r) { return 2 / 3 * PI * r * r * r; }
function __xfHemiVolumeFromDiameter(d) { return __xfHemiVolume(d / 2); }
function __xfRound4(v) { return Math.round(v * 10000) / 10000; }
function run() {
  var mode = $("mode").value;
  var x = Number($("val").value);
  if (!isFinite(x) || x <= 0) { $("tip").textContent = "⚠️ 请输入大于 0 的数值"; $("res").innerHTML = ""; return; }
  var r = mode === "d" ? x / 2 : x;
  var v = __xfHemiVolume(r);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>半径 r = " + __xfRound4(r) + "</div>" +
    "<div>公式：V = 2/3 × π × r³</div>" +
    "<div>代入：V = 2/3 × π × " + __xfRound4(r) + "³</div>" +
    "<div>半球体积 = <b style='color:#b87f4d;font-size:16px;'>" + __xfRound4(v) + "</b></div>";
  return v;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("val").value = ""; $("res").innerHTML = ""; $("tip").textContent = "输入半径或直径后计算"; };
run();
</script>
</body>
</html>
