<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间进度条在线查看 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.3"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.3">
<style>
.p-item { margin: 20px 0; }
.p-title { display: flex; justify-content: space-between; font-size: 14px; color: #34495e; margin-bottom: 8px; }
.p-title small { color: #bbb; font-weight: normal; }
.p-title b { color: #ff6500; font-variant-numeric: tabular-nums; }
.p-bar { height: 14px; background: #f0f0f0; border-radius: 999px; overflow: hidden; }
.p-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffb27a, #ff6500); }
</style>
<script>
var _hmt = _hmt || [];

var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

</head>
<body data-tool="progresstime" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mlf" id="area"></div>
  </div>
  <div class="resttips">
    <h4>关于时间进度条工具介绍：</h4>
    <p>实时展示今天、本周、本月、今年的时间进度百分比，直观感受时间的流逝，是自我管理与激励的小神器。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.3"></script>
<script src="../assets/chrome.js?v=1.5.3"></script>
<script>
const pad = n => String(n).padStart(2, "0");
function calc() {
  const now = new Date();
  const y = now.getFullYear();
  const secToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const wd = (now.getDay() + 6) % 7;
  const monthDays = new Date(y, now.getMonth() + 1, 0).getDate();
  const yearStart = new Date(y, 0, 1);
  const yearDays = (new Date(y + 1, 0, 1) - yearStart) / 86400000;
  const yearPct = (now - yearStart) / 1000 / (yearDays * 86400) * 100;
  return [
    ["今日进度", secToday / 86400 * 100, `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} / 24:00`],
    ["本周进度", (wd * 86400 + secToday) / (7 * 86400) * 100, `周${"一二三四五六日"[wd]}`],
    ["本月进度", ((now.getDate() - 1) * 86400 + secToday) / (monthDays * 86400) * 100, `${now.getMonth() + 1}月 ${now.getDate()}日 / ${monthDays}日`],
    ["今年进度", yearPct, `${y}年 已过 ${Math.floor(yearPct / 100 * yearDays)} 天 / 共 ${yearDays} 天`],
  ];
}
function render() {
  document.getElementById("area").innerHTML = calc().map(([name, pct, tip]) => `
    <div class="p-item">
      <div class="p-title"><span>${name}　<small>${tip}</small></span><b>${pct.toFixed(2)}%</b></div>
      <div class="p-bar"><div class="p-fill" style="width:${Math.min(100, pct)}%"></div></div>
    </div>`).join("");
}
render(); setInterval(render, 1000);
</script>
</body>
</html>
