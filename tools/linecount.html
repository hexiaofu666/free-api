<body data-tool="linecount" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>粘贴文本内容（或上传 .txt / .log / .csv）</label>
        <textarea id="txt" style="height:150px;" placeholder="把文件内容粘贴到这里，或点击下方选择文件"></textarea>
      </div>
      <div class="fitem"><label>上传文件</label><input type="file" id="file"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始统计</button>
      <button class="fbtn gray" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">统计结果</strong></div>
      <div id="res" class="lc-box"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于大文件行数统计工具介绍：</h4>
    <ol>
      <li>快速统计文本的总行数、非空行数、空行数，以及字符数、单词数与 UTF-8 编码后的字节大小。</li>
      <li>支持 Windows（\r\n）、Unix（\n）、Mac（\r）三种换行格式，统计结果一致。</li>
      <li>可直接粘贴内容，也可上传本地文本文件（读取时不会上传到服务器，全部在浏览器本地完成）。</li>
      <li>适合校对代码行数、日志分析、文章字数核对等场景。</li>

</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
/* UTF-8 字节长度 */
function __xfUtf8Bytes(str) {
  let n = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c < 0x80) n += 1;
    else if (c < 0x800) n += 2;
    else if (c >= 0xD800 && c <= 0xDBFF) { n += 4; i++; }
    else n += 3;
  }
  return n;
}

/* 行数/字符数统计 */
function __xfLineStats(text) {
  const s = String(text == null ? "" : text);
  const normalized = s.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const lines = normalized.split("\n");
  // 末尾换行符导致的最后空串不计入行数
  let total = lines.length;
  if (normalized !== "" && normalized.endsWith("\n")) total = lines.length - 1;
  if (normalized === "") total = 0;
  const arr = normalized === "" ? [] : normalized.split("\n");
  if (normalized.endsWith("\n")) arr.pop();
  const empty = arr.filter(l => l.trim() === "").length;
  const words = (normalized.match(/[A-Za-z0-9_\u4e00-\u9fa5]+/g) || []).length;
  const enWords = (normalized.match(/[A-Za-z0-9_'-]+/g) || []).length;
  const cjk = (normalized.match(/[\u4e00-\u9fa5]/g) || []).length;
  return {
    lines: total,
    nonEmpty: total - empty,
    empty: empty,
    chars: normalized.length,
    charsNoSpace: normalized.replace(/\s/g, "").length,
    enWords: enWords,
    tokens: words,
    cjk: cjk,
    bytes: __xfUtf8Bytes(normalized)
  };
}

window.__xfLineStats = __xfLineStats;
window.__xfUtf8Bytes = __xfUtf8Bytes;

const $ = id => document.getElementById(id);
function fmt(n) { return n.toLocaleString("en-US"); }
function run() {
  const r = __xfLineStats($("txt").value);
  const cards = [
    ["总行数", fmt(r.lines), ""],
    ["非空行", fmt(r.nonEmpty), ""],
    ["空行", fmt(r.empty), ""],
    ["字符数", fmt(r.chars), ""],
    ["不含空白字符", fmt(r.charsNoSpace), ""],
    ["英文单词数", fmt(r.enWords), ""],
    ["中文字数", fmt(r.cjk), ""],
    ["UTF-8 字节数", fmt(r.bytes), " ≈ " + (r.bytes / 1024).toFixed(2) + " KB"]
  ];
  $("res").innerHTML = cards.map(([k, v, extra]) => '<div class="lc-card"><div class="lc-v">' + v + '</div><div class="lc-k">' + k + '<span>' + extra + "</span></div></div>").join("");
  $("tip").textContent = "统计完成";
}
$("runBtn").onclick = run;
$("txt").addEventListener("input", run);
$("clrBtn").onclick = () => { $("txt").value = ""; $("file").value = ""; run(); };
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { $("txt").value = reader.result; run(); $("tip").textContent = "已读取文件：" + f.name; };
  reader.readAsText(f);
};
$("txt").value = "第一行内容\n\n第三行有中文和 English words\n\n第五行\n";
run();
</script>
<style>
.lc-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.lc-card{border:1px solid #eee;border-radius:8px;padding:12px 14px;background:#fafafa;}
.lc-v{font-size:20px;font-weight:700;color:#ff6500;line-height:1.2;word-break:break-all;}
.lc-k{font-size:12px;color:#888;margin-top:6px;}
.lc-k span{color:#bbb;}
html.dark .lc-card{background:#22262b;border-color:#333a42;}
html.dark .lc-k{color:#999;}
</style>
