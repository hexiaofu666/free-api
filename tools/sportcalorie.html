<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动消耗卡路里计算器 - 词海工具箱</title>
<meta name="description" content="在线运动消耗卡路里计算器，按体重、运动项目与时长用 MET 代谢当量算出消耗千卡数，支持慢跑、游泳、跳绳、骑行等十余种常见运动。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/sportcalorie.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="sportcalorie" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>体重（kg）</label><input type="text" id="kg" value="70"></div>
      <div class="fitem"><label>运动项目</label>
        <select id="sport"></select>
      </div>
      <div class="fitem"><label>运动时长（分钟）</label><input type="text" id="min" value="30"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算消耗</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写体重与时长后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于运动消耗卡路里计算器介绍：</h4>
    <ol>
      <li>消耗热量（千卡）= MET 值 × 体重（kg）× 运动时长（小时），MET 为代谢当量，表示该运动相对静息的耗能倍数。</li>
      <li>常见 MET 参考：散步 3.0、快走 4.3、慢跑 8.3、跑步 11.8、骑行 4.0、游泳 7.0、跳绳 12.3、瑜伽 2.5。</li>
      <li>运动强度越高、体重越大、时间越长，消耗的热量越多，个人体能差异也会影响实际消耗。</li>
      <li>减掉 1 公斤脂肪大约需要消耗 7700 千卡，因此单次运动的消耗需要长期积累才能见效。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var __xfSports = [
  { k: "walk", n: "散步（4 km/h）", met: 3.0 },
  { k: "fastwalk", n: "快走（6 km/h）", met: 4.3 },
  { k: "jog", n: "慢跑（8 km/h）", met: 8.3 },
  { k: "run", n: "跑步（12 km/h）", met: 11.8 },
  { k: "bike", n: "休闲骑行", met: 4.0 },
  { k: "swim", n: "游泳（自由泳）", met: 7.0 },
  { k: "rope", n: "跳绳", met: 12.3 },
  { k: "yoga", n: "瑜伽", met: 2.5 },
  { k: "ball", n: "篮球", met: 6.5 },
  { k: "badminton", n: "羽毛球", met: 5.5 },
  { k: "strength", n: "力量训练", met: 5.0 },
  { k: "stairs", n: "爬楼梯", met: 8.8 },
  { k: "dance", n: "广场舞", met: 5.0 },
  { k: "taichi", n: "太极", met: 3.0 }
];
function __xfMet(k) {
  for (var i = 0; i < __xfSports.length; i++) { if (__xfSports[i].k === k) return __xfSports[i].met; }
  return 0;
}
function __xfSportName(k) {
  for (var i = 0; i < __xfSports.length; i++) { if (__xfSports[i].k === k) return __xfSports[i].n; }
  return "";
}
function __xfKcal(met, kg, min) { return met * kg * (min / 60); }
function __xfToFatG(kcal) { return kcal / 7700 * 1000; }
function __xfRound0(v) { return Math.round(v); }
function __xfRound1(v) { return Math.round(v * 10) / 10; }
function initSports() {
  var sel = $("sport");
  if (!sel) return;
  var html = "";
  for (var i = 0; i < __xfSports.length; i++) {
    html += "<option value='" + __xfSports[i].k + "'>" + __xfSports[i].n + "</option>";
  }
  sel.innerHTML = html;
}
function run() {
  var kg = Number($("kg").value), min = Number($("min").value);
  var k = $("sport").value || "jog";
  if (!(kg > 0) || !(min > 0)) { $("tip").textContent = "⚠️ 请填写大于 0 的体重与时长"; $("res").innerHTML = ""; return null; }
  var met = __xfMet(k), kcal = __xfKcal(met, kg, min);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>" + kg + " kg · " + __xfSportName(k) + " · " + min + " 分钟</div>" +
    "<div>消耗热量：<b style='color:#e08a2e;font-size:16px;'>" + __xfRound0(kcal) + " 千卡</b></div>" +
    "<div>MET 代谢当量：" + met + "</div>" +
    "<div>折合脂肪约：" + __xfRound1(__xfToFatG(kcal)) + " 克</div>" +
    "<div style='color:#888;'>相当于每小时消耗 " + __xfRound0(__xfKcal(met, kg, 60)) + " 千卡</div>";
  return kcal;
}
initSports();
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
