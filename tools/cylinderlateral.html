<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆柱侧面积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆柱侧面积计算器，输入半径与高算出圆柱侧面积与展开尺寸，支持按底面周长或直径换算。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/cylinderlateral.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="cylinderlateral" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知</label>
        <select id="mode"><option value="r">底面半径 r</option><option value="d">底面直径 d</option><option value="c">底面周长 C</option></select>
      </div>
      <div class="fitem"><label>数值</label><input type="text" id="src" value="3"></div>
      <div class="fitem"><label>高 h</label><input type="text" id="h" value="10"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">侧面积 = 底面周长 × 高</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆柱侧面积计算器介绍：</h4>
    <ol>
      <li>侧面积公式为 S侧 = 2πrh，也可理解为底面周长乘高。</li>
      <li>可按半径、直径、底面周长三种方式输入，程序自动换算。</li>
      <li>展开后即为长（底面周长）× 宽（高）的矩形，下料时按此尺寸裁剪。</li>
      <li>若还需考虑咬口或搭接余量，请在结果上自行加上工艺放量。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfRadiusByMode(mode, v) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return null;
  if (mode === "d") return n / 2;
  if (mode === "c") return n / (2 * Math.PI);
  return n;
}
function __xfCylinderLateral(r, h, dec) {
  var x = Number(r), y = Number(h);
  if (!isFinite(x) || !isFinite(y) || x <= 0 || y <= 0) return null;
  var c = 2 * Math.PI * x, lateral = c * y;
  return { r: x, h: y, round: c, lateral: lateral, text: { lateral: String(__xfRound(lateral, dec)), round: String(__xfRound(c, dec)) } };
}
function run() {
  var r = __xfRadiusByMode($("mode").value, $("src").value);
  var o = r === null ? null : __xfCylinderLateral(r, $("h").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>侧面积 = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.lateral + "</b></div>" +
    "<div style='color:#888;'>底面周长 = " + o.text.round + "，高 = " + o.h + "，展开为 " + o.text.round + " × " + o.h + "</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
