    <p>1、IPv4 地址可映射为 IPv6 地址（IPv4-mapped IPv6 address，::ffff:0:0/96 段），这是 IPv4 向 IPv6 过渡的常用表示方式。</p>

<script>
const $ = id => document.getElementById(id);
function convertIPv4ToMapped(raw) {
  const s = raw.trim();
  const segs = s.split(".").map(x => x.trim());
  if (segs.length !== 4) throw new Error("IPv4地址格式错误");
  const nums = segs.map((seg, i) => {
    if (!/^\d{1,3}$/.test(seg)) throw new Error("第" + (i + 1) + "段 \"" + seg + "\" 不是有效的数字");
    const n = parseInt(seg, 10);
    if (isNaN(n) || n < 0 || n > 255) throw new Error("第" + (i + 1) + "段数值必须在0～255之间");
    return n;
  });
  const dec = ((nums[0] << 24) >>> 0) + (nums[1] << 16) + (nums[2] << 8) + nums[3];
  const hex8 = dec.toString(16).toLowerCase().padStart(8, "0");
  const groups = [0, 0, 0, 0, 0, 0xffff, (dec >> 16) & 0xffff, dec & 0xffff];
  const full = groups.map(g => g.toString(16).toLowerCase().padStart(4, "0")).join(":");
  const noLead = groups.map(g => g.toString(16).toLowerCase()).join(":");
  // RFC 5952：找最长连续零段（≥2）用 :: 替代
  let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
  for (let i = 0; i < groups.length; i++) {
    if (groups[i] === 0) { if (curStart === -1) { curStart = i; curLen = 1; } else curLen++; }
    else { if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; } curStart = -1; curLen = 0; }
  }
  if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
  let comp;
  if (bestLen >= 2) {
    const head = groups.slice(0, bestStart).map(g => g.toString(16).toLowerCase()).join(":");
    const tail = groups.slice(bestStart + bestLen).map(g => g.toString(16).toLowerCase()).join(":");
    comp = head === "" ? "::" + tail : (tail === "" ? head + "::" : head + "::" + tail);
  } else comp = noLead;
  return { original: s, ipv4Decimal: String(dec), ipv4Hex: "0x" + hex8.toUpperCase(), ipv6Full: full, ipv6Compressed: comp, ipv6NoLeadingZero: noLead };
}
const row = (label, val) => `<div class="row"><span>${label}</span><div>${val}</div></div>`;
window.ipv4to6_run = function() {
  const lines = $("input").value.split(/\r?\n/).map(x => x.trim()).filter(x => x !== "");
  if (lines.length < 1) { alert("等处理的IPV4地址不能为空或错误"); return; }
  let html = "";
  lines.forEach(line => {
    try {
      const r = convertIPv4ToMapped(line);
      html += `<div class="ipres">` + row("IPv4 地址", r.original) + row("IPv4 数字格式", r.ipv4Decimal) + row("IPv4 十六进制", r.ipv4Hex) + row("IPv6 完整格式", r.ipv6Full) + row("IPv6 压缩", r.ipv6Compressed) + row("IPv6 前导零压缩", r.ipv6NoLeadingZero) + `</div>`;
    } catch (e) {
      html += `<div class="ipres">` + row("IPv4 地址", line) + row("错误提示", e.message) + `</div>`;
    }
  });
  $("res").innerHTML = html;
  $("res").style.display = "block";
};
window.ipv4to6_demo = function() {
  $("input").value = ["192.168.1.1", "10.0.0.1", "127.0.0.1", "8.8.8.8", "0.0.0.0", "172.16.0.1", "255.255.255.255", "169.254.12.34"].join("\n");
  $("res").style.display = "none";
};
$("convBtn").onclick = () => window.ipv4to6_run();
$("demoBtn").onclick = () => window.ipv4to6_demo();
$("clearBtn").onclick = () => { $("input").value = ""; $("res").style.display = "none"; };
</script>
