      <li>距离过近容易看到像素点且伤眼，过远则失去高清细节带来的沉浸感。</li>

<script>
/* 计算电视观看参数 */
function __xfTvDistance(diagInch, resKey, ratioKey) {
  const d = Number(diagInch);
  if (!d || d <= 0) return { error: "请输入合法的屏幕尺寸" };
  const ratioMap = { "16:9": [16, 9], "21:9": [21, 9], "4:3": [4, 3] };
  const [rw, rh] = ratioMap[ratioKey] || [16, 9];
  const diagPx = Math.sqrt(rw * rw + rh * rh);
  const hInch = d * rh / diagPx;
  const wInch = d * rw / diagPx;
  const hM = hInch * 0.0254;
  const wM = wInch * 0.0254;
  const factorMap = { "1080": 3, "4k": 1.5, "8k": 1 };
  const f = factorMap[resKey] || 1.5;
  const best = hM * f;
  const min = hM * f * 0.75;
  const max = hM * f * 1.35;
  // 推荐视野角（水平）
  const fov = 2 * Math.atan((wM / 2) / best) * 180 / Math.PI;
  return {
    screenW: wM.toFixed(2), screenH: hM.toFixed(2),
    best: best.toFixed(2), min: min.toFixed(2), max: max.toFixed(2),
    fov: Math.round(fov),
    factor: f
  };
}
window.__xfTvDistance = __xfTvDistance;

const $ = id => document.getElementById(id);
function run() {
  const r = __xfTvDistance($("size").value, $("res").value, $("ratio").value);
  if (r.error) { $("res").innerHTML = '<p style="color:#e54d42;font-size:13px;">' + r.error + "</p>"; $("tip").textContent = "计算失败"; return; }
  const cards = [
    ["最佳观看距离", r.best + " 米"], ["舒适范围", r.min + " ~ " + r.max + " 米"],
    ["屏幕物理宽度", r.screenW + " 米"], ["屏幕物理高度", r.screenH + " 米"],
    ["推荐水平视野角", r.fov + "°"]
  ];
  $("res").innerHTML = cards.map(([k, v]) => '<div class="tv-card"><div class="tv-k">' + k + '</div><div class="tv-v">' + v + "</div></div>").join("");
  // 速查表
  const d = Number($("size").value);
  const rows = [["1080P", 3], ["4K", 1.5], ["8K", 1]].map(([name, f]) => {
    const rr = __xfTvDistance(d, name === "1080P" ? "1080" : name.toLowerCase(), $("ratio").value);
    return "<tr><td>" + name + "</td><td>" + (rr.error ? "-" : rr.best + " 米") + "</td></tr>";
  }).join("");
  $("chart").innerHTML = '<table class="tv-table"><thead><tr><th>分辨率</th><th>推荐观看距离</th></tr></thead><tbody>' + rows + "</tbody></table>";
  $("tip").textContent = "计算结果（" + d + " 英寸）";
}
["size", "res", "ratio"].forEach(id => { $(id).addEventListener("input", run); $(id).addEventListener("change", run); });
$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("size").value = 65; $("res").value = "4k"; $("ratio").value = "16:9"; run(); };
run();
</script>
