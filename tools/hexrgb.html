<body data-tool="hexrgb" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="cp-box" id="preview">#FF6500</div>
    <div class="crow">
      <div class="side">
        <div class="fin"><label>红 (R:0~255)</label><input id="r" type="number" min="0" max="255" value="255"></div>
        <div class="fin"><label>绿 (G:0~255)</label><input id="g" type="number" min="0" max="255" value="101"></div>
        <div class="fin"><label>蓝 (B:0~255)</label><input id="b" type="number" min="0" max="255" value="0"></div>
      </div>
      <span class="to">TO</span>
      <div class="side">
        <div class="fin"><label>HEX 值</label><input id="hex" value="#FF6500" spellcheck="false"></div>
        <div class="fin"><label>取色器</label><input type="color" id="picker" value="#ff6500" style="height:36px;width:60px;padding:2px;cursor:pointer;flex:none;"></div>
      </div>
    </div>
    <p style="font-size:12px;color:#bbb;line-height:2;">修改任意一侧的值，另一侧实时同步转换。</p>
  </div>
  <div class="resttips">
    <h4>关于RGB/16进制转换工具介绍：</h4>
    <p>1、RGB（Red, Green, Blue）是一种加色模型，它使用红、绿、蓝三种原色光的混合来创建其他所有颜色。</p>
    <p>2、十六进制颜色编码是一种数字格式，通常用于计算机图形和网页设计，如 #FF6500。</p>
    <p>3、本工具可以通过修改 16 进制或 RGB 颜色的值让它们之间进行相互转换。</p>
  </div>

<script src="../assets/tools-data.js?v=1.5.5"></script>
<script src="../assets/chrome.js?v=1.5.5"></script>
<script>
const $ = id => document.getElementById(id);
function clamp(v) { v = Math.round(+v || 0); return Math.min(255, Math.max(0, v)); }
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase(); }
function paint(r, g, b) {
  const hex = toHex(r, g, b);
  $("preview").style.background = hex;
  $("preview").textContent = hex;
  $("hex").value = hex;
  $("picker").value = hex;
}
function fromRgb() { paint(clamp($("r").value), clamp($("g").value), clamp($("b").value)); }
function fromHex() {
  let v = $("hex").value.trim().replace(/^#/, "");
  if (/^[0-9a-fA-F]{3}$/.test(v)) v = v.split("").map(c => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(v)) return;
  const n = parseInt(v, 16);
  const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  $("r").value = r; $("g").value = g; $("b").value = b;
  paint(r, g, b);
}
["r", "g", "b"].forEach(id => $(id).addEventListener("input", fromRgb));
$("hex").addEventListener("input", fromHex);
$("picker").addEventListener("input", e => { const n = parseInt(e.target.value.slice(1), 16); $("r").value = n >> 16 & 255; $("g").value = n >> 8 & 255; $("b").value = n & 255; paint(n >> 16 & 255, n >> 8 & 255, n & 255); });
fromRgb();
</script>
