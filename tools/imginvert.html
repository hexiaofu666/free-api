<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片反相在线 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="在线图像反相/反色工具，批量将照片转为底片效果，浏览器本地处理不上传">
<link rel="canonical" href="https://tools.hdemba.cn/tools/imginvert.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="imginvert" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>选择图片（可多张）</label><input type="file" id="file" accept="image/*" multiple style="height:38px;padding:6px 10px;"></div>
      <div class="fitem"><label>反相强度</label>
        <select id="strength">
          <option value="255" selected>完全反相（底片效果）</option>
          <option value="180">强反相</option>
          <option value="128">半反相（灰化）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始反相并下载</button>
      <button class="fbtn brown" id="zipBtn" style="display:none;">打包下载全部</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>反相结果</strong><span id="cnt"></span></div>
      <div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于图像反相/反色工具介绍：</h4>
    <ol>
      <li>本工具可以将图片批量反相（反色），生成底片效果。</li>
      <li>支持调整反相强度：完全反相（每通道 255-原值）、强反相、半反相。</li>
      <li>反相算法：新像素值 = 强度 - 原像素值，对 R、G、B 三个通道分别处理。</li>
      <li>本工具在您的浏览器中本地处理，图片不会上传至服务器，请放心使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script src="../assets/lib/zip.js"></script>
<script>
const $=id=>document.getElementById(id);
let imgs=[];
function loadFiles(fs){
  imgs=[];
  const tasks=[...fs].map(f=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{imgs.push({name:f.name,img});res();};
    img.src=URL.createObjectURL(f);
  }));
  Promise.all(tasks).then(()=>{ if(imgs.length)$("runBtn").click(); });
}
$("file").onchange=e=>loadFiles(e.target.files);
$("runBtn").onclick=()=>{
  if(!imgs.length){alert("请先选择图片");return;}
  const K=+$("strength").value, list=$("list");
  list.innerHTML=""; window._out=[];
  imgs.forEach(it=>{
    const cv=document.createElement("canvas");
    cv.width=it.img.width; cv.height=it.img.height;
    const ctx=cv.getContext("2d");
    ctx.drawImage(it.img,0,0);
    const d=ctx.getImageData(0,0,cv.width,cv.height);
    for(let i=0;i<d.data.length;i+=4){
      d.data[i]=K-d.data[i]; d.data[i+1]=K-d.data[i+1]; d.data[i+2]=K-d.data[i+2];
    }
    ctx.putImageData(d,0,0);
    const url=cv.toDataURL("image/png");
    const base=it.name.replace(/\.[^.]+$/,"");
    window._out.push({name:`${base}_invert.png`,dataUrl:url});
    const box=document.createElement("div");
    box.style.textAlign="center";
    box.innerHTML=`<img src="${url}" style="max-width:100%;max-height:120px;border:1px solid #eee;border-radius:4px;display:block;margin:0 auto;">
      <a download="${base}_invert.png" href="${url}" style="font-size:12px;color:#ff6500;">下载</a>`;
    list.appendChild(box);
  });
  $("cnt").textContent=`共 ${imgs.length} 张`;
  $("zipBtn").style.display=imgs.length>1?"":"none";
  $("outBox").classList.add("on");
};
$("zipBtn").onclick=()=>{
  const files=window._out.map(p=>({name:p.name,data:new Uint8Array(Array.from(atob(p.dataUrl.split(",")[1]),c=>c.charCodeAt(0)))}));
  const a=document.createElement("a");
  a.download="inverted.zip"; a.href=URL.createObjectURL(zipMake(files)); a.click();
};
$("clearBtn").onclick=()=>{$("outBox").classList.remove("on");$("list").innerHTML="";imgs=[];$("zipBtn").style.display="none";};
</script>
</body>
</html>
