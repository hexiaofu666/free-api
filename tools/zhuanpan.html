<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸运大转盘 - 词海工具箱</title>
<meta name="description" content="在线幸运大转盘抽奖工具，把候选项目按行填入即可随机抽取中奖结果，支持不重复抽取与固定种子复现。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/zhuanpan.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="zhuanpan" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>候选项（每行一个）</label>
        <textarea id="opts" style="height:130px;">一等奖
二等奖
三等奖
参与奖
再来一次</textarea>
      </div>
      <div class="fitem"><label>抽取数量</label><input type="text" id="num" value="1"></div>
      <div class="fitem"><label>是否允许重复</label>
        <select id="rep"><option value="0">不重复抽取</option><option value="1">允许重复</option></select>
      </div>
      <div class="fitem"><label>随机种子（可留空）</label><input type="text" id="seed" value="" placeholder="填相同数字可复现"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始抽取</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填好候选项后点击抽取</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:14px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于幸运大转盘介绍：</h4>
    <ol>
      <li>候选项每行一个，空行会被自动忽略，抽取数量超过候选项数量时会自动限制为候选项总数。</li>
      <li>选择不重复抽取时，同一次抽奖中每个候选项最多出现一次，适合抽奖与分组场景。</li>
      <li>填入相同的随机种子可以在相同候选项下复现完全一致的抽奖结果，方便现场演示与结果留档。</li>
      <li>本工具为纯前端随机抽取，结果由浏览器本地计算，不联网、不上传任何数据。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRng(seed) {
  var s = ((seed >>> 0) || 1) >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
}
function __xfParseOptions(text) {
  return String(text == null ? "" : text).split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
}
function __xfDraw(options, count, seed, allowRepeat) {
  var list = options.slice();
  var n = Math.floor(Number(count));
  if (!isFinite(n) || n < 1) n = 1;
  if (!allowRepeat && n > list.length) n = list.length;
  var rnd = __xfRng(seed), out = [];
  if (allowRepeat) {
    for (var i = 0; i < n; i++) out.push(list[Math.floor(rnd() * list.length)]);
    return out;
  }
  for (var j = 0; j < n; j++) {
    var k = Math.floor(rnd() * list.length);
    out.push(list[k]);
    list.splice(k, 1);
  }
  return out;
}
function run() {
  var opts = __xfParseOptions($("opts").value);
  if (!opts.length) { $("tip").textContent = "⚠️ 请至少填写一个候选项"; $("res").innerHTML = ""; return null; }
  var allowRepeat = ($("rep").value || "0") === "1";
  var seedRaw = String($("seed").value || "").trim();
  var seed = seedRaw === "" ? (Date.now() & 0x7fffffff) : (Number(seedRaw) || 1);
  var out = __xfDraw(opts, $("num").value, seed, allowRepeat);
  $("tip").textContent = "✅ 抽取完成（共 " + opts.length + " 个候选项，种子 " + seed + "）";
  $("res").innerHTML = out.map(function (v, i) {
    return "<div style='padding:6px 0;'>第 " + (i + 1) + " 个：<b style='color:#c0392b;font-size:16px;'>" + v + "</b></div>";
  }).join("");
  return out;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
