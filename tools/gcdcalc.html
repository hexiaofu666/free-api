<body data-tool="gcdcalc" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>整数列表</label><input type="text" id="src" placeholder="例如：12, 18, 24（逗号、空格或换行分隔）" value="12, 18, 24"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">请输入两个及以上整数</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于最大公约数计算器介绍：</h4>
    <ol>
      <li>支持一次输入多个整数，用逗号、空格或换行分隔，例如 12 18 24。</li>
      <li>仅支持整数；小数会先被取整，负数按其绝对值参与计算。</li>
      <li>结果区会给出最大公约数以及两两相除的演算过程，便于核对手算结果。</li>
      <li>最大公约数常用于分数约分、比例化简等场景。</li>
    </ol>
  </div>
</div></div></div>

<script>
var $ = function (id) { return document.getElementById(id); };
function __xfFloor(n) { return n < 0 ? Math.ceil(n) : Math.floor(n); }
function __xfParseNums(text) {
  var parts = String(text).split(/[^0-9.\-]+/);
  var arr = [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i] === "" || parts[i] === "-" || parts[i] === ".") continue;
    var v = Number(parts[i]);
    if (!isFinite(v)) continue;
    arr.push(__xfFloor(Math.abs(v)));
  }
  return arr;
}
function __xfGcd(a, b) {
  a = Math.abs(__xfFloor(a)); b = Math.abs(__xfFloor(b));
  while (b) { var t = a % b; a = b; b = t; }
  return a;
}
function __xfGcdAll(arr) {
  if (!arr || !arr.length) return null;
  var g = arr[0];
  for (var i = 1; i < arr.length; i++) g = __xfGcd(g, arr[i]);
  return g;
}
function __xfGcdSteps(arr) {
  var out = [], g = arr[0];
  for (var i = 1; i < arr.length; i++) {
    out.push("gcd(" + g + ", " + arr[i] + ") = " + __xfGcd(g, arr[i]));
    g = __xfGcd(g, arr[i]);
  }
  return out;
}
function run() {
  var nums = __xfParseNums($("src").value);
  if (nums.length < 2) { $("tip").textContent = "⚠️ 请至少输入两个整数"; $("res").innerHTML = ""; return; }
  var g = __xfGcdAll(nums);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>输入整数：" + nums.join("、") + "</div>" +
    "<div>最大公约数：<b style='color:#4d8bb8;font-size:16px;'>" + g + "</b></div>" +
    "<div style='color:#888;'>验算：各数除以 " + g + " 得 " + nums.map(function (n) { return n / g; }).join("、") + "</div>" +
    (nums.length > 2 ? "<div style='color:#888;'>过程：" + __xfGcdSteps(nums).join("；") + "</div>" : "");
  return g;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("src").value = ""; $("res").innerHTML = ""; $("tip").textContent = "请输入两个及以上整数"; };
run();
</script>
