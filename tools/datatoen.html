<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期英文在线转换 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.2"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.2">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body data-tool="datatoen" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vin"><input id="input" placeholder="输入日期，如 2025-09-23" style="width:100%;box-sizing:border-box;height:44px;border:1px solid #eee;padding:0 12px;font-size:14px;border-radius:0 0 3px 3px;outline:none;"></div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始转换</button>
      <button class="fbtn brown" id="demoBtn">演示数据</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>转换结果</strong><span id="copyBtn">复制</span></div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于日期英文格式介绍：</h4>
    <ol>
      <li>英文日期书写分美式与英式两种习惯：</li>
      <li>美式：月 日, 年（September 23, 2025），月份在前。</li>
      <li>英式：日 月 年（23 September 2025），日期在前。</li>
      <li>本工具同时给出两种格式，可直接复制用于邮件、论文与简历。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.2"></script>
<script src="../assets/chrome.js?v=1.5.2"></script>
<script>
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const $=id=>document.getElementById(id);
$("runBtn").onclick = () => {
  const m = $("input").value.trim().match(/^(\d{4})[-/年.]\s*(\d{1,2})[-/月.]\s*(\d{1,2})/);
  if (!m) return alert("日期格式不正确，示例：2025-09-23");
  const y=+m[1], mo=+m[2], d=+m[3];
  if (mo<1||mo>12||d<1||d>31) return alert("月/日超出范围");
  $("output").value = `美式：${MON[mo-1]} ${d}, ${y}\n英式：${d} ${MON[mo-1]} ${y}`;
  $("outBox").classList.add("on");
};
$("demoBtn").onclick = () => { $("input").value="2025-09-23"; $("runBtn").click(); };
$("clearBtn").onclick = () => { $("input").value=""; $("output").value=""; $("outBox").classList.remove("on"); };
$("copyBtn").onclick = () => { $("output").select(); document.execCommand("copy"); };
</script>
</body>
</html>
