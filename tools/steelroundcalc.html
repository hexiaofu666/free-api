<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不锈钢圆管重量计算器 - 词海工具箱</title>
<meta name="description" content="在线不锈钢圆管理论重量计算器，按外径、壁厚与密度换算每米重量与整根总重，适用于圆管与圆棒型材。">

<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

</head>
<body data-tool="steelroundcalc" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>外径（毫米）</label><input type="number" id="d" value="32" step="0.1"></div>
      <div class="fitem"><label>壁厚（毫米）</label><input type="number" id="t" value="2" step="0.1"></div>
      <div class="fitem"><label>密度（g/cm³）</label><input type="number" id="rho" value="7.93" step="0.01"></div>
      <div class="fitem"><label>单根长度（米）</label><input type="number" id="len" value="6" step="0.1"></div>
      <div class="fitem"><label>根数</label><input type="number" id="qty" value="1" step="1"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算重量</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">圆管理论重量 = π × 壁厚 ×（外径 − 壁厚）× 密度 ÷ 1000</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于不锈钢圆管重量计算器介绍：</h4>
    <ol>
      <li>截面积 = π × 壁厚 ×（外径 − 壁厚），单位为平方毫米。</li>
      <li>每米重量 = 截面积 × 密度 ÷ 1000，外径与壁厚均以毫米计，结果为公斤每米。</li>
      <li>当壁厚等于外径一半时退化为实心圆棒，截面积等于 π 乘半径平方。</li>
      <li>304 不锈钢密度取 7.93 g/cm³，316 取 7.98，常用于管材理算报价。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, d) { var p = Math.pow(10, d === undefined ? 2 : d); return Math.round(v * p) / p; }
function __xfRoundTubeSectionA(d, t) {
  var inner = d - t;
  if (!(d > 0) || !(t > 0) || !(inner > 0)) return 0;
  return Math.PI * t * inner;
}
function __xfRoundTubeMeterWeight(d, t, rho) {
  var s = __xfRoundTubeSectionA(d, t);
  if (!(s > 0)) return 0;
  return s * (rho || 7.93) / 1000;
}
function __xfRoundTubeTotalWeight(d, t, rho, lenM) {
  if (!(lenM > 0)) return 0;
  return __xfRoundTubeMeterWeight(d, t, rho) * lenM;
}
function __xfRoundTubeBatchWeight(d, t, rho, lenM, qty) {
  if (!(qty > 0)) return 0;
  return __xfRoundTubeTotalWeight(d, t, rho, lenM) * qty;
}
function run() {
  var d = Number($("d").value), t = Number($("t").value);
  var rho = Number($("rho").value) || 7.93;
  var lenM = Number($("len").value) || 0;
  var qty = Math.max(1, Math.floor(Number($("qty").value) || 1));
  var s = __xfRoundTubeSectionA(d, t);
  if (!(s > 0)) {
    $("tip").textContent = "⚠️ 壁厚必须小于外径"; $("res").innerHTML = ""; return null;
  }
  var mw = __xfRoundTubeMeterWeight(d, t, rho);
  var one = __xfRoundTubeTotalWeight(d, t, rho, lenM);
  var all = __xfRoundTubeBatchWeight(d, t, rho, lenM, qty);
  $("tip").textContent = "✅ 每米重量 " + __xfRound(mw, 4) + " kg/m";
  $("res").innerHTML =
    "<div>截面积：<b>" + __xfRound(s, 2) + "</b> mm²</div>" +
    "<div style='color:#c0392b;'>每米重量：<b>" + __xfRound(mw, 4) + "</b> kg/m</div>" +
    "<div>单根 " + lenM + " 米重量：<b>" + __xfRound(one, 3) + "</b> kg</div>" +
    "<div>" + qty + " 根合计：<b>" + __xfRound(all, 3) + "</b> kg</div>" +
    "<div style='color:#888;'>规格：Φ" + d + " × " + t + " 毫米，内径 " + __xfRound(d - 2 * t, 1) + " 毫米。</div>";
  return { section: s, meterWeight: mw, perPiece: one, total: all };
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
