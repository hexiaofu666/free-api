    <h4>关于花语大全介绍：</h4>
    <ol>
      <li>共收录 40 种常见鲜花的花语与寓意，支持按花名、寓意、说明三个字段模糊搜索。</li>
      <li>花语有地域与文化差异：例如黄玫瑰在西方多表示友谊与道歉，在中国部分语境中表示失恋。</li>
      <li>送花时可结合场合挑选：表白用红玫瑰、感恩用康乃馨、祝事业用向日葵、婚礼用百合与铃兰。</li>
      <li>白色花朵（白菊、白玫瑰）在部分场合用于祭奠，送人前建议先了解当地习俗。</li>
      <li>本表为常见花语整理，仅供参考，实际含义还会因朵数、配色与赠花场景而变化。</li>
    </ol>

<script>
var FLOWERS = [

];
function __xfFlowerList() { return FLOWERS.map(function (f) { return { name: f[0], mean: f[1], note: f[2] }; }); }
function __xfFlowerSearch(kw) {
  var k = String(kw || "").trim().toLowerCase();
  var all = __xfFlowerList();
  if (!k) return all;
  return all.filter(function (f) {
    return f.name.toLowerCase().indexOf(k) >= 0 || f.mean.toLowerCase().indexOf(k) >= 0 || f.note.toLowerCase().indexOf(k) >= 0;
  });
}
window.__xfFlowerList = __xfFlowerList;
window.__xfFlowerSearch = __xfFlowerSearch;

var $ = function (id) { return document.getElementById(id); };
function paint(list, title) {
  if (!list.length) { $("res").innerHTML = "<p style='color:#999;'>没有找到相关花语，换个关键词试试</p>"; $("tip").textContent = "无结果"; return; }
  $("res").innerHTML = list.map(function (f) {
    return "<p style='margin-bottom:8px;'><b style='color:#e91e63;'>" + f.name + "</b>：<span style='color:#666;'>" + f.mean + "</span><br><span style='color:#999;font-size:12px;'>" + f.note + "</span></p>";
  }).join("");
  $("tip").textContent = title;
}
$("runBtn").onclick = function () { paint(__xfFlowerSearch($("kw").value), "搜索结果（共 " + __xfFlowerSearch($("kw").value).length + " 条）"); };
$("allBtn").onclick = function () { $("kw").value = ""; paint(__xfFlowerList(), "全部花语（共 " + FLOWERS.length + " 种）"); };
$("kw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("runBtn").click(); });
$("kw").addEventListener("input", function () { paint(__xfFlowerSearch(this.value), "搜索中…"); });
paint(__xfFlowerList(), "全部花语（共 " + FLOWERS.length + " 种）");
</script>
