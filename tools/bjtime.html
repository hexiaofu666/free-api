<div class="main"><div class="center"><div class="tools">

<script>
const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
const CITIES = [
  ["北京", 8], ["东京", 9], ["首尔", 9], ["新加坡", 8], ["曼谷", 7], ["迪拜", 4],
  ["莫斯科", 3], ["伦敦", 0], ["巴黎", 1], ["柏林", 1], ["纽约", -5], ["洛杉矶", -8],
  ["悉尼", 11], ["圣保罗", -3]
];

/* 计算某时区当前时间 */
function __xfZoneTime(nowMs, offsetHours) {
  const t = new Date(nowMs + offsetHours * 3600000);
  return {
    time: String(t.getUTCHours()).padStart(2, "0") + ":" + String(t.getUTCMinutes()).padStart(2, "0") + ":" + String(t.getUTCSeconds()).padStart(2, "0"),
    date: t.getUTCFullYear() + "-" + String(t.getUTCMonth() + 1).padStart(2, "0") + "-" + String(t.getUTCDate()).padStart(2, "0"),
    hour: t.getUTCHours()
  };
}
window.__xfZoneTime = __xfZoneTime;

const $ = id => document.getElementById(id);
function tick() {
  const now = Date.now();
  const bj = __xfZoneTime(now, 8);
  $("time").textContent = bj.time;
  $("date").textContent = bj.date;
  const d = new Date(now + 8 * 3600000);
  $("week").textContent = WEEK[d.getUTCDay()];
  $("world").innerHTML = CITIES.map(([name, off]) => {
    const z = __xfZoneTime(now, off);
    const night = z.hour < 6 || z.hour >= 20;
    return '<div class="bt-city' + (night ? " bt-night" : "") + '"><div class="bt-cn">' + name + (off === 8 && name === "北京" ? "" : " UTC" + (off >= 0 ? "+" : "") + off) + '</div><div class="bt-ct">' + z.time + "</div><div class=\"bt-cd\">" + z.date + "</div></div>";
  }).join("");
  $("ts").innerHTML = '<div class="bt-tsrow"><b>Unix 时间戳（秒）</b><span>' + Math.floor(now / 1000) + "</span></div>" +
    '<div class="bt-tsrow"><b>时间戳（毫秒）</b><span>' + now + "</span></div>" +
    '<div class="bt-tsrow"><b>ISO 8601</b><span>' + new Date(now).toISOString() + "</span></div>";
}
tick();
setInterval(tick, 1000);
</script>
<style>
.bt-clock{text-align:center;padding:30px 16px;background:linear-gradient(135deg,#ff6500,#ff9a44);border-radius:12px;color:#fff;}

.bt-ct{font-size:17px;font-weight:600;color:#333;font-family:Consolas,Monaco,monospace;margin:4px 0;}
.bt-cd{font-size:11px;color:#aaa;}
.bt-ts{border:1px solid #eee;border-radius:8px;overflow:hidden;}
.bt-tsrow{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px;}
.bt-tsrow:last-child{border-bottom:none;}
.bt-tsrow b{color:#888;font-weight:400;flex:0 0 auto;}
.bt-tsrow span{color:#1f6feb;font-family:Consolas,Monaco,monospace;word-break:break-all;text-align:right;}

html.dark .bt-tsrow{border-color:#2c3239;color:#ddd;}
html.dark .bt-tsrow b{color:#999;}
html.dark .bt-tsrow span{color:#6cb6ff;}
</style>
