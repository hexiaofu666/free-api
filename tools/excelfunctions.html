<body data-tool="excelfunctions" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>搜索</label><input type="text" id="kw" placeholder="例如：查找、求和、文本"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="allBtn">显示全部</button>
      <button class="fbtn plain" id="clrBtn">清空搜索</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">共 38 条，输入关键词可即时筛选</strong></div>
      <div id="res" style="padding:6px 0;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Excel函数大全速查介绍：</h4>
    <ol>
      <li>每个函数都附带可套用的写法示例，把区域替换为自己的数据即可使用。</li>
      <li>搜索支持函数名与中文用途，输入查找可筛选出全部查找类函数。</li>
      <li>动态数组函数需要较新版本 Office 或 WPS 支持，老版本可能不可用。</li>
      <li>函数名不区分大小写，输入 sum 同样可以命中 SUM。</li>

<script>
var $ = function (id) { return document.getElementById(id); };
var DATA = [{"k":"SUM","v":"求和","d":"=SUM(A1:A10) 对区域求和"},{"k":"AVERAGE","v":"求平均值","d":"=AVERAGE(A1:A10) 忽略空单元格"},{"k":"COUNT","v":"统计数字个数","d":"只统计数值型单元格"},{"k":"COUNTA","v":"统计非空个数","d":"文本与数字都计入"},{"k":"COUNTIF","v":"条件计数","d":"=COUNTIF(A:A,\">60\") 统计大于 60 的个数"},{"k":"SUMIF","v":"条件求和","d":"=SUMIF(A:A,\"甲\",B:B) 按条件汇总"},{"k":"SUMIFS","v":"多条件求和","d":"支持多个区域与条件组合"},{"k":"VLOOKUP","v":"纵向查找","d":"=VLOOKUP(值,区域,列号,0) 精确匹配常用"},{"k":"XLOOKUP","v":"新一代查找","d":"支持任意方向查找与默认值"},{"k":"INDEX","v":"按位置取值","d":"常与 MATCH 组合实现双向查找"},{"k":"MATCH","v":"返回匹配位置","d":"=MATCH(值,区域,0) 精确查找返回序号"},{"k":"IF","v":"条件判断","d":"=IF(条件,真值,假值)"},{"k":"IFS","v":"多条件判断","d":"替代多层嵌套 IF，可读性更好"},{"k":"AND","v":"逻辑与","d":"全部条件成立才返回 TRUE"},{"k":"OR","v":"逻辑或","d":"任一条件成立即返回 TRUE"},{"k":"IFERROR","v":"错误兜底","d":"=IFERROR(公式,替代值) 屏蔽错误显示"},{"k":"TEXT","v":"格式化文本","d":"=TEXT(A1,\"yyyy-mm-dd\") 转日期格式"},{"k":"LEFT","v":"取左侧字符","d":"=LEFT(A1,3) 取前三个字符"},{"k":"RIGHT","v":"取右侧字符","d":"=RIGHT(A1,4) 取后四个字符"},{"k":"MID","v":"取中间字符","d":"=MID(A1,2,3) 从第 2 位起取 3 个"},{"k":"LEN","v":"统计字符长度","d":"中文与英文都按字符计数"},{"k":"TRIM","v":"去除多余空格","d":"清理首尾与连续空格"},{"k":"CONCAT","v":"连接文本","d":"=CONCAT(A1,B1) 合并多个单元格"},{"k":"ROUND","v":"四舍五入","d":"=ROUND(A1,2) 保留两位小数"},{"k":"ROUNDUP","v":"向上舍入","d":"远离零方向进位"},{"k":"INT","v":"向下取整","d":"直接舍去小数部分"},{"k":"MAX","v":"求最大值","d":"=MAX(A1:A10)"},{"k":"MIN","v":"求最小值","d":"=MIN(A1:A10)"},{"k":"RANK","v":"排名","d":"=RANK(A1,A:A) 返回名次"},{"k":"TODAY","v":"当前日期","d":"无参数，随系统日期自动更新"},{"k":"NOW","v":"当前日期时间","d":"含时分秒，可按 F9 刷新"},{"k":"DATEDIF","v":"计算日期间隔","d":"=DATEDIF(起,止,\"Y\") 计算整年数"},{"k":"LEFT+MID 拆分","v":"拆分文本组合用法","d":"常配合 FIND 定位分隔符"},{"k":"FIND","v":"查找字符位置","d":"区分大小写，未找到返回错误"},{"k":"SUBSTITUTE","v":"替换文本","d":"=SUBSTITUTE(A1,\"旧\",\"新\")"},{"k":"UNIQUE","v":"提取唯一值","d":"动态数组函数，自动去重"},{"k":"FILTER","v":"条件筛选","d":"动态数组函数，按条件返回结果集"},{"k":"SORT","v":"排序","d":"动态数组函数，返回排序后数组"}];
var COLS = ["快捷方式","功能说明"];
function __xfList() { return DATA; }
function __xfSearch(kw) {
  var k = String(kw == null ? "" : kw).trim().toLowerCase();
  if (!k) return DATA.slice();
  return DATA.filter(function (it) {
    return (it.k + " " + it.v + " " + (it.d || "")).toLowerCase().indexOf(k) >= 0;
  });
}
function __xfRender(list, kw) {
  if (!list.length) return "<div style='padding:14px 15px;color:#999;'>没有匹配「" + kw + "」的条目</div>";
  return list.map(function (it) {
    return "<div style='padding:10px 15px;border-bottom:1px solid #f0f0f0;'>" +
      "<b style='color:#3f9e5a;font-family:Consolas,monospace;'>" + it.k + "</b>" +
      "<span style='margin-left:10px;color:#333;'>" + it.v + "</span>" +
      (it.d ? "<div style='color:#999;font-size:12px;margin-top:4px;'>" + it.d + "</div>" : "") +
      "</div>";
  }).join("");
}
function run() {
  var kw = $("kw").value;
  var list = __xfSearch(kw);
  $("res").innerHTML = __xfRender(list, kw);
  $("tip").textContent = kw ? "筛选到 " + list.length + " 条" : "共 " + DATA.length + " 条，输入关键词可即时筛选";
  return list;
}
$("kw").oninput = run;
$("allBtn").onclick = function () { $("kw").value = ""; return run(); };
$("clrBtn").onclick = function () { $("kw").value = ""; return run(); };
run();
</script>
</body>
