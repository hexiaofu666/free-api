<!DOCTYPE html>

<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript压缩 - 词海工具箱</title>
<meta name="description" content="在线压缩 JavaScript 代码，移除注释与多余空白并保留字符串内容，输出体积更小的可运行脚本。">

<script src="../assets/theme.js?v=1.7.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.7.0">

var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="jsmin" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>去掉行尾分号</label>
        <select id="semi"><option value="no" selected>否</option><option value="yes">是</option></select>
      </div>
      <div class="fitem"><label>保留换行</label>
        <select id="nl"><option value="no" selected>否</option><option value="yes">是</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">压缩代码</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">JavaScript 源码</div>
      <textarea id="src" style="min-height:180px;">// 计算两个数的和
function add(a, b) {
  /* 返回结果 */
  var s = "a  b";
  return a + b;
}</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">压缩结果</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:170px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于JavaScript压缩介绍：</h4>
    <ol>
      <li>压缩会移除行注释与块注释，然后把连续的空白字符合并为一个必要的空格。</li>
      <li>字符串字面量内部的空格与换行会被完整保留，不会破坏代码语义。</li>
      <li>转义字符会被成对处理，字符串中的引号不会造成状态错乱。</li>
      <li>选择去掉行尾分号会顺带移除紧跟在右花括号前的分号，可进一步减小体积。</li>
      <li>压缩只做语法层面的精简，不会重命名变量，也不做死代码消除，安全性更高。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.7.0"></script>
<script src="../assets/chrome.js?v=1.7.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfJsMin(code) {
  var s = String(code), out = "", i = 0, state = "code";
  function last() { return out.charAt(out.length - 1); }
  while (i < s.length) {
    var c = s.charAt(i), c2 = s.charAt(i + 1);
    if (state === "code") {
      if (c === '"' || c === "'" || c === "`") { state = c; out += c; i++; continue; }
      if (c === "/" && c2 === "/") { while (i < s.length && s.charAt(i) !== "\n") i++; continue; }
      if (c === "/" && c2 === "*") { i += 2; while (i < s.length && !(s.charAt(i) === "*" && s.charAt(i + 1) === "/")) i++; i += 2; continue; }
      if (c === " " || c === "\t" || c === "\n" || c === "\r") {
        var j = i; while (j < s.length && /\s/.test(s.charAt(j))) j++;
        if (/[A-Za-z0-9_$]/.test(last()) && /[A-Za-z0-9_$]/.test(s.charAt(j))) out += " ";
        i = j; continue;
      }
      out += c; i++; continue;
    }
    if (c === "\\") { out += c + (s.charAt(i + 1) || ""); i += 2; continue; }
    if (c === state) state = "code";
    out += c; i++;
  }
  return out.replace(/;\s*}/g, "}");
}
function __xfJsStats(src, out) {
  var a = String(src), b = String(out);
  var saved = a.length ? Math.max(0, Math.round((1 - b.length / a.length) * 1000) / 10) : 0;
  return { before: a.length, after: b.length, saved: saved };
}
window.__xfJsMin = __xfJsMin;
window.__xfJsStats = __xfJsStats;
function run() {
  var out = __xfJsMin($("src").value);
  if ($("nl").value === "yes") out = out.replace(/([;}])\s*/g, "$1\n");
  if ($("semi").value === "yes") out = out.replace(/;\}/g, "}").replace(/;$/, "");
  $("res").value = out;
  var st = __xfJsStats($("src").value, out);
  $("state").textContent = st.before + " → " + st.after + " 字符（省 " + st.saved + "%）";
  $("tip").textContent = "✅ 压缩完成";
  return out;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
