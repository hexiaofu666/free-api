<!DOCTYPE html>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="在线力单位换算器，牛顿、千牛、千克力、克力、达因、磅力、盎司力等力的单位互相换算。">

<script>

var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="unitforce" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>数值</label><input type="text" id="val" value="1"></div>
      <div class="fitem"><label>源单位</label><select id="from"></select></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar"><button class="fbtn green" id="runBtn">换算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">以牛顿为基准换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于力单位换算介绍：</h4>
    <ol>
      <li>以牛顿为基准，涵盖国际单位制与工程单位制的常用力单位。</li>
      <li>1 千克力 = 9.80665 牛顿，即 1 公斤物体所受重力。</li>
      <li>1 达因 = 1e-5 牛顿，是厘米克秒制中的力单位。</li>
      <li>1 磅力 ≈ 4.448 牛顿，1 盎司力约为其十六分之一。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
var FORCE = [
  { k: "n", n: "牛顿 N", f: 1 }, { k: "kn", n: "千牛 kN", f: 1000 }, { k: "mn", n: "毫牛 mN", f: 0.001 },
  { k: "kgf", n: "千克力 kgf", f: 9.80665 }, { k: "gf", n: "克力 gf", f: 0.00980665 },
  { k: "dyn", n: "达因 dyn", f: 1e-5 }, { k: "lbf", n: "磅力 lbf", f: 4.4482216152605 },
  { k: "ozf", n: "盎司力 ozf", f: 0.27801385095378 }
];
function __xfForceUnit(key) { for (var i = 0; i < FORCE.length; i++) if (FORCE[i].k === key) return FORCE[i]; return null; }
function __xfForceConvert(v, from) {
  var u = __xfForceUnit(from), n = Number(v);
  if (!u || !isFinite(n)) return null;
  var base = n * u.f, out = {};
  FORCE.forEach(function (x) { out[x.k] = base / x.f; });
  return out;
}
function __xfForceList() { return FORCE; }
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfForceConvert($("val").value, $("from").value);
  if (!o) { $("tip").textContent = "⚠️ 请输入合法数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML = FORCE.map(function (u) {
    return "<div>" + u.n + "：" + __xfRound(o[u.k], dec) + "</div>";
  }).join("");
  return o;
}
(function init() {
  var sel = $("from");
  FORCE.forEach(function (u) { var op = document.createElement("option"); op.value = u.k; op.textContent = u.n; sel.appendChild(op); });
  sel.value = "n";
})();
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
