<meta name="description" content="文件目录树生成器：粘贴文件路径列表，一键生成带 ├── └── 的树形结构，支持自定义连接符、显示文件数统计，方便写文档与项目说明。">

<body data-tool="file2tree" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>文件路径列表（每行一个）</label>
        <textarea id="paths" style="height:160px;" placeholder="src/index.js&#10;src/utils/helper.js&#10;README.md"></textarea>
      </div>
      <div class="fitem"><label>连接符风格</label>
        <select id="style">
          <option value="ascii" selected>├── └──（标准）</option>
          <option value="plus">+-- \--（兼容旧终端）</option>
          <option value="indent">纯缩进（无连接符）</option>
        </select>
      </div>
      <div class="fitem"><label>显示根目录名</label><input type="text" id="root" placeholder="可留空，例如 my-project"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">生成目录树</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">生成的目录树</strong></div>
      <pre id="res" class="tree-out"></pre>
    </div>
  </div>
  <div class="resttips">
    <h4>关于文件目录树生成器介绍：</h4>
    <ol>
      <li>把项目里的一堆文件路径（每行一个）粘贴进来，工具会自动合并公共目录，生成树形结构。</li>
      <li>常用于写 README 的目录结构说明、整理文档、给同事介绍项目组织方式。</li>
      <li>支持三种连接符风格，也可以在最外层加上项目根目录名。</li>
      <li>路径分隔符支持 / 和 \，会自动统一处理并去重排序。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
/* 构建树：lines -> 嵌套对象 */
function __xfBuildTree(lines) {
  const root = { name: "", children: {}, };
  lines.forEach(raw => {
    const line = String(raw).trim().replace(/\\/g, "/").replace(/^\/+/, "").replace(/\/+$/, "");
    if (!line) return;
    const segs = line.split("/").filter(s => s !== "");
    let node = root;
    segs.forEach((seg, i) => {
      if (!node.children[seg]) node.children[seg] = { name: seg, children: {}, isFile: false };
      node = node.children[seg];
      if (i === segs.length - 1) node.isFile = true;
    });
  });
  return root;
}

const CONN = { ascii: { t: "├── ", l: "└── ", v: "│   ", s: "    " }, plus: { t: "+-- ", l: "\\-- ", v: "|   ", s: "    " }, indent: { t: "", l: "", v: "", s: "    " } };

/* 渲染树 -> 文本 */
function __xfTree(lines, opts) {
  opts = opts || {};
  const conn = CONN[opts.style] || CONN.ascii;
  const root = __xfBuildTree(lines);
  const out = [];
  const sortKeys = Object.keys(root.children).sort();
  if (opts.root) out.push(opts.root);
  let fileCount = 0, dirCount = 0;
  function walk(node, prefix, isRoot) {
    const keys = Object.keys(node.children).sort((a, b) => {
      const A = node.children[a], B = node.children[b];
      if (A.isFile !== B.isFile) return A.isFile ? 1 : -1;   // 目录在前
      return a.localeCompare(b);
    });
    keys.forEach((k, i) => {
      const child = node.children[k];
      const last = i === keys.length - 1;
      const branch = last ? conn.l : conn.t;
      const isDir = Object.keys(child.children).length > 0;
      if (isDir) root.__dirs = (root.__dirs || 0) + 1; else root.__files = (root.__files || 0) + 1;
      if (isDir) dirCount++; else fileCount++;
      out.push(prefix + branch + child.name + (isDir ? "/" : ""));
      walk(child, prefix + (last ? conn.s : conn.v), false);
    });
  }
  walk(root, "", true);
  return { text: out.join("\n"), files: fileCount, dirs: dirCount };
}

window.__xfBuildTree = __xfBuildTree;
window.__xfTree = __xfTree;

const $ = id => document.getElementById(id);
function run() {
  const lines = $("paths").value.split("\n");
  const r = __xfTree(lines, { style: $("style").value, root: $("root").value.trim() });
  $("res").textContent = r.text || "（没有可用的路径）";
  $("tip").textContent = "共 " + r.files + " 个文件 / " + r.dirs + " 个目录";
}
$("runBtn").onclick = run;
$("style").onchange = run;
$("root").addEventListener("input", run);
$("copyBtn").onclick = () => { if (!$("res").textContent) return alert("请先生成"); navigator.clipboard.writeText($("res").textContent).then(() => alert("✅ 已复制")); };
$("paths").value = "src/index.js\nsrc/utils/helper.js\nsrc/utils/format.js\nsrc/components/Button.js\npublic/favicon.ico\nREADME.md\npackage.json";
run();
</script>
