function __xfUnserialize(str) {
  var s = String(str).trim(), pos = 0;
  function fail(msg) { throw new Error(msg + "（位置 " + pos + "）"); }
  function byteStr(len) {
    if (s[pos] !== '"') fail("期望字符串起始引号");
    pos++;
    var out = "", bytes = 0, start = pos;
    while (bytes < len) {
      if (pos >= s.length) fail("字符串未结束");
      var c = s.charCodeAt(pos);
      var need = c < 0x80 ? 1 : (c < 0x800 ? 2 : (c >= 0xd800 && c <= 0xdbff ? 4 : 3));
      out += s[pos];
      if (c >= 0xd800 && c <= 0xdbff) { out += s[pos + 1] || ""; pos += 2; } else pos++;
      bytes += need;
    }
    if (s[pos] !== '"') fail("期望字符串结束引号");
    pos++;
    return out;
  }
  function parse() {
    var t = s[pos];
    if (t === "N") { pos += 2; return null; }
    if (t === "b") { pos += 2; var v = s[pos] === "1"; pos += 2; return v; }
    if (t === "i") { pos += 2; var e = s.indexOf(";", pos); var n = parseInt(s.slice(pos, e), 10); pos = e + 1; return n; }
    if (t === "d") { pos += 2; var e2 = s.indexOf(";", pos); var d = parseFloat(s.slice(pos, e2)); pos = e2 + 1; return d; }
    if (t === "s") {
      pos += 2;
      var col = s.indexOf(":", pos);
      var len = parseInt(s.slice(pos, col), 10);
      pos = col + 1;
      var str = byteStr(len);
      if (s[pos] !== ";") fail("字符串结尾缺少分号");
      pos++;
      return str;
    }
    if (t === "a" || t === "O") {
      var isObj = t === "O";
      pos += 2;
      var c1 = s.indexOf(":", pos);
      var count;
      if (isObj) {
        var nameLen = parseInt(s.slice(pos, c1), 10);
        pos = c1 + 1;
        byteStr(nameLen);
        if (s[pos] !== ":") fail("对象结构错误");
        pos++;
        c1 = s.indexOf(":", pos);
      }
      count = parseInt(s.slice(pos, c1), 10);
      pos = c1 + 1;
      if (s[pos] !== "{") fail("期望 {");
      pos++;
      var map = {}, arr = [], useArr = true;
      for (var i = 0; i < count; i++) {
        var k = parse(), v = parse();
        map[k] = v;
        if (k !== i) useArr = false;
        arr.push(v);
      }
      if (s[pos] !== "}") fail("期望 }");
      pos++;
      return useArr && !isObj ? arr : map;
    }
    fail("无法识别的类型标记「" + t + "」");
  }
  try {
    var val = parse();
    if (pos < s.length && s.slice(pos).trim()) return { ok: false, error: "解析结束后仍有剩余内容：" + s.slice(pos, pos + 20) };
    return { ok: true, value: val };
  } catch (e) { return { ok: false, error: e.message }; }
}
function __xfTree(v, depth) {
  var pad = new Array((depth || 0) + 1).join("  ");
  if (v === null) return pad + "null";
  if (Array.isArray(v)) return pad + "[数组 " + v.length + "]\n" + v.map(function (x) { return __xfTree(x, (depth || 0) + 1); }).join("\n");
  if (typeof v === "object") {
    return Object.keys(v).map(function (k) {
      var x = v[k];
      if (x !== null && typeof x === "object") return pad + k + ":\n" + __xfTree(x, (depth || 0) + 1);
      return pad + k + " = " + JSON.stringify(x);
    }).join("\n");
  }
  return pad + JSON.stringify(v);
}
window.__xfUnserialize = __xfUnserialize;
window.__xfTree = __xfTree;

var $ = function (id) { return document.getElementById(id); };
$("runBtn").onclick = function () {

  var v = r.value;
  if ($("obj").value === "arr" && v && typeof v === "object" && !Array.isArray(v)) v = Object.keys(v).map(function (k) { return v[k]; });

  $("state").textContent = out.length + " 字符";
  $("tip").textContent = "✅ 反序列化成功";
