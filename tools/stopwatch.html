<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秒表在线计时 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.5"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.5">
<style>
.sw-display { font-size: 72px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 20px 0; }
.laps { margin-top: 16px; max-height: 260px; overflow-y: auto; }
.lap-item { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #f0f0f0; font-size: 13px; font-variant-numeric: tabular-nums; color: #666; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<meta name="description" content="在线秒表，支持计次与重置">
<link rel="canonical" href="https://tools.hdemba.cn/tools/stopwatch.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="stopwatch" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mdiv">
      <div class="mlf">
        <div class="sw-display" id="display">00:00.00</div>
        <div class="laps" id="laps"></div>
      </div>
      <div class="mlr">
        <button class="fbtn green" id="startBtn">开始</button>
        <button class="fbtn blue" id="lapBtn">计次</button>
        <button class="fbtn plain" id="resetBtn">重置</button>
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于秒表计时工具介绍：</h4>
    <p>在线秒表工具，精确到百分之一秒，支持暂停、继续、计次与重置，适用于运动计时、实验记录等场景。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.5"></script>
<script src="../assets/chrome.js?v=1.5.5"></script>
<script>
let startTime = 0, elapsed = 0, timer = null, lapCount = 0;
const display = document.getElementById("display");
const startBtn = document.getElementById("startBtn");
function fmt(ms) {
  const m = String(Math.floor(ms / 60000)).padStart(2, "0");
  const s = String(Math.floor(ms % 60000 / 1000)).padStart(2, "0");
  const cs = String(Math.floor(ms % 1000 / 10)).padStart(2, "0");
  return `${m}:${s}.${cs}`;
}
function show() { display.textContent = fmt(elapsed); }
startBtn.onclick = () => {
  if (timer) {
    clearInterval(timer); timer = null;
    elapsed += Date.now() - startTime;
    startBtn.textContent = "继续";
  } else {
    startTime = Date.now();
    timer = setInterval(() => { elapsed = Date.now() - startTime; show(); }, 33);
    startBtn.textContent = "暂停";
  }
};
document.getElementById("lapBtn").onclick = () => {
  if (!timer && elapsed === 0) return;
  lapCount++;
  const cur = timer ? elapsed + (Date.now() - startTime) : elapsed;
  const row = document.createElement("div");
  row.className = "lap-item";
  row.innerHTML = `<span>第 ${lapCount} 次</span><span>${fmt(cur)}</span>`;
  document.getElementById("laps").prepend(row);
};
document.getElementById("resetBtn").onclick = () => {
  clearInterval(timer); timer = null;
  elapsed = 0; lapCount = 0; show();
  startBtn.textContent = "开始";
  document.getElementById("laps").innerHTML = "";
};
</script>
</body>
</html>
