<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文分词符插入 - 词海工具箱</title>
<meta name="description" content="在中文汉字之间批量插入空格或自定义分隔符，用于改善中文排版换行、生成拼音分隔文本或做分词预处理。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/zhsep.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="zhsep" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>分隔符</label><input type="text" id="sep" value=" " maxlength="3"></div>
      <div class="fitem"><label>标点后不插入</label>
        <select id="afterp"><option value="yes" selected>是</option><option value="no">否</option></select>
      </div>
      <div class="fitem"><label>连续汉字也算</label>
        <select id="each"><option value="yes" selected>逐个拆分</option><option value="no">整词保留</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">插入分隔符</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">中文文本</div>
      <textarea id="src" style="min-height:150px;">词海工具箱是一个好用的在线工具箱。</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">处理结果</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:120px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于中文分词符插入介绍：</h4>
    <ol>
      <li>中文之间插入空格后，浏览器在窄屏下可以按字换行，长标题不再撑破布局。</li>
      <li>分隔符可换成斜杠、竖线或零宽空格，用于生成不同用途的文本。</li>
      <li>非汉字字符（英文、数字、标点）保持原样，不会在字母之间插入分隔符。</li>
      <li>汉字与非汉字交界处会补一个分隔符，避免中英混排时粘连。</li>
      <li>汉字数量统计可用于估算文章字数，与纯字符统计区分开来。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfZhSep(text, sep) {
  sep = sep === undefined ? " " : sep;
  var s = String(text), out = "", prevCJK = false;
  for (var i = 0; i < s.length; i++) {
    var c = s[i], isCJK = /[\u4e00-\u9fff]/.test(c);
    if (isCJK) {
      if (i > 0 && !prevCJK) out += sep;
      out += c;
      if (i < s.length - 1) out += sep;
      prevCJK = true;
    } else {
      out += c;
      prevCJK = false;
    }
  }
  return out;
}
function __xfZhCount(text) {
  var m = String(text).match(/[\u4e00-\u9fff]/g);
  return m ? m.length : 0;
}
window.__xfZhSep = __xfZhSep;
window.__xfZhCount = __xfZhCount;
function run() {
  var out = __xfZhSep($("src").value, $("sep").value === undefined ? " " : $("sep").value);
  $("res").value = out;
  $("state").textContent = __xfZhCount($("src").value) + " 个汉字";
  $("tip").textContent = "✅ 已插入分隔符";
  return out;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
