<body data-tool="cmyk2hex" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="cp-box" id="preview">#FF6500</div>
    <div class="crow">
      <div class="side">
        <div class="fin"><label>青 C (0~100%)</label><input id="c" type="number" min="0" max="100" step="0.1" value="0"></div>
        <div class="fin"><label>品红 M (0~100%)</label><input id="m" type="number" min="0" max="100" step="0.1" value="60.4"></div>
        <div class="fin"><label>黄 Y (0~100%)</label><input id="y" type="number" min="0" max="100" step="0.1" value="100"></div>
        <div class="fin"><label>黑 K (0~100%)</label><input id="k" type="number" min="0" max="100" step="0.1" value="0"></div>
      </div>
      <span class="to">TO</span>
      <div class="side">
        <div class="fin"><label>HEX 值</label><input id="hex" value="#FF6500" spellcheck="false"></div>
        <div class="fin"><label>取色器</label><input type="color" id="picker" value="#ff6500" style="height:36px;width:60px;padding:2px;cursor:pointer;flex:none;"></div>
      </div>
    </div>
    <p style="font-size:12px;color:#bbb;line-height:2;">修改任意一侧的值，另一侧实时同步转换。</p>
  </div>
  <div class="resttips">
    <h4>关于CMYK/16进制转换工具介绍：</h4>
    <p>1、CMYK（青、品红、黄、黑）是印刷行业使用的减色模型，HEX 是网页显示常用的十六进制颜色码。</p>
    <p>2、本工具通过标准数学公式在两者之间互相转换，方便设计稿在印刷与网页之间切换。</p>
    <p>3、修改任意一侧的值即可实时得到另一侧的转换结果。</p>
  </div>

<script>
const $ = id => document.getElementById(id);
function hex2rgb(hex) {
  let v = hex.trim().replace(/^#/, "");
  if (/^[0-9a-fA-F]{3}$/.test(v)) v = v.split("").map(c => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(v)) return null;
  const n = parseInt(v, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function rgb2cmyk(r, g, b) {
  const R = r / 255, G = g / 255, B = b / 255;
  const k = 1 - Math.max(R, G, B);
  if (k === 1) return [0, 0, 0, 100];
  const c = (1 - R - k) / (1 - k), m = (1 - G - k) / (1 - k), y = (1 - B - k) / (1 - k);
  return [c, m, y, k].map(u => +(u * 100).toFixed(1));
}
function cmyk2rgb(c, m, y, k) { return [c, m, y].map(u => Math.round(255 * (1 - u / 100) * (1 - k / 100))); }
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase(); }
function paint(r, g, b) {
  const hex = toHex(r, g, b);
  $("preview").style.background = hex;
  $("preview").textContent = hex;
  $("picker").value = hex;
}
function pct(id) { return Math.min(100, Math.max(0, +$(id).value || 0)); }
function fromCmyk() {
  const [r, g, b] = cmyk2rgb(pct("c"), pct("m"), pct("y"), pct("k"));
  $("hex").value = toHex(r, g, b);
  paint(r, g, b);
}
function fromHex() {
  const rgb = hex2rgb($("hex").value);
  if (!rgb) return;
  const [c, m, y, k] = rgb2cmyk(...rgb);
  $("c").value = c; $("m").value = m; $("y").value = y; $("k").value = k;
  paint(...rgb);
}
["c", "m", "y", "k"].forEach(id => $(id).addEventListener("input", fromCmyk));
$("hex").addEventListener("input", fromHex);
$("picker").addEventListener("input", e => { $("hex").value = e.target.value; fromHex(); });
fromCmyk();
</script>
