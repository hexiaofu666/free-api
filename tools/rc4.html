  <div class="resttips">
    <h4>关于RC4加密解密介绍：</h4>
    <ol>
      <li>RC4 是一种流密码，密钥长度任意；加密与解密使用完全相同的算法，因此「解密」就是把密文再异或一次。</li>
      <li>加密结果可输出为十六进制或 Base64；解密时请先把密文转成同样的格式再粘贴进来。</li>
      <li>RC4 已被发现有统计偏差，不适合用于高安全场景，本工具主要用于编码转换、老旧系统兼容与学习演示。</li>
      <li>密钥必须完全一致才能还原明文，包含大小写、空格与标点，建议粘贴而非手打。</li>
      <li>所有运算都在你的浏览器本地完成，密钥与内容不会上传到任何服务器。</li>
    </ol>
  </div>

  for (i = 0; i < 256; i++) { s[i] = i; k[i] = kb[i % kb.length]; }
  for (i = 0; i < 256; i++) {
    j = (j + s[i] + k[i]) & 255;
    var t = s[i]; s[i] = s[j]; s[j] = t;
  }
  i = 0; j = 0;
  for (var n = 0; n < inBytes.length; n++) {
    i = (i + 1) & 255;
    j = (j + s[i]) & 255;
    var t2 = s[i]; s[i] = s[j]; s[j] = t2;
    out.push(inBytes[n] ^ s[(s[i] + s[j]) & 255]);
  }
  return out;
}
function __xfRc4(data, key) { return __xfRc4Bytes(__xfStrBytes(String(data)), key); }

    else { b.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  return b;
}
function __xfBytesStr(b) {
  var s = "", i = 0;
  while (i < b.length) {
    var c = b[i++];

    else if (c < 224) s += String.fromCharCode(((c & 31) << 6) | (b[i++] & 63));
    else s += String.fromCharCode(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
  }

}
function __xfToHex(bytes) { return bytes.map(function (x) { return ("0" + (x & 255).toString(16)).slice(-2); }).join(""); }

  var h = String(hex).replace(/[^0-9a-fA-F]/g, "");
