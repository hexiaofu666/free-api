<meta name="description" content="在线零息国债收益计算器，按买入价格与剩余年限算出现值折价收益、单利年化收益率与复利到期收益率。">

<script src="../assets/theme.js?v=1.9.1"></script>

var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="guozhailingxi" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>买入价格（每百元面值）</label><input type="text" id="price" value="90"></div>
      <div class="fitem"><label>剩余年限（年）</label><input type="text" id="years" value="3"></div>
      <div class="fitem"><label>购买面值总额（元）</label><input type="text" id="face" value="100000"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算收益</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写参数后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于零息国债收益计算器介绍：</h4>
    <ol>
      <li>零息国债不支付期间利息，以低于面值的价格发行或交易，到期按面值兑付，收益全部来自买入价与面值的差额。</li>
      <li>复利到期收益率 = (100 ÷ 买入价) 的 (1 ÷ 剩余年限) 次方再减 1，反映资金的时间价值，是衡量零息债券收益的标准口径。</li>
      <li>单利年化收益 = (100 − 买入价) ÷ 买入价 ÷ 剩余年限，口径更直观但会高估实际年化水平。</li>
      <li>剩余年限越长，同样的折价对应更高的年化收益率，同时价格对利率变化也更敏感。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfDiscount(price) { return 100 - price; }
function __xfSimpleAnnual(price, years) {
  if (!(price > 0) || !(years > 0)) return NaN;
  return __xfDiscount(price) / price / years * 100;
}
function __xfCompoundAnnual(price, years) {
  if (!(price > 0) || !(years > 0)) return NaN;
  return (Math.pow(100 / price, 1 / years) - 1) * 100;
}
function __xfTotalProfit(price, face) {
  return __xfDiscount(price) * (face / 100);
}
function __xfRound2(v) { return Math.round(v * 100) / 100; }
function __xfRound3(v) { return Math.round(v * 1000) / 1000; }
function run() {
  var price = Number($("price").value), years = Number($("years").value), face = Number($("face").value);
  if (!(price > 0) || !(years > 0)) { $("tip").textContent = "⚠️ 请填写有效的买入价格与剩余年限"; $("res").innerHTML = ""; return null; }
  if (price > 100) { $("tip").textContent = "⚠️ 零息国债买入价通常低于面值 100 元"; $("res").innerHTML = ""; return null; }
  var simple = __xfSimpleAnnual(price, years), comp = __xfCompoundAnnual(price, years);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>买入价 " + price + " 元/百元面值，剩余 " + years + " 年</div>" +
    "<div>到期收益率（复利年化）：<b style='color:#b8860b;font-size:16px;'>" + __xfRound3(comp) + "%</b></div>" +
    "<div>单利年化收益：<b style='color:#b8860b;'>" + __xfRound3(simple) + "%</b></div>" +
    "<div>每百元面值折价收益：" + __xfRound2(__xfDiscount(price)) + " 元</div>" +
    (face > 0 ? "<div>面值 " + face + " 元对应到期收益：" + __xfRound2(__xfTotalProfit(price, face)) + " 元</div>" : "") +
    "<div style='color:#888;'>复利口径低于单利口径，差距随年限增加而扩大</div>";
  return comp;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
