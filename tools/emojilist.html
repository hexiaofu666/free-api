<body data-tool="emojilist" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>分类</label>
        <select id="cat"><option value="all" selected>全部</option><option value="smile">笑脸情绪</option><option value="hand">手势人物</option><option value="animal">动物自然</option><option value="food">食物饮品</option><option value="travel">出行物品</option><option value="symbol">符号标志</option></select>
      </div>
      <div class="fitem"><label>每行显示</label><input type="number" id="col" value="16" min="8" max="32"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">刷新列表</button>
      <button class="fbtn brown" id="copyBtn">复制全部</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">表情列表</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:300px;font-size:18px;line-height:1.6;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Emoji表情大全介绍：</h4>
    <ol>
      <li>表情按类别分组，切换分类后列表会刷新，复制全部会得到没有空格分隔的连续表情串。</li>
      <li>列表中的表情在多数聊天软件与文档编辑器中都可以正常显示，无需安装额外字体。</li>
      <li>皮肤色调与组合表情依赖零宽连接符，个别旧系统可能显示为多个独立字符。</li>
      <li>写文案时适当使用表情能提升可读性，但标题中不宜过多，以免影响搜索引擎抓取。</li>
      <li>部分老版本浏览器可能不支持较新的表情，跨端展示前建议先在目标环境确认。</li>
    </ol>
  </div>
</div></div></div>

};
function __xfEmojiCat(name) {
  return EMOJI_CATS.hasOwnProperty(name) ? EMOJI_CATS[name] : [];
}
function __xfEmojiList(cat) {
  if (!cat || cat === "all") {
    var out = [];
    Object.keys(EMOJI_CATS).forEach(function (k) { out = out.concat(EMOJI_CATS[k]); });
    return out;
  }
  return __xfEmojiCat(cat).slice();
}
function __xfEmojiCount() {
  var n = 0;
  Object.keys(EMOJI_CATS).forEach(function (k) { n += EMOJI_CATS[k].length; });
  return n;
}
function __xfEmojiGrid(cat, perRow) {
  var list = __xfEmojiList(cat), n = Math.max(1, parseInt(perRow, 10) || 16), lines = [];
  for (var i = 0; i < list.length; i += n) lines.push(list.slice(i, i + n).join(" "));
  return lines.join("\n");
}
window.__xfEmojiCat = __xfEmojiCat;
window.__xfEmojiList = __xfEmojiList;
window.__xfEmojiCount = __xfEmojiCount;
window.__xfEmojiGrid = __xfEmojiGrid;
function run() {
  var cat = $("cat").value;
  var list = __xfEmojiList(cat);
  $("res").value = __xfEmojiGrid(cat, $("col").value);
  $("state").textContent = list.length + " 个";
  $("tip").textContent = "✅ 共 " + list.length + " 个表情";
  return list;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value.replace(/\s+/g, "")).then(function () { alert("✅ 已复制"); }); };
run();
</script>
