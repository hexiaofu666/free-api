<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS裁剪路径生成器 - 词海工具箱</title>
<meta name="description" content="在线生成 CSS clip-path 裁剪路径代码，支持圆形、椭圆、多边形与三角形，可调节边数与旋转角度并实时预览。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.7.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.7.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/cssclip.html">

<body data-tool="cssclip" data-cat="seo">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>形状</label>
        <select id="shape"><option value="polygon" selected>正多边形</option><option value="circle">圆形</option><option value="ellipse">椭圆</option><option value="triangle">三角形</option><option value="inset">内嵌矩形</option></select>
      </div>
      <div class="fitem"><label>边数</label><input type="number" id="n" value="6" min="3" max="20"></div>
      <div class="fitem"><label>半径/尺寸 %</label><input type="number" id="r" value="50" min="1" max="100"></div>
      <div class="fitem"><label>旋转角度</label><input type="number" id="rot" value="0" min="-180" max="180"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">生成代码</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">clip-path 代码</strong><span id="state"></span></div>
      <div style="padding:8px 0;"><div id="pv" style="width:130px;height:130px;margin:0 auto;background:linear-gradient(135deg,#ff6500,#f0a35e);"></div></div>
      <textarea id="res" readonly style="height:130px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于CSS裁剪路径生成器介绍：</h4>
    <ol>
      <li>多边形顶点按等分角度计算，默认从正上方开始，调整旋转角度可整体转动图形。</li>
      <li>半径百分比越大图形越大，超过 50 时会被裁切边缘，适合做溢出式的标签效果。</li>
      <li>clip-path 只是视觉裁剪，元素原本占用的布局空间不会改变，阴影也可能被裁掉。</li>
      <li>圆形与椭圆使用 at 50% 50% 居中定位，需要偏心时可手动改成其他百分比。</li>
      <li>生成代码可直接贴到样式表，注意部分老版本浏览器需要加 -webkit- 前缀。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.7.0"></script>
<script src="../assets/chrome.js?v=1.7.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfClipPolygon(sides, radius, rot) {
  var n = Math.max(3, parseInt(sides, 10) || 6);
  var r = (radius === undefined ? 50 : Number(radius)) / 100;
  var start = ((rot || 0) - 90) * Math.PI / 180;
  var pts = [];
  for (var i = 0; i < n; i++) {
    var a = start + i * 2 * Math.PI / n;
    var x = 50 + Math.cos(a) * r * 50;
    var y = 50 + Math.sin(a) * r * 50;
    pts.push([Math.round(x * 100) / 100, Math.round(y * 100) / 100]);
  }
  return pts;
}
function __xfClipPath(shape, opts) {
  opts = opts || {};
  var dec = opts.dec === undefined ? 1 : opts.dec;
  function d(v) { return Number(v).toFixed(dec).replace(/\.0+$/, ""); }
  if (shape === "circle") return "circle(" + d(opts.radius === undefined ? 50 : opts.radius) + "% at 50% 50%)";
  if (shape === "ellipse") return "ellipse(" + d(opts.rx === undefined ? 50 : opts.rx) + "% " + d(opts.ry === undefined ? 35 : opts.ry) + "% at 50% 50%)";
  if (shape === "triangle") return "polygon(50% 0%, 100% 100%, 0% 100%)";
  if (shape === "inset") return "inset(" + d(opts.inset === undefined ? 10 : opts.inset) + "% round " + d(opts.round === undefined ? 8 : opts.round) + "px)";
  var pts = __xfClipPolygon(opts.sides, opts.radius, opts.rot);
  return "polygon(" + pts.map(function (p) { return d(p[0]) + "% " + d(p[1]) + "%"; }).join(", ") + ")";
}
function __xfClipCss(shape, opts, selector) {
  return (selector || ".clip-box") + " {\n  clip-path: " + __xfClipPath(shape, opts) + ";\n}";
}
window.__xfClipPolygon = __xfClipPolygon;
window.__xfClipPath = __xfClipPath;
window.__xfClipCss = __xfClipCss;
function run() {
  var shape = $("shape").value;
  var opts = { sides: $("n").value, radius: $("r").value, rot: $("rot").value, rx: $("r").value, ry: Number($("r").value) * 0.7, inset: 100 - Number($("r").value) };
  var css = __xfClipCss(shape, opts, ".clip-box");
  $("res").value = css;
  $("pv").style.clipPath = __xfClipPath(shape, opts);
  $("state").textContent = shape;
  $("tip").textContent = "✅ 已生成 clip-path";
  return css;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
