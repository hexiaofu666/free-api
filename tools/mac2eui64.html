<meta name="description" content="MAC 地址转 EUI-64 工具：把 48 位 MAC 地址转换为 EUI-64 接口标识符，并生成 IPv6 链路本地地址，自动处理第 7 位翻转。">

<body data-tool="mac2eui64" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>MAC 地址（支持 : 或 - 分隔）</label><input type="text" id="mac" placeholder="例如 00:1A:2B:3C:4D:5E"></div>
      <div class="fitem"><label>IPv6 前缀</label><input type="text" id="prefix" value="fe80::" placeholder="默认 fe80::（链路本地）"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始转换</button>
      <button class="fbtn gray" id="demoBtn">填入示例</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">转换结果</strong></div>
      <div id="res" style="padding:0 2px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于 MAC 地址转 EUI-64 转换器介绍：</h4>
    <ol>
      <li>EUI-64 是 64 位的接口标识符，由 48 位 MAC 地址扩展而来：在中间插入 FF:FE 两个字节。</li>
      <li>同时需要把第一个字节的第 7 位（U/L 位）取反，MAC 址中该位为 0 表示全球唯一。</li>
      <li>生成的 EUI-64 可与 IPv6 前缀拼成完整地址，链路本地地址（fe80::/10）常用于同网段设备发现。</li>
      <li>本工具会同时给出字节序列、EUI-64、IPv6 完整地址与压缩形式。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
/* 解析 MAC -> 6 字节数组，非法返回 null */
function __xfMacBytes(mac) {
  const s = String(mac == null ? "" : mac).trim();
  const h = s.replace(/[^0-9a-fA-F]/g, "");
  if (h.length !== 12) return null;
  const out = [];
  for (let i = 0; i < 12; i += 2) out.push(parseInt(h.substr(i, 2), 16));
  return out;
}

/* MAC -> EUI-64（8 字节） */
function __xfEui64(mac) {
  const b = __xfMacBytes(mac);
  if (!b) return null;
  const flipped = b[0] ^ 0x02;   // 翻转 U/L 位（第 7 位，值 0x02）
  const eui = [flipped, b[1], b[2], 0xFF, 0xFE, b[3], b[4], b[5]];
  const hex = eui.map(x => x.toString(16).padStart(2, "0"));
  const euiStr = hex.join(":").toUpperCase();
  /* 接口 ID 按 IPv6 写法分 4 组、每组 4 位十六进制 */
  const ifid = [hex.slice(0, 2), hex.slice(2, 4), hex.slice(4, 6), hex.slice(6, 8)].map(g => g.join("")).join(":");
  const ifidUpper = ifid.toUpperCase();
  return {
    macHex: b.map(x => x.toString(16).padStart(2, "0")).join(":").toUpperCase(),
    flipped: "0x" + flipped.toString(16).padStart(2, "0").toUpperCase() + "（原 0x" + b[0].toString(16).padStart(2, "0").toUpperCase() + "）",
    eui64: euiStr,
    ifid: ifidUpper,
    bytes: eui
  };
}

/* 与前缀拼出 IPv6（简化：仅展开形式拼接） */
function __xfMac2Ipv6(mac, prefix) {
  const e = __xfEui64(mac);
  if (!e) return null;
  let pfx = String(prefix == null ? "" : prefix).trim();
  if (!pfx) pfx = "fe80::";
  // 用十六进制组拼接，避免复杂解析
  const ifidGroups = [e.bytes.slice(0, 2), e.bytes.slice(2, 4), e.bytes.slice(4, 6), e.bytes.slice(6, 8)]
    .map(g => g.map(x => x.toString(16).padStart(2, "0")).join(""));
  const ifid = ifidGroups.join(":");
  if (pfx.endsWith("::")) return pfx + ifid;
  if (pfx.endsWith(":")) return pfx + ifid;
  return pfx + ":" + ifid;
}

window.__xfMacBytes = __xfMacBytes;
window.__xfEui64 = __xfEui64;
window.__xfMac2Ipv6 = __xfMac2Ipv6;

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function run() {
  const e = __xfEui64($("mac").value);
  if (!e) { $("res").innerHTML = '<p style="color:#e54d42;font-size:13px;">请输入合法的 MAC 址（12 位十六进制，如 00:1A:2B:3C:4D:5E）</p>'; $("tip").textContent = "转换失败"; return; }
  const ipv6 = __xfMac2Ipv6($("mac").value, $("prefix").value);
  const rows = [
    ["原始 MAC", e.macHex],
    ["第 1 字节（U/L 位翻转后）", e.flipped],
    ["EUI-64 接口标识符", e.eui64],
    ["接口 ID（IPv6 写法）", e.ifid],
    ["IPv6 完整地址", ipv6],
    ["字节序列（十进制）", e.bytes.join(" ")]
  ];
  $("tip").textContent = "转换结果";
  $("res").innerHTML = '<div class="v6rows">' + rows.map(([n, val]) =>
    '<div class="v6row"><div class="v6lab"><b>' + n + "</b></div>" +
    '<div class="v6val"><code>' + esc(val) + '</code><button class="v6cp" data-v="' + esc(val) + '">复制</button></div></div>'
  ).join("") + "</div>";
  Array.prototype.forEach.call($("res").querySelectorAll(".v6cp"), btn => {
    btn.onclick = () => navigator.clipboard.writeText(btn.getAttribute("data-v")).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制", 1200); });
  });
}
$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("mac").value = "00:1A:2B:3C:4D:5E"; run(); };
$("mac").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("prefix").addEventListener("input", run);
$("mac").value = "00:1A:2B:3C:4D:5E";
run();
</script>
<style>
.v6rows{display:flex;flex-direction:column;gap:8px;max-width:760px;}
.v6row{border:1px solid #e8e8e8;border-radius:8px;padding:8px 12px;background:#fafafa;}
.v6lab{font-size:12px;color:#888;margin-bottom:4px;}
.v6lab b{color:#333;font-size:13px;font-weight:600;}
.v6val{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.v6val code{font-family:Consolas,Monaco,monospace;font-size:14px;color:#1f6feb;word-break:break-all;}
.v6cp{flex:0 0 auto;border:none;background:#ff6500;color:#fff;border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;}
html.dark .v6row{background:#22262b;border-color:#333a42;}
html.dark .v6lab b{color:#e6e6e6;}
html.dark .v6val code{color:#6cb6ff;}
</style>
