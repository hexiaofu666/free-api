<meta name="description" content="在线身体表面积计算器，按身高体重用 Mosteller、DuBois、Haycock、Gehan-George 四种临床公式同时估算体表面积 BSA，供用药剂量换算参考。">

hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="bodyarea" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>身高（cm）</label><input type="text" id="h" value="170"></div>
      <div class="fitem"><label>体重（kg）</label><input type="text" id="w" value="65"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算体表面积</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写身高体重后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于身体表面积计算器介绍：</h4>
    <ol>
      <li>Mosteller 公式：体表面积（㎡）= √(身高cm × 体重kg ÷ 3600)，计算简单，临床应用最广。</li>
      <li>DuBois 公式：0.007184 × 身高^0.725 × 体重^0.425；Haycock 公式：0.024265 × 身高^0.3964 × 体重^0.5378。</li>
      <li>Gehan-George 公式：0.0235 × 身高^0.42246 × 体重^0.51456，适用于各年龄段人群。</li>
      <li>体表面积常用于化疗药物、激素与部分特殊药品的剂量换算，实际用药必须以医嘱和药品说明书为准。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfBsaMosteller(h, w) { return Math.sqrt(h * w / 3600); }
function __xfBsaDubois(h, w) { return 0.007184 * Math.pow(h, 0.725) * Math.pow(w, 0.425); }
function __xfBsaHaycock(h, w) { return 0.024265 * Math.pow(h, 0.3964) * Math.pow(w, 0.5378); }
function __xfBsaGehan(h, w) { return 0.0235 * Math.pow(h, 0.42246) * Math.pow(w, 0.51456); }
function __xfBsaAvg(h, w) {
  return (__xfBsaMosteller(h, w) + __xfBsaDubois(h, w) + __xfBsaHaycock(h, w) + __xfBsaGehan(h, w)) / 4;
}
function __xfBsaSpread(h, w) {
  var a = [__xfBsaMosteller(h, w), __xfBsaDubois(h, w), __xfBsaHaycock(h, w), __xfBsaGehan(h, w)];
  return Math.max.apply(null, a) - Math.min.apply(null, a);
}
function __xfDose(total, h, w) { return total * __xfBsaMosteller(h, w); }
function __xfRound4(v) { return Math.round(v * 10000) / 10000; }
function run() {
  var h = Number($("h").value), w = Number($("w").value);
  if (!(h > 0) || !(w > 0)) { $("tip").textContent = "⚠️ 请填写大于 0 的身高与体重"; $("res").innerHTML = ""; return null; }
  var mo = __xfBsaMosteller(h, w), db = __xfBsaDubois(h, w), hc = __xfBsaHaycock(h, w), gh = __xfBsaGehan(h, w);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>" + h + " cm / " + w + " kg</div>" +
    "<div>Mosteller 公式：<b style='color:#3b82c4;font-size:16px;'>" + __xfRound4(mo) + " ㎡</b></div>" +
    "<div>DuBois 公式：" + __xfRound4(db) + " ㎡</div>" +
    "<div>Haycock 公式：" + __xfRound4(hc) + " ㎡</div>" +
    "<div>Gehan-George 公式：" + __xfRound4(gh) + " ㎡</div>" +
    "<div style='color:#888;'>四式均值 " + __xfRound4(__xfBsaAvg(h, w)) + " ㎡，极差 " + __xfRound4(__xfBsaSpread(h, w)) + " ㎡</div>";
  return mo;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
