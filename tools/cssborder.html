<body data-tool="cssborder" data-cat="seo">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>边框宽度 <b id="vw">2</b>px</label><input type="range" id="width" min="1" max="20" value="2"></div>
      <div class="fitem"><label>边框样式</label>
        <select id="style">
          <option value="dashed" selected>虚线 dashed</option>
          <option value="dotted">点线 dotted</option>
          <option value="solid">实线 solid</option>
          <option value="double">双线 double</option>
          <option value="groove">凹槽 groove</option>
          <option value="ridge">凸起 ridge</option>
        </select>
      </div>
      <div class="fitem"><label>边框颜色</label><input type="color" id="color" value="#ff6500"></div>
      <div class="fitem"><label>圆角 <b id="rv">8</b>px</label><input type="range" id="radius" min="0" max="60" value="8"></div>
      <div class="fitem"><label>背景色</label><input type="color" id="bg" value="#ffffff"></div>
      <div class="fitem"><label>内边距 <b id="pv">16</b>px</label><input type="range" id="pad" min="0" max="60" value="16"></div>
    </div>
    <div class="abar">
      <button class="fbtn brown" id="copyBtn">复制 CSS 代码</button>
      <button class="fbtn gray" id="demoBtn">重置</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong>实时预览</strong></div>
      <div class="cbd-prev"><div id="prev" class="cbd-box">边框效果预览</div></div>
    </div>
    <div class="vout on">
      <div class="vhead"><strong>CSS 代码</strong></div>
      <textarea id="res" readonly style="height:110px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于 CSS 边框生成器介绍：</h4>

      <li>拖动滑块即可实时看到边框效果，支持实线、虚线、点线、双线、凹槽、凸起六种样式。</li>

      <li>可同时设置边框颜色、圆角、背景色与内边距，生成的 CSS 可直接用于你的页面。</li>

<script src="../assets/chrome.js?v=1.6.0"></script>
<script>
/* 生成 CSS：返回字符串 */
function __xfBorderCss(o) {
  const lines = [
    "border: " + o.width + "px " + o.style + " " + o.color + ";",
    "border-radius: " + o.radius + "px;"
  ];
  if (o.bg) lines.push("background: " + o.bg + ";");
  if (o.pad !== undefined && o.pad !== null && o.pad !== "") lines.push("padding: " + o.pad + "px;");
  return ".box {\n  " + lines.join("\n  ") + "\n}";
}
window.__xfBorderCss = __xfBorderCss;

const $ = id => document.getElementById(id);
function collect() {
  return { width: +$("width").value, style: $("style").value, color: $("color").value, radius: +$("radius").value, bg: $("bg").value, pad: +$("pad").value };
}
function run() {
  const o = collect();
  $("vw").textContent = o.width; $("rv").textContent = o.radius; $("pv").textContent = o.pad;
  const p = $("prev");
  p.style.border = o.width + "px " + o.style + " " + o.color;
  p.style.borderRadius = o.radius + "px";
  p.style.background = o.bg;
  p.style.padding = o.pad + "px";
  $("res").value = __xfBorderCss(o);
}
["width", "style", "color", "radius", "bg", "pad"].forEach(id => { $(id).addEventListener("input", run); $(id).addEventListener("change", run); });
$("copyBtn").onclick = () => navigator.clipboard.writeText($("res").value).then(() => alert("✅ 已复制 CSS 代码"));
$("demoBtn").onclick = () => { $("width").value = 2; $("style").value = "dashed"; $("color").value = "#ff6500"; $("radius").value = 8; $("bg").value = "#ffffff"; $("pad").value = 16; run(); };
run();
</script>

.cbd-prev{display:flex;justify-content:center;align-items:center;background:repeating-conic-gradient(#f0f0f0 0% 25%, #ffffff 0% 50%) 50% / 18px 18px;border-radius:8px;padding:26px;}
.cbd-box{color:#666;font-size:14px;text-align:center;min-width:180px;}
html.dark .cbd-prev{background:#20242a;}
