<body data-tool="ipv6valid" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>IPv6 地址（每行一个，可批量）</label>
        <textarea id="ips" style="height:130px;" placeholder="2001:db8::1&#10;fe80::1&#10;:::1"></textarea>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始验证</button>
      <button class="fbtn gray" id="demoBtn">填入示例</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">验证结果</strong></div>
      <div id="res" style="padding:0 2px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于 IPv6 地址验证工具介绍：</h4>
    <ol>
      <li>支持批量校验，每行一个地址，工具会逐一判断格式是否合法并给出原因。</li>
      <li>合法地址会自动识别类型：全球单播、链路本地（fe80::/10）、唯一本地（fc00::/7）、组播（ff00::/8）、回环（::1）、未指定（::）等。</li>
      <li>常见错误包括组数不足、出现多个 ::、组内字符超长、出现非法字符等，工具会分别提示。</li>
      <li>支持带方括号的写法（如 [2001:db8::1]）以及带 % 区域标识的链路本地地址。</li>
    </ol>
  </div>
</div></div></div>

<script>
function __xfV6Compress(g) {
  const hex = g.map(n => n.toString(16));
  let bs = -1, bl = 0, cs = -1, cl = 0;
  for (let i = 0; i < 8; i++) { if (g[i] === 0) { if (cs < 0) cs = i; cl++; if (cl > bl) { bl = cl; bs = cs; } } else { cs = -1; cl = 0; } }
  if (bl < 2) return hex.join(":");
  const left = hex.slice(0, bs).join(":"), right = hex.slice(bs + bl).join(":");
  if (!left && !right) return "::";
  if (!left) return "::" + right;
  if (!right) return left + "::";
  return left + "::" + right;
}
/* 返回 {ok, reason, type, groups, normalized, expand} */
function __xfV6Check(addr) {
  let s = String(addr == null ? "" : addr).trim();
  if (!s) return { ok: false, reason: "空地址" };
  let zone = "";
  if (s.indexOf("%") >= 0) { const p = s.split("%"); s = p[0]; zone = p[1]; }
  if (s.startsWith("[") && s.endsWith("]")) s = s.slice(1, -1);
  if (!/^[0-9a-fA-F:.]+$/.test(s)) return { ok: false, reason: "含非法字符（只允许 0-9 a-f : .）" };
  const dblCount = (s.match(/::/g) || []).length;
  if (dblCount > 1) return { ok: false, reason: "出现多个连续的 :: 压缩符" };
  let head = [], tail = [], dbl = dblCount === 1;
  if (dbl) { const p = s.split("::"); head = p[0] ? p[0].split(":") : []; tail = p[1] ? p[1].split(":") : []; }
  else head = s.split(":");
  const all = head.concat(tail);
  const groups = [];
  for (let i = 0; i < all.length; i++) {
    const g = all[i];
    if (g === "") return { ok: false, reason: "存在空的分组（冒号多余）" };
    /* 末尾嵌入的 IPv4 写法（如 ::ffff:192.168.1.1），折算为 2 组 */
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(g)) {
      const o = g.split(".").map(Number);
      if (o.some(n => n > 255)) return { ok: false, reason: "嵌入的 IPv4「" + g + "」存在大于 255 的段" };
      if (i !== all.length - 1) return { ok: false, reason: "嵌入的 IPv4「" + g + "」只能出现在地址末尾" };
      groups.push((o[0] << 8) | o[1], (o[2] << 8) | o[3]);
      continue;
    }
    if (!/^[0-9a-fA-F]{1,4}$/.test(g)) return { ok: false, reason: "分组「" + g + "」不是 1-4 位十六进制" };
    groups.push(parseInt(g, 16));
  }
  if (all.length === 8 && dbl) return { ok: false, reason: "已有 8 组还使用 :: 压缩" };
  if (all.length > 8) return { ok: false, reason: "分组数量超过 8 组" };
  if (!dbl && all.length !== 8) return { ok: false, reason: "不足 8 组且未使用 :: 压缩（实际 " + all.length + " 组）" };
  const fill = 8 - groups.length;
  const full = dbl ? groups.slice(0, head.length).concat(new Array(fill).fill(0)).concat(groups.slice(head.length)) : groups;
  let type = "全球单播（2000::/3）";
  const b0 = full[0];
  if (full.every(n => n === 0)) type = "未指定地址（::）";
  else if (full.slice(0, 7).every(n => n === 0) && full[7] === 1) type = "回环地址（::1）";
  else if ((b0 & 0xffc0) === 0xfe80) type = "链路本地（fe80::/10）";
  else if ((b0 & 0xfe00) === 0xfc00) type = "唯一本地（fc00::/7）";
  else if ((b0 & 0xff00) === 0xff00) type = "组播（ff00::/8）";
  else if (full.slice(0, 5).every(n => n === 0) && full[5] === 0xffff) type = "IPv4 映射（::ffff:0:0/96）";
  else if (full.slice(0, 6).every(n => n === 0)) type = "IPv4 兼容（::/96，已弃用）";
  else if (b0 === 0x2002) type = "6to4（2002::/16）";
  else if (b0 === 0x2001 && full[1] === 0x0db8) type = "文档示例（2001:db8::/32）";
  else if ((b0 & 0xffe0) !== 0x2000) type = "保留/其他类型";
  return { ok: true, type: type + (zone ? "（区域 " + zone + "）" : ""), groups: full, normalized: __xfV6Compress(full), expand: full.map(n => n.toString(16).padStart(4, "0")).join(":") };
}
window.__xfV6Check = __xfV6Check;
window.__xfV6Compress = __xfV6Compress;

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function run() {
  const lines = $("ips").value.split("\n").map(x => x.trim()).filter(x => x !== "");
  if (!lines.length) return alert("请至少输入一个 IPv6 地址");
  let ok = 0;
  const rows = lines.map(line => {
    const r = __xfV6Check(line);
    if (r.ok) ok++;
    const badge = r.ok ? '<span class="v6ok">✔ 合法</span>' : '<span class="v6bad">✘ 非法</span>';
    const detail = r.ok
      ? '<div class="v6meta">类型：' + esc(r.type) + '</div><div class="v6meta">规范：<code>' + esc(r.normalized) + "</code></div>"
      : '<div class="v6meta v6err">原因：' + esc(r.reason) + "</div>";
    return '<div class="v6item"><div class="v6top"><code>' + esc(line) + "</code>" + badge + "</div>" + detail + "</div>";
  }).join("");
  $("res").innerHTML = '<div class="v6sum">共 ' + lines.length + " 条，合法 " + ok + " 条，非法 " + (lines.length - ok) + " 条</div>" + rows;
  $("tip").textContent = "验证完成";
}
$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("ips").value = "2001:db8::1\nfe80::1%eth0\n::1\n::ffff:192.168.1.1\n2001:db8:::1\n12345::1\n2001:db8:0:0:0:0:0:0:1"; run(); };
$("ips").value = "2001:db8::1\nfe80::1\n:::1";
run();
</script>
