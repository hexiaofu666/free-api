vironment｜集成开发环境","d":""},{"k":"FAQ","v":"Frequently Asked Questions｜常见问题解答","d":""},{"k":"DIY","v":"Do It Yourself｜自己动手做","d":""},{"k":"VIP","v":"Very Important Person｜贵宾","d":""},{"k":"GDP","v":"Gross Domestic Product｜国内生产总值","d":""},{"k":"YOY","v":"Year Over Year｜同比","d":"与去年同期相比"},{"k":"MOM","v":"Month Over Month｜环比","d":"与上期相比"},{"k":"B2B","v":"Business To Business｜企业对企业的交易模式","d":""},{"k":"B2C","v":"Business To Consumer｜企业对消费者的交易模式","d":""},{"k":"C2C","v":"Consumer To Consumer｜个人对个人的交易模式","d":""},{"k":"O2O","v":"Online To Offline｜线上到线下的商业模式","d":""},{"k":"R&D","v":"Research And Development｜研究与开发","d":""},{"k":"HR","v":"Human Resources｜人力资源","d":""},{"k":"PR","v":"Public Relations｜公共关系","d":""}];
function __xfList() { return DATA; }
function __xfSearch(kw) {
  var k = String(kw == null ? "" : kw).trim().toLowerCase();
  if (!k) return DATA.slice();
  return DATA.filter(function (it) {
    return (it.k + " " + it.v + " " + (it.d || "")).toLowerCase().indexOf(k) >= 0;
  });
}
function __xfRender(list, kw) {
  if (!list.length) return "<div style='padding:14px 15px;color:#999;'>没有匹配「" + kw + "」的条目</div>";
  return list.map(function (it) {
    return "<div style='padding:10px 15px;border-bottom:1px solid #f0f0f0;'>" +
      "<b style='color:#3b82c4;font-family:Consolas,monospace;'>" + it.k + "</b>" +
      "<span style='margin-left:10px;color:#333;'>" + it.v + "</span>" +
      (it.d ? "<div style='color:#999;font-size:12px;margin-top:4px;'>" + it.d + "</div>" : "") +
      "</div>";
  }).join("");
}
function run() {
  var kw = $("kw").value;
  var list = __xfSearch(kw);
  $("res").innerHTML = __xfRender(list, kw);
  $("tip").textContent = kw ? "筛选到 " + list.length + " 条" : "共 " + DATA.length + " 条，输入关键词可即时筛选";
  return list;
}
$("kw").oninput = run;
$("allBtn").onclick = function () { $("kw").value = ""; return run(); };
$("clrBtn").onclick = function () { $("kw").value = ""; return run(); };
run();
function __xfExpand(abbr) {
  var k = String(abbr == null ? "" : abbr).trim().toLowerCase();
  for (var i = 0; i < DATA.length; i++) { if (DATA[i].k.toLowerCase() === k) return DATA[i]; }
  return null;
}
function __xfFullName(abbr) {
  var r = __xfExpand(abbr);
  if (!r) return "";
  return String(r.v).split("｜")[0];
}
function __xfCnMeaning(abbr) {
  var r = __xfExpand(abbr);
  if (!r) return "";
  return String(r.v).split("｜")[1];
}
function __xfAbbrs() { return DATA.map(function (it) { return it.k; }); }
