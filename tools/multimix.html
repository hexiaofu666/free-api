<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多色混合计算 - 词海工具箱</title>
<meta name="description" content="把多个十六进制颜色按通道平均混合，支持自定义各色权重，实时预览混合结果并给出 RGB 与 HSL 数值。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/multimix.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="multimix" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>颜色列表（每行一个，可加权重）</label>
        <textarea id="src" style="min-height:110px;font-family:monospace;">#ff6500 2
#1e50a2 1
#ffffff 1</textarea>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算混合色</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">混合结果</strong><span id="state"></span></div>
      <div id="sw" style="height:56px;border-radius:6px;margin:8px 0;background:#dddddd;"></div>
      <textarea id="res" readonly style="height:120px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于多色混合计算介绍：</h4>
    <ol>
      <li>混合按 RGB 三个通道分别做加权平均，权重越大该颜色在结果中占比越高。</li>
      <li>支持三位简写与六位完整十六进制写法，井号可有可无，大小写不敏感。</li>
      <li>每行可在颜色后跟一个数字作为权重，不写权重时默认按 1 计算。</li>
      <li>混合结果以十六进制与 RGB 两种形式给出，色块区域可直接看到实际观感。</li>
      <li>注意 RGB 平均属于线性混合，与颜料调色的减法混合结果不同，做设计参考即可。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfHex2Rgb(hex) {
  var s = String(hex).trim().replace(/^#/, "");
  if (s.length === 3) s = s.replace(/./g, function (c) { return c + c; });
  if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
  return { r: parseInt(s.slice(0, 2), 16), g: parseInt(s.slice(2, 4), 16), b: parseInt(s.slice(4, 6), 16) };
}
function __xfRgb2Hex(c) {
  function h(x) { var v = Math.max(0, Math.min(255, Math.round(x))).toString(16); return v.length < 2 ? "0" + v : v; }
  return "#" + h(c.r) + h(c.g) + h(c.b);
}
function __xfMixColors(colors, weights) {
  var r = 0, g = 0, b = 0, wsum = 0;
  for (var i = 0; i < colors.length; i++) {
    var c = typeof colors[i] === "string" ? __xfHex2Rgb(colors[i]) : colors[i];
    if (!c) continue;
    var w = weights && weights[i] !== undefined ? Number(weights[i]) : 1;
    r += c.r * w; g += c.g * w; b += c.b * w; wsum += w;
  }
  if (!wsum) return null;
  return __xfRgb2Hex({ r: r / wsum, g: g / wsum, b: b / wsum });
}
function __xfParseColorLines(text) {
  var cs = [], ws = [];
  String(text).replace(/\r\n?/g, "\n").split("\n").forEach(function (l) {
    var t = l.trim(); if (!t) return;
    var m = t.match(/^(#?[0-9a-fA-F]{3,6})\s*([0-9.]+)?$/);
    if (!m) return;
    cs.push(m[1].charAt(0) === "#" ? m[1] : "#" + m[1]);
    ws.push(m[2] === undefined ? 1 : parseFloat(m[2]));
  });
  return { colors: cs, weights: ws };
}
window.__xfHex2Rgb = __xfHex2Rgb;
window.__xfRgb2Hex = __xfRgb2Hex;
window.__xfMixColors = __xfMixColors;
window.__xfParseColorLines = __xfParseColorLines;
function run() {
  var p = __xfParseColorLines($("src").value);
  var mix = __xfMixColors(p.colors, p.weights);
  var rgb = mix ? __xfHex2Rgb(mix) : null;
  $("res").value = mix ? ["混合色：" + mix, "RGB：" + rgb.r + ", " + rgb.g + ", " + rgb.b, "参与混合：" + p.colors.length + " 色，权重合计 " + p.weights.reduce(function (a, b) { return a + b; }, 0)].join("\n") : "没有可用的颜色";
  if (mix) $("sw").style.background = mix;
  $("state").textContent = p.colors.length + " 色";
  $("tip").textContent = mix ? "✅ 混合色 " + mix : "⚠️ 未识别到颜色";
  return mix;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
