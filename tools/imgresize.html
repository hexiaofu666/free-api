<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片尺寸调整在线 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="在线图片尺寸调整工具，按像素或百分比缩放图片，可锁比例，浏览器本地处理不上传">
<link rel="canonical" href="https://tools.hdemba.cn/tools/imgresize.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="imgresize" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>选择图片</label><input type="file" id="file" accept="image/*" style="height:38px;padding:6px 10px;"></div>
      <div class="fitem"><label>调整方式</label>
        <select id="mode">
          <option value="pct">按百分比</option>
          <option value="px">按像素宽高</option>
        </select>
      </div>
      <div class="fitem" id="pctItem"><label>缩放比例(%)</label><input type="number" id="pct" value="50" min="1" max="500"></div>
      <div class="fitem" id="wItem" style="display:none;"><label>目标宽度(px)</label><input type="number" id="tw" value="800" min="1" max="10000"></div>
      <div class="fitem" id="hItem" style="display:none;"><label>目标高度(px)</label><input type="number" id="th" value="600" min="1" max="10000"></div>
      <div class="fitem" id="lockItem" style="display:none;"><label>锁定比例</label>
        <select id="lock"><option value="1">锁定（按宽度等比）</option><option value="0">不锁定（自由拉伸）</option></select>
      </div>
      <div class="fitem"><label>输出格式</label>
        <select id="fmt">
          <option value="image/png">PNG（无损）</option>
          <option value="image/jpeg">JPG（体积小）</option>
          <option value="image/webp">WebP（现代格式）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始调整</button>
      <button class="fbtn gray" id="dlBtn" style="display:none;">下载图片</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>调整结果</strong><span id="info"></span></div>
      <div style="text-align:center;padding:10px;">
        <img id="preview" style="max-width:100%;border:1px solid #eee;border-radius:6px;">
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于图片尺寸调整工具介绍：</h4>
    <ol>
      <li>本工具可以按百分比缩放图片，或指定像素宽高精确调整尺寸。</li>
      <li>按像素模式可锁定比例：只需填目标宽度，高度自动等比计算。</li>
      <li>支持 PNG、JPG、WebP 三种输出格式，实时预览缩放效果。</li>
      <li>图片缩放完全在浏览器本地完成（Canvas 绘制），不会上传到任何服务器，安全无忧。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
const $=id=>document.getElementById(id);
let img=null,srcSize=0;
$("mode").onchange=()=>{
  const px=$("mode").value==="px";
  $("pctItem").style.display=px?"none":"";
  $("wItem").style.display=px?"":"none";
  $("hItem").style.display=px?"":"none";
  $("lockItem").style.display=px?"":"none";
};
$("tw").oninput=()=>{
  if(!img||$("lock").value!=="1")return;
  $("th").value=Math.max(1,Math.round(img.height*(+$("tw").value/img.width)));
};
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  srcSize=f.size;
  img=new Image();
  img.onload=()=>{
    $("tw").value=img.width; $("th").value=img.height;
    $("runBtn").click();
  };
  img.src=URL.createObjectURL(f);
};
$("runBtn").onclick=()=>{
  if(!img){alert("请先选择图片");return;}
  let w,h;
  if($("mode").value==="pct"){
    const p=Math.min(Math.max(+$("pct").value||100,1),500)/100;
    w=Math.max(1,Math.round(img.width*p)); h=Math.max(1,Math.round(img.height*p));
  }else{
    w=Math.min(Math.max(+$("tw").value||img.width,1),10000);
    h=Math.min(Math.max(+$("th").value||img.height,1),10000);
  }
  const cv=document.createElement("canvas");
  cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(img,0,0,w,h);
  const fmt=$("fmt").value;
  const url=cv.toDataURL(fmt,0.92);
  $("preview").src=url;
  $("info").innerHTML=`${img.width}×${img.height} → <strong style="color:#ff6500;">${w}×${h}</strong>（${fmt.split("/")[1].toUpperCase()}）`;
  $("dlBtn").style.display="";
  $("outBox").classList.add("on");
  $("dlBtn").onclick=()=>{const a=document.createElement("a");a.download=`resized_${w}x${h}.${fmt.split("/")[1]}`;a.href=url;a.click();};
};
$("clearBtn").onclick=()=>{$("outBox").classList.remove("on");img=null;};
</script>
</body>
</html>
