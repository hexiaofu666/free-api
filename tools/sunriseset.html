<script>
/* 基于 julian day 的太阳位置算法（简化 suncalc） */
function __xfSunTimes(lat, lng, date, tzOffset) {
  const rad = Math.PI / 180;
  const dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
  const toJulian = d => d.valueOf() / dayMs - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const toDays = d => toJulian(d) - J2000;
  const e = rad * 23.4397;

  const declination = (l) => Math.asin(Math.sin(e) * Math.sin(l));
  const solarMeanAnomaly = (d) => rad * (357.5291 + 0.98560028 * d);
  const eclipticLongitude = (M) => {
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const P = rad * 102.9372;
    return M + C + P + Math.PI;
  };
  const julianCycle = (d, lw) => Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const approxTransit = (Ht, lw, n) => 0.0009 + (Ht + lw) / (2 * Math.PI) + n;
  const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));

  const lw = rad * -lng;
  const phi = rad * lat;
  const d = toDays(date);
  const n = julianCycle(d, lw);
  const ds = approxTransit(0, lw, n);
  const M = solarMeanAnomaly(ds);
  const L = eclipticLongitude(M);
  const dec = declination(L);
  const Jnoon = solarTransitJ(ds, M, L);

  const h0 = rad * -0.833;
  const cosH = (Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
  let Jset, Jrise, polar = null;
  if (cosH > 1) polar = "polar-night";
  else if (cosH < -1) polar = "polar-day";
  if (polar === null) {
    const w = Math.acos(cosH);
    Jset = solarTransitJ(approxTransit(w, lw, n), M, L);
    Jrise = Jnoon - (Jset - Jnoon);
  }

  // 换算到指定时区显示
  function fmt(julian) {
    const utc = fromJulian(julian);
    const shifted = new Date(utc.getTime() + tzOffset * 3600000);
    return String(shifted.getUTCHours()).padStart(2, "0") + ":" + String(shifted.getUTCMinutes()).padStart(2, "0");
  }
  if (polar === "polar-night") return { polar: "极夜：当天太阳不升起", noon: fmt(Jnoon) };
  if (polar === "polar-day") return { polar: "极昼：当天太阳不落下", noon: fmt(Jnoon) };

  const riseMs = Jrise, setMs = Jset;
  const dayLenH = (setMs - riseMs) * 24;
  return {
    sunrise: fmt(Jrise),
    sunset: fmt(Jset),
    noon: fmt(Jnoon),
    dayLength: Math.floor(dayLenH) + " 小时 " + Math.round((dayLenH - Math.floor(dayLenH)) * 60) + " 分钟",
    sunAltitude: Math.round((90 - Math.abs(lat - dec / rad)) * 10) / 10
  };
}
window.__xfSunTimes = __xfSunTimes;

const $ = id => document.getElementById(id);
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function run() {
  const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
  const dateStr = $("date").value || todayStr();
  if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
    $("res").innerHTML = '<p style="color:#e54d42;font-size:13px;">请输入合法的经纬度（纬度 -90~90，经度 -180~180）</p>'; $("tip").textContent = "计算失败"; return;
  }
  const date = new Date(dateStr + "T12:00:00Z");
  const tz = parseFloat($("tz").value) || 0;
  const r = __xfSunTimes(lat, lng, date, tz);
  if (r.polar) {
    $("res").innerHTML = '<div class="ss-card ss-polar"><div class="ss-k">' + r.polar + '</div><div class="ss-d">正午时刻：' + r.noon + "</div></div>";
    $("tip").textContent = "计算结果"; return;
  }
  const cards = [["日出时间", r.sunrise], ["日落时间", r.sunset], ["太阳正午", r.noon], ["昼长", r.dayLength], ["正午太阳高度角", r.sunAltitude + "°"]];
  $("res").innerHTML = cards.map(([k, v]) => '<div class="ss-card"><div class="ss-k">' + k + '</div><div class="ss-v">' + v + "</div></div>").join("");
  $("tip").textContent = "计算结果（" + dateStr + "）";
}
$("city").addEventListener("change", () => {
  const v = $("city").value;
  if (v) { const p = v.split(","); $("lat").value = p[0]; $("lng").value = p[1]; }
  run();
});
["lat", "lng", "date", "tz"].forEach(id => { $(id).addEventListener("change", run); $(id).addEventListener("input", run); });
$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("city").value = "39.9042,116.4074"; $("lat").value = "39.9042"; $("lng").value = "116.4074"; $("tz").value = 8; $("date").value = todayStr(); run(); };
$("date").value = todayStr();
run();
</script>
