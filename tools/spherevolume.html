<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆球体积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆球体积计算器，输入半径或直径算出球的体积与表面积，并给出半球、球冠等衍生体积。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/spherevolume.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="spherevolume" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知</label>
        <select id="mode"><option value="r">半径 r</option><option value="d">直径 d</option></select>
      </div>
      <div class="fitem"><label>数值</label><input type="text" id="src" value="3"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">球体积 V = 4/3 πr³</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆球体积计算器介绍：</h4>
    <ol>
      <li>球体积公式 V = 4/3πr³，表面积公式 S = 4πr²。</li>
      <li>可按半径或直径输入，程序自动换算半径后再计算。</li>
      <li>结果同时给出半球体积（正好一半）与球的外接正方体体积，便于比对。</li>
      <li>球体积随半径的三次方增长，半径翻倍则体积变为 8 倍。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfSphere(r, dec) {
  var x = Number(r);
  if (!isFinite(x) || x <= 0) return null;
  var vol = 4 / 3 * Math.PI * x * x * x;
  return {
    r: x, d: 2 * x, volume: vol, surface: 4 * Math.PI * x * x, half: vol / 2, box: Math.pow(2 * x, 3),
    text: { volume: String(__xfRound(vol, dec)), surface: String(__xfRound(4 * Math.PI * x * x, dec)), half: String(__xfRound(vol / 2, dec)), box: String(__xfRound(Math.pow(2 * x, 3), dec)) }
  };
}
function __xfSphereByMode(mode, v, dec) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return null;
  return __xfSphere(mode === "d" ? n / 2 : n, dec);
}
function run() {
  var o = __xfSphereByMode($("mode").value, $("src").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>球体积 V = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.volume + "</b></div>" +
    "<div>球表面积 S = " + o.text.surface + "　半径 r = " + __xfRound(o.r, 6) + "</div>" +
    "<div style='color:#888;'>半球体积 = " + o.text.half + "，外接正方体体积 = " + o.text.box + "</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
