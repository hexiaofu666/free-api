    <h4>关于 IPv4 转 IPv6 转换器介绍：</h4>
    <ol>
      <li>IPv4 只有 32 位，IPv6 有 128 位，两者并不能直接等价换算，本工具输出的是常见的「嵌入式」表达方式。</li>
      <li>IPv4 映射地址（::ffff:x.x.x.x）用于在 IPv6 网络中表示纯 IPv4 节点，是最常用的形式。</li>
      <li>6to4（2002::/16）把 IPv4 地址编码进 IPv6 前缀，NAT64 使用 64:ff9b::/96 知名前缀。</li>
      <li>转换结果可直接点击复制，方便粘贴到配置文件或命令行。</li>

<script>
/* 解析 IPv4 为字节数组 */
function __xfIpv4Bytes(ip) {
  const s = String(ip == null ? "" : ip).trim().replace(/^\[|\]$/g, "");
  const parts = s.split(".");
  if (parts.length !== 4) return null;
  const out = [];
  for (let i = 0; i < 4; i++) {
    if (!/^\d{1,3}$/.test(parts[i])) return null;
    const n = parseInt(parts[i], 10);
    if (n > 255) return null;
    out.push(n);
  }
  return out;
}

/* 核心：IPv4 -> 多种 IPv6 表示 */
function __xfV4to6(ip) {
  const b = __xfIpv4Bytes(ip);
  if (!b) return null;
  const [a, c, d, e] = b;
  const hex2 = n => n.toString(16).padStart(2, "0");
  const grp = n => n.toString(16).padStart(4, "0");
  const dec = b.join(".");
  const hc = b.map(hex2).join("");
  return {
    ipv4: dec,
    dottedHex: "0x" + hc,
    mapped: "::ffff:" + dec,
    mappedHex: "::ffff:" + grp(a * 256 + c) + ":" + grp(d * 256 + e),
    compatible: "::" + dec,
    six2four: "2002:" + grp(a * 256 + c) + ":" + grp(d * 256 + e) + "::",
    nat64: "64:ff9b::" + grp(a * 256 + c) + ":" + grp(d * 256 + e),
    decimal: (a * 16777216 + c * 65536 + d * 256 + e) >>> 0
  };
}

window.__xfIpv4Bytes = __xfIpv4Bytes;
window.__xfV4to6 = __xfV4to6;

const $ = id => document.getElementById(id);
const LABELS = [
  ["mapped", "IPv4 映射地址（最常用）", "::ffff:1.2.3.4"],
  ["mappedHex", "IPv4 映射地址（十六进制）", "::ffff:0102:0304"],
  ["six2four", "6to4 地址", "2002:0102:0304::"],
  ["nat64", "NAT64 地址", "64:ff9b::1.2.3.4"],
  ["compatible", "IPv4 兼容地址（已弃用）", "::1.2.3.4"],
  ["dottedHex", "十六进制整数", "0x01020304"],
  ["decimal", "十进制整数", "16909060"],
  ["ipv4", "原始 IPv4", "1.2.3.4"]
];

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function run() {
  const v = $("ip").value.trim();
  const r = __xfV4to6(v);
  if (!r) {
    $("res").innerHTML = '<p style="color:#e54d42;font-size:13px;padding:6px 0;">请输入合法的 IPv4 地址，例如 192.168.1.1</p>';
    $("tip").textContent = "转换失败";
    return;
  }
  $("tip").textContent = "IPv4 地址 " + r.ipv4 + " 的 IPv6 表示";
  $("res").innerHTML = '<div class="v6rows">' + LABELS.map(([k, name, demo]) =>
    '<div class="v6row"><div class="v6lab"><b>' + name + '</b><span>示例 ' + demo + '</span></div>' +
    '<div class="v6val"><code>' + esc(r[k]) + '</code><button class="v6cp" data-v="' + esc(r[k]) + '">复制</button></div></div>'
  ).join("") + "</div>";
  Array.prototype.forEach.call($("res").querySelectorAll(".v6cp"), btn => {
    btn.onclick = () => { navigator.clipboard.writeText(btn.getAttribute("data-v")).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制", 1200); }); };
  });
}

$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("ip").value = "192.168.1.1"; run(); };
$("ip").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("ip").value = "8.8.8.8";
run();
</script>
