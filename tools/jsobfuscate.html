  <div class="resttips">
    <h4>关于JS代码压缩混淆介绍：</h4>
    <ol>
      <li>去注释与压缩空白使用状态机实现，能正确跳过字符串字面量里的 `//` 与 `/*`，不会误删字符串内容。</li>
      <li>中度混淆会把字符串内容转成 \\xHH 形式，代码照常执行但肉眼难以直接读出文字。</li>
      <li>重度混淆额外把 2 位以上整数转成十六进制，进一步降低可读性（浮点数与 0/1 保持不变以免影响语义）。</li>
      <li>本工具不做变量名重命名，因此不会破坏代码语义；如果需要更激进的压缩请使用专业的 UglifyJS / Terser。</li>
      <li>混淆不等于加密：还原非常容易，只是增加阅读成本，切勿用它来保护密钥或敏感逻辑。</li>
    </ol>

<script>
/* 去注释：状态机，保护字符串与正则字面量中的 // 与 /* */
function __xfStripComments(code) {
  var s = String(code), out = "", i = 0, n = s.length;
  var state = "code";
  while (i < n) {
    var c = s[i], c2 = s[i + 1];
    if (state === "code") {
      if (c === "/" && c2 === "/") { state = "line"; i += 2; continue; }
      if (c === "/" && c2 === "*") { state = "block"; i += 2; continue; }
      if (c === '"' || c === "'" || c === "\u0060") { state = c; out += c; i++; continue; }
      out += c; i++; continue;
    }
    if (state === "line") { if (c === "\n") { state = "code"; out += c; } i++; continue; }
    if (state === "block") { if (c === "*" && c2 === "/") { state = "code"; i += 2; continue; } i++; continue; }
    if (state === '"' || state === "'" || state === "\u0060") {
      if (c === "\\") { out += c + (c2 || ""); i += 2; continue; }
      if (c === state) state = "code";
      out += c; i++; continue;
    }
  }
  return out;
}
/* 压缩空白：字符串外合并连续空白，去掉运算符两侧多余空格 */
function __xfMinify(code) {
  var s = __xfStripComments(code), out = "", i = 0, state = "code";
  while (i < s.length) {
    var c = s[i];
    if (state === "code") {
      if (c === '"' || c === "'" || c === "\u0060") { state = c; out += c; i++; continue; }
      if (/\s/.test(c)) {
        var j = i;
        while (j < s.length && /\s/.test(s[j])) j++;
        var prev = out.slice(-1), next = s[j] || "";
        if (/[\w$\]\)}]/.test(prev) && /[\w$(\[{]/.test(next)) out += " ";
        i = j; continue;
      }
      out += c; i++; continue;
    }
    if (c === "\\") { out += c + (s[i + 1] || ""); i += 2; continue; }
    if (c === state) state = "code";
    out += c; i++;
  }
  return out;
}
/* 字符串转义为 \\xHH 形式（仅 ASCII 可打印字符，避免破坏多字节） */
function __xfEscapeStrings(code) {
  var out = "", i = 0, state = "code";
  while (i < code.length) {
    var c = code[i];
    if (state === "code") {
      if (c === '"' || c === "'" || c === "\u0060") { state = c; out += c; i++; continue; }
      out += c; i++; continue;
    }
    if (c === "\\") { out += c + (code[i + 1] || ""); i += 2; continue; }
    if (c === state) { state = "code"; out += c; i++; continue; }
    var code2 = c.charCodeAt(0);
    out += (code2 >= 32 && code2 < 127 && c !== "\\") ? "\\x" + ("0" + code2.toString(16)).slice(-2) : c;
    i++;
  }
  return out;
}
/* 数字转十六进制（仅整数，跳过 0/1 与标识符中的数字） */
function __xfHexNumbers(code) {
  return code.replace(/(^|[^\w$."'])(\d{2,})(?![\w$.])/g, function (m, p, d) {
    return p + "0x" + Number(d).toString(16);
  });
}
function __xfObfuscate(code, level, keepLines) {
  var out = __xfMinify(code);
  if (level === "normal" || level === "heavy") out = __xfEscapeStrings(out);
  if (level === "heavy") out = __xfHexNumbers(out);
  if (keepLines === "yes") out = out.replace(/;/g, ";\n");
  return out;
}
window.__xfStripComments = __xfStripComments;
window.__xfMinify = __xfMinify;
window.__xfEscapeStrings = __xfEscapeStrings;
window.__xfHexNumbers = __xfHexNumbers;
window.__xfObfuscate = __xfObfuscate;

var $ = function (id) { return document.getElementById(id); };
$("runBtn").onclick = function () {
  var src = $("src").value;
  var out = __xfObfuscate(src, $("level").value, $("keep").value);
  $("res").value = out;
  $("state").textContent = "原 " + src.length + " 字符 → " + out.length + " 字符";
  $("tip").textContent = "✅ 混淆完成";
};
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
$("level").onchange = function () { if ($("src").value.trim()) $("runBtn").click(); };
$("runBtn").click();
</script>
