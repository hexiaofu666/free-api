<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆锥表面积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆锥表面积计算器，输入底面半径与高算出圆锥总表面积，同时给出侧面积与展开扇形圆心角。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/conesurface.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="conesurface" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>底面半径 r</label><input type="text" id="r" value="3"></div>
      <div class="fitem"><label>高 h</label><input type="text" id="h" value="4"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">圆锥表面积 S = πr² + πrl</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆锥表面积计算器介绍：</h4>
    <ol>
      <li>总表面积 = 底面积 πr² 加侧面积 πrl，其中 l 为母线长。</li>
      <li>侧面展开是一个扇形，半径等于母线长，圆心角为 360° × r / l。</li>
      <li>做锥形纸帽时按展开扇形裁剪，本工具已直接给出扇形半径与圆心角。</li>
      <li>若不需要底面（如漏斗），只取侧面积即可。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfConeSurface(r, h, dec) {
  var x = Number(r), y = Number(h);
  if (!isFinite(x) || !isFinite(y) || x <= 0 || y <= 0) return null;
  var base = Math.PI * x * x, l = Math.sqrt(x * x + y * y), lateral = Math.PI * x * l;
  return {
    r: x, h: y, base: base, slant: l, lateral: lateral, total: base + lateral, angle: 360 * x / l,
    text: { total: String(__xfRound(base + lateral, dec)), lateral: String(__xfRound(lateral, dec)), base: String(__xfRound(base, dec)), slant: String(__xfRound(l, dec)), angle: String(__xfRound(360 * x / l, 4)) }
  };
}
function run() {
  var o = __xfConeSurface($("r").value, $("h").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的半径与高"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>总表面积 = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.total + "</b></div>" +
    "<div>底面积 = " + o.text.base + "　侧面积 = " + o.text.lateral + "</div>" +
    "<div style='color:#888;'>展开扇形：半径（母线）= " + o.text.slant + "，圆心角 = " + o.text.angle + "°</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
