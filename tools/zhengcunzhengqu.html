<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整存整取利息计算器 - 词海工具箱</title>
<meta name="description" content="在线整存整取利息计算器，按本金、定期年利率与存期算出到期利息与本息合计，支持按年与按月两种存期输入方式。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/zhengcunzhengqu.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="zhengcunzhengqu" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>本金（元）</label><input type="text" id="p" value="100000"></div>
      <div class="fitem"><label>定期年利率（%）</label><input type="text" id="rate" value="1.75"></div>
      <div class="fitem"><label>存期</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="years" value="3" style="flex:1;">
          <select id="unit" style="flex:1;"><option value="y">年</option><option value="m">月</option></select>
        </div>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算利息</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写参数后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于整存整取利息计算器介绍：</h4>
    <ol>
      <li>整存整取利息公式：利息 = 本金 × 年利率 × 存期年数，到期一次性还本付息。</li>
      <li>存期按月输入时会自动除以 12 折算为年数，例如 6 个月即 0.5 年。</li>
      <li>提前支取通常按活期利率计息，会损失大部分利息收益。</li>
      <li>本息合计为到期可获得的全部金额，可用于对比不同存期的收益差异。</li>
      <li>利率请按银行最新挂牌利率或存单约定填写，本工具只做公式计算，结果仅供参考。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfFixedInterest(p, ratePct, years) { return p * ratePct / 100 * years; }
function __xfMonthToYear(months) { return months / 12; }
function __xfRound2(v) { return Math.round(v * 100) / 100; }
function run() {
  var p = Number($("p").value), rate = Number($("rate").value), n = Number($("years").value);
  var unit = $("unit").value || "y";
  var years = unit === "m" ? __xfMonthToYear(n) : n;
  if (!(p > 0) || !(rate > 0) || !(years > 0)) { $("tip").textContent = "⚠️ 请填写大于 0 的本金、利率与存期"; $("res").innerHTML = ""; return null; }
  var interest = __xfFixedInterest(p, rate, years);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>本金 " + p + " 元，年利率 " + rate + "%，存期 " + n + (unit === "m" ? " 个月" : " 年") + "（" + __xfRound2(years) + " 年）</div>" +
    "<div>到期利息：<b style='color:#3f9e5a;font-size:16px;'>" + __xfRound2(interest) + " 元</b></div>" +
    "<div>本息合计：" + __xfRound2(p + interest) + " 元</div>" +
    "<div style='color:#888;'>平均每年利息 " + __xfRound2(interest / years) + " 元</div>";
  return interest;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
