<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆周率在线查询 - 词海工具箱</title>
<meta name="description" content="在线圆周率查询工具，查看圆周率前 1000 位数字，按位数检索任意位、统计数字出现频率。">

<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>

(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="piquery" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>起始位数</label><input type="number" id="from" value="1" min="1" max="1000"></div>
      <div class="fitem"><label>显示位数</label><input type="number" id="len" value="100" min="1" max="1000"></div>
      <div class="fitem"><label>检索数字串</label><input type="text" id="kw" value="123456" placeholder="如 123456"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查看位数</button>
      <button class="fbtn blue" id="findBtn">检索位置</button>
      <button class="fbtn brown" id="statBtn">数字频率</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">圆周率 π 前 1000 位</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;word-break:break-all;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆周率在线查询介绍：</h4>
    <ol>
      <li>本工具内置圆周率小数点后 1000 位精确数字，可分段查看。</li>
      <li>位数从 1 开始计数，第 1 位是 3 后面的第 1 个小数位 1。</li>
      <li>检索功能可以查找任意数字串首次出现的位置，找不到会明确提示。</li>
      <li>数字频率统计会列出 0~9 各数字在前 1000 位中出现的次数。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var PI_DIGITS = "14159265358979323846264338327950288419716939937510" +
"58209749445923078164062862089986280348253421170679" +
"82148086513282306647093844609550582231725359408128" +
"48111745028410270193852110555964462294895493038196" +
"44288109756659334461284756482337867831652712019091" +
"45648566923460348610454326648213393607260249141273" +
"72458700660631558817488152092096282925409171536436" +
"78925903600113305305488204665213841469519415116094" +
"33057270365759591953092186117381932611793105118548" +
"07446237996274956735188575272489122793818301194912" +
"98336733624406566430860213949463952247371907021798" +
"60943702770539217176293176752384674818467669405132" +
"00056812714526356082778577134275778960917363717872" +
"14684409012249534301465495853710507922796892589235" +
"42019956112129021960864034418159813629774771309960" +
"51870721134999999837297804995105973173281609631859" +
"50244594553469083026425223082533446850352619311881" +
"71010003137838752886587533208381420617177669147303" +
"59825349042875546873115956286388235378759375195778" +
"18577805321712268066130019278766111959092164201989";
function __xfPiDigits() { return PI_DIGITS; }
function __xfPiSlice(from, len) {
  var f = Math.max(1, Math.floor(Number(from) || 1));
  var l = Math.max(1, Math.floor(Number(len) || 1));
  if (f > PI_DIGITS.length) return null;
  return PI_DIGITS.slice(f - 1, f - 1 + l);
}
function __xfPiAt(pos) {
  var p = Math.floor(Number(pos));
  if (!isFinite(p) || p < 1 || p > PI_DIGITS.length) return null;
  return PI_DIGITS.charAt(p - 1);
}
function __xfPiFind(sub) {
  var s = String(sub).replace(/\D/g, "");
  if (!s) return null;
  var i = PI_DIGITS.indexOf(s);
  if (i < 0) return null;
  return { start: i + 1, end: i + s.length, text: s };
}
function __xfPiStat(digits) {
  var s = digits || PI_DIGITS, st = {};
  for (var i = 0; i < 10; i++) st[String(i)] = 0;
  for (var j = 0; j < s.length; j++) { var c = s.charAt(j); if (st[c] !== undefined) st[c]++; }
  return st;
}
function run() {
  var s = __xfPiSlice($("from").value, $("len").value);
  if (!s) { $("tip").textContent = "⚠️ 起始位数超出 1000 位范围"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 第 " + $("from").value + " 位起的 " + s.length + " 位数字";
  $("res").innerHTML = "<div style='font-family:Consolas,monospace;line-height:1.8;'>" + s + "</div>";
  return s;
}
function runFind() {
  var o = __xfPiFind($("kw").value);
  if (!o) { $("tip").textContent = "❌ 在 π 的前 1000 位中未找到该数字串"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 首次出现在第 " + o.start + " ~ " + o.end + " 位";
  $("res").innerHTML = "<div>数字串 " + o.text + " 首次出现在小数点后第 <b style='color:#607d8b;'>" + o.start + "</b> 位</div>" +
    "<div style='color:#888;'>上下文：" + __xfPiSlice(Math.max(1, o.start - 5), o.text.length + 10) + "</div>";
  return o;
}
function runStat() {
  var st = __xfPiStat(PI_DIGITS);
  $("tip").textContent = "✅ 前 1000 位数字出现频率";
  $("res").innerHTML = Object.keys(st).map(function (k) { return "<div>数字 " + k + "：出现 " + st[k] + " 次</div>"; }).join("");
  return st;
}
$("runBtn").onclick = run;
$("findBtn").onclick = runFind;
$("statBtn").onclick = runStat;
run();
</script>
</body>
</html>
