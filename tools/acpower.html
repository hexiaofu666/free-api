<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空调耗电量计算器 - 词海工具箱</title>
<meta name="description" content="空调耗电量计算器：按匹数或输入功率计算每小时、每天、每月耗电量与电费，支持定频与变频估算，附电费单价。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/acpower.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="acpower" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>输入方式</label>
        <select id="mode">
          <option value="pi" selected>按匹数估算</option>
          <option value="watt">按额定功率</option>
        </select>
      </div>
      <div class="fitem"><label>匹数</label>
        <select id="pi">
          <option value="1">1 匹（约 735W）</option>
          <option value="1.5" selected>1.5 匹（约 1100W）</option>
          <option value="2">2 匹（约 1470W）</option>
          <option value="2.5">2.5 匹（约 1838W）</option>
          <option value="3">3 匹（约 2205W）</option>
        </select>
      </div>
      <div class="fitem"><label>功率(W)</label><input type="number" id="watt" value="1100" min="100" max="10000"></div>
      <div class="fitem"><label>每天小时</label><input type="number" id="hours" value="8" min="0.5" max="24" step="0.5"></div>
      <div class="fitem"><label>使用天数</label><input type="number" id="days" value="30" min="1" max="365"></div>
      <div class="fitem"><label>电价(元/度)</label><input type="number" id="price" value="0.6" min="0.01" max="5" step="0.01"></div>
      <div class="fitem"><label>类型</label>
        <select id="type">
          <option value="fixed" selected>定频（按额定功率）</option>
          <option value="inverter">变频（约 60% 功率运行）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始计算</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">计算结果</strong></div>
      <textarea id="res" readonly style="height:190px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于空调耗电量计算器介绍：</h4>
    <ol>
      <li>1 匹空调的输入功率约为 735W，1.5 匹约 1100W，2 匹约 1470W；这里是按常见能效比折算的估算值。</li>
      <li>实际耗电量与能效等级、设定温度、房间面积、室外温度都有关系，本工具给出的是理论参考值。</li>
      <li>变频空调达到设定温度后会降频运行，长期开机的平均功率约为额定功率的 60%，可切换到「变频」模式估算。</li>
      <li>电费单价请以当地电网居民电价为准，一般峰谷电价不同，可取平均价。</li>
      <li>冬季制热通常还带有电辅热，耗电量会明显高于制冷，可把电辅热功率加到输入功率里再算。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var PI_WATT = 735;       // 1 匹约等于 735W 输入功率
var INVERTER_RATE = 0.6; // 变频长期运行平均功率约为额定的 60%

function __xfPiToWatt(pi) { return Math.round(Number(pi) * PI_WATT); }

/* 核心计算：返回耗电量与电费 */
function __xfAcPower(o) {
  o = o || {};
  var watt = Number(o.watt) || 1100;
  var hours = Number(o.hours) || 0;
  var days = Number(o.days) || 0;
  var price = Number(o.price) || 0;
  var rate = o.type === "inverter" ? INVERTER_RATE : 1;
  var effWatt = watt * rate;
  var dayKwh = effWatt * hours / 1000;
  var totalKwh = dayKwh * days;
  var cost = totalKwh * price;
  return {
    effWatt: Math.round(effWatt),
    dayKwh: Math.round(dayKwh * 100) / 100,
    totalKwh: Math.round(totalKwh * 100) / 100,
    cost: Math.round(cost * 100) / 100,
    monthCost: Math.round((totalKwh * price / (days || 1) * 30) * 100) / 100
  };
}
window.__xfAcPower = __xfAcPower;
window.__xfPiToWatt = __xfPiToWatt;

var $ = function (id) { return document.getElementById(id); };
function run() {
  var watt = $("mode").value === "pi" ? __xfPiToWatt($("pi").value) : (parseFloat($("watt").value) || 0);
  var r = __xfAcPower({ watt: watt, hours: $("hours").value, days: $("days").value, price: $("price").value, type: $("type").value });
  var lines = [
    "输入功率：" + watt + " W" + ($("type").value === "inverter" ? "（变频按 60% 计：" + r.effWatt + " W）" : ""),
    "每小时耗电：" + (Math.round(r.effWatt / 10) / 100) + " 度",
    "每天耗电：" + r.dayKwh + " 度（" + $("hours").value + " 小时）",
    $("days").value + " 天合计：" + r.totalKwh + " 度",
    "预计电费：" + r.cost + " 元（单价 " + $("price").value + " 元/度）",
    "折合月均电费：" + r.monthCost + " 元"
  ];
  $("res").value = lines.join("\n");
  $("tip").textContent = "✅ 计算完成";
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
["mode", "pi", "watt", "hours", "days", "price", "type"].forEach(function (id) { $(id).addEventListener("change", run); });
run();
</script>
</body>
</html>
