<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特殊符号大全 - 词海工具箱</title>
<meta name="description" content="按类别收录箭头、数学、货币、序号与标点等常用特殊符号，点击或复制即可用于昵称、文案与文档排版。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/specialchars.html">

<body data-tool="specialchars" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>分类</label>
        <select id="cat"><option value="arrow" selected>箭头符号</option><option value="math">数学符号</option><option value="currency">货币符号</option><option value="number">序号符号</option><option value="check">对勾星号</option><option value="punctuation">标点引号</option></select>
      </div>
      <div class="fitem"><label>每行显示</label><input type="number" id="col" value="20" min="5" max="40"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">刷新符号</button>
      <button class="fbtn brown" id="copyBtn">复制全部</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">符号列表</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:260px;font-size:17px;line-height:1.7;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于特殊符号大全介绍：</h4>
    <ol>
      <li>特殊符号在多数系统字体中都能正常显示，跨端使用前建议先在目标设备确认。</li>
      <li>箭头与序号类符号常用于标题装饰，正文中不宜过多，以免影响搜索引擎识别。</li>
      <li>货币符号除了常见的人民币与美元，还收录了卢布、里拉等小币种符号。</li>
      <li>数学符号中的求和、积分符号可直接用于公式说明，无需依赖公式编辑器。</li>
      <li>复制全部会去掉分隔用的空格，得到连续的符号串，方便一次性粘贴使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var SYMBOL_CATS = {
  arrow: ["←", "→", "↑", "↓", "↔", "↕", "↖", "↗", "↘", "↙", "⇐", "⇒", "⇑", "⇓", "⇔", "⇕", "➔", "➜", "➤", "➜", "▶", "◀", "▲", "▼", "◄", "►", "⬆", "⬇", "⬅", "➡", "⤴", "⤵", "↩", "↪", "⇄", "⇅", "⇆", "⟵", "⟶", "⟷"],
  math: ["＋", "－", "×", "÷", "±", "∓", "＝", "≠", "≈", "≡", "≤", "≥", "＜", "＞", "∞", "∝", "∑", "∏", "√", "∛", "∫", "∬", "∂", "∇", "∈", "∉", "∋", "⊂", "⊃", "⊆", "⊇", "∪", "∩", "∅", "∀", "∃", "∄", "∧", "∨", "¬"],
  currency: ["¥", "$", "€", "£", "₩", "₽", "₺", "₴", "₹", "₫", "฿", "₪", "₡", "₦", "₱", "₲", "₵", "₸", "₼", "₾", "¢", "₠", "₤", "₣", "₧", "₨", "₭", "₮", "₯", "₰", "₱", "₳", "₶", "₷", "₻", "₿", "¤", "₥", "₩", "₪"],
  number: ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫", "⑬", "⑭", "⑮", "⑴", "⑵", "⑶", "⑷", "⑸", "⒈", "⒉", "⒊", "⒋", "⒌", "㊀", "㊁", "㊂", "㊃", "㊄", "Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ", "Ⅴ", "Ⅵ", "Ⅶ", "Ⅷ", "Ⅸ", "Ⅹ"],
  check: ["✓", "✔", "✕", "✖", "✗", "☑", "☒", "☐", "★", "☆", "✦", "✧", "✩", "✪", "✫", "❂", "♦", "♠", "♥", "♣", "※", "§", "¶", "†", "‡", "⌘", "☢", "☣", "⚑", "⚐", "✔", "✿", "❀", "☘", "❖", "◆", "◇", "■", "□", "▪"],
  punctuation: ["“", "”", "‘", "’", "「", "」", "『", "』", "《", "》", "〈", "〉", "【", "】", "〔", "〕", "…", "—", "–", "·", "•", "‰", "℃", "℉", "№", "℡", "™", "©", "®", "°", "′", "″", "¿", "¡", "†", "‡", "¶", "§", "´", "¨"]
};
function __xfSymbolCat(name) { return SYMBOL_CATS.hasOwnProperty(name) ? SYMBOL_CATS[name].slice() : []; }
function __xfSymbols(cat) {
  if (!cat || cat === "all") {
    var out = [];
    Object.keys(SYMBOL_CATS).forEach(function (k) { out = out.concat(SYMBOL_CATS[k]); });
    return out;
  }
  return __xfSymbolCat(cat);
}
function __xfSymbolCount() {
  var n = 0;
  Object.keys(SYMBOL_CATS).forEach(function (k) { n += SYMBOL_CATS[k].length; });
  return n;
}
function __xfSymbolGrid(cat, perRow) {
  var list = __xfSymbols(cat), n = Math.max(1, parseInt(perRow, 10) || 20), lines = [];
  for (var i = 0; i < list.length; i += n) lines.push(list.slice(i, i + n).join(" "));
  return lines.join("\n");
}
window.__xfSymbolCat = __xfSymbolCat;
window.__xfSymbols = __xfSymbols;
window.__xfSymbolCount = __xfSymbolCount;
window.__xfSymbolGrid = __xfSymbolGrid;
function run() {
  var cat = $("cat").value, list = __xfSymbols(cat);
  $("res").value = __xfSymbolGrid(cat, $("col").value);
  $("state").textContent = list.length + " 个";
  $("tip").textContent = "✅ 本类共 " + list.length + " 个符号";
  return list;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value.replace(/\s+/g, "")).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
