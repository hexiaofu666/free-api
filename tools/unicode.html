<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicode在线转中文 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.5"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.5">
<style>
.io-area { width: 100%; height: 160px; resize: vertical; border: 1px solid #eee; border-radius: 4px; padding: 12px; font-size: 13px; line-height: 1.8; outline: none; font-family: Consolas, Monaco, monospace; color: #34495e; }
.io-area:focus { border-color: #d0d0d0; }
.io-label { font-size: 13px; color: #555; margin: 0 0 8px; }
.io-label:first-child { margin-top: 0; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="Unicode 与中文互相转换工具">
<link rel="canonical" href="https://tools.hdemba.cn/tools/unicode.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="unicode" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mdiv">
      <div class="mlf">
        <p class="io-label">输入内容</p>
        <textarea class="io-area" id="input" placeholder='输入中文或 Unicode 编码，如 \u5c0f\u5bcc'></textarea>
        <p class="io-label" style="margin-top:14px;">转换结果</p>
        <textarea class="io-area" id="output" readonly></textarea>
      </div>
      <div class="mlr">
        <button class="fbtn blue" id="toUniBtn">中文 → Unicode</button>
        <button class="fbtn green" id="toCnBtn">Unicode → 中文</button>
        <button class="fbtn plain" id="copyBtn">复制结果</button>
        <button class="fbtn plain" id="clearBtn">清空</button>
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Unicode转中文工具介绍：</h4>
    <p>Unicode 与中文互相转换工具，可将中文字符转为 \uXXXX 形式的 Unicode 编码（如接口返回的乱码数据），也可反向还原为中文。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.5"></script>
<script src="../assets/chrome.js?v=1.5.5"></script>
<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
document.getElementById("toUniBtn").onclick = () => {
  output.value = Array.from(input.value)
    .map(c => c.codePointAt(0) > 127 ? "\\u" + c.codePointAt(0).toString(16).padStart(4, "0") : c)
    .join("");
};
document.getElementById("toCnBtn").onclick = () => {
  try { output.value = JSON.parse('"' + input.value.trim() + '"'); }
  catch (e) { output.value = "❌ 转换失败：不是有效的 Unicode 编码字符串"; }
};
document.getElementById("copyBtn").onclick = () => {
  if (!output.value) return alert("还没有转换结果");
  navigator.clipboard.writeText(output.value).then(() => alert("✅ 已复制到剪贴板"));
};
document.getElementById("clearBtn").onclick = () => { input.value = ""; output.value = ""; };
</script>
</body>
</html>
