<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>椭圆面积计算器 - 词海工具箱</title>
<meta name="description" content="在线椭圆面积计算器，输入长半轴与短半轴算出椭圆面积与近似周长，并标注离心率与扁率。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/ellipsearea.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="ellipsearea" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>长半轴 a</label><input type="text" id="a" value="5"></div>
      <div class="fitem"><label>短半轴 b</label><input type="text" id="b" value="3"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button><button class="fbtn brown" id="swapBtn">交换长短轴</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">椭圆面积 S = πab</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于椭圆面积计算器介绍：</h4>
    <ol>
      <li>椭圆面积公式 S = πab，a 为长半轴、b 为短半轴，两者交换结果不变。</li>
      <li>周长没有初等闭式解，这里采用拉马努金近似公式，精度极高。</li>
      <li>离心率 e 反映椭圆的扁平程度，e = 0 时退化为圆。</li>
      <li>同时给出焦距 c，长轴端点与焦点满足 c² = a² - b²。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfEllipse(a, b, dec) {
  var x = Number(a), y = Number(b);
  if (!isFinite(x) || !isFinite(y) || x <= 0 || y <= 0) return null;
  var A = Math.max(x, y), B = Math.min(x, y);
  var h = Math.pow(A - B, 2) / Math.pow(A + B, 2);
  var peri = Math.PI * (A + B) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h)));
  return {
    a: A, b: B, area: Math.PI * A * B, peri: peri,
    ecc: Math.sqrt(1 - (B * B) / (A * A)), c: Math.sqrt(A * A - B * B),
    text: { area: String(__xfRound(Math.PI * A * B, dec)), peri: String(__xfRound(peri, dec)), ecc: String(__xfRound(Math.sqrt(1 - (B * B) / (A * A)), 6)), c: String(__xfRound(Math.sqrt(A * A - B * B), dec)) }
  };
}
function run() {
  var o = __xfEllipse($("a").value, $("b").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的半轴长度"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>面积 S = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.area + "</b></div>" +
    "<div>近似周长 = " + o.text.peri + "（拉马努金公式）</div>" +
    "<div style='color:#888;'>长半轴 " + o.a + "，短半轴 " + o.b + "，焦距 c = " + o.text.c + "，离心率 e = " + o.text.ecc + "</div>";
  return o;
}
$("runBtn").onclick = run;
$("swapBtn").onclick = function () { var t = $("a").value; $("a").value = $("b").value; $("b").value = t; return run(); };
run();
</script>
</body>
</html>
