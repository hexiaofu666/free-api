<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON在线格式化 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.2"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.2">
<style>
.json-area { width: 100%; height: 200px; resize: vertical; border: 1px solid #eee; border-radius: 4px; padding: 12px; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.7; outline: none; color: #34495e; }
.json-area:focus { border-color: #d0d0d0; }
.btn-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.btn-c { height: 32px; line-height: 32px; padding: 0 18px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; color: #fff; }
.json-out { height: 220px; overflow: auto; background: #f8f9fb; border: 1px solid #eee; border-radius: 4px; padding: 12px; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.7; white-space: pre; color: #34495e; }
.json-out .err { color: #dc2626; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body data-tool="json" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mlf">
      <textarea class="json-area" id="input" placeholder='粘贴 JSON 字符串，如 {"name":"词海","age":18}'></textarea>
      <div class="btn-row">
        <button class="btn-c" style="background:#2196F3" id="fmtBtn">格式化（美化）</button>
        <button class="btn-c" style="background:#FF9800" id="minBtn">压缩</button>
        <button class="btn-c" style="background:#999" id="clearBtn">清空</button>
      </div>
      <div class="json-out" id="output">结果将显示在这里...</div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于JSON格式化工具介绍：</h4>
    <p>JSON 在线解析工具，支持 JSON 字符串的格式化美化、压缩与语法校验，错误时给出提示位置，带语法高亮显示，是前后端开发常用工具。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.2"></script>
<script src="../assets/chrome.js?v=1.5.2"></script>
<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
function highlight(json) {
  return json
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/"([^"]+)":/g, '<span style="color:#1d4ed8">"$1"</span>:')
    .replace(/: ?"([^"]*)"/g, ': <span style="color:#16a34a">"$1"</span>')
    .replace(/: ?(\d+\.?\d*)/g, ': <span style="color:#d97706">$1</span>')
    .replace(/: ?(true|false|null)/g, ': <span style="color:#9333ea">$1</span>');
}
document.getElementById("fmtBtn").onclick = () => {
  try { output.innerHTML = highlight(JSON.stringify(JSON.parse(input.value), null, 2)); }
  catch (e) { output.innerHTML = `<span class="err">❌ JSON 格式错误：${e.message}</span>`; }
};
document.getElementById("minBtn").onclick = () => {
  try { output.innerHTML = highlight(JSON.stringify(JSON.parse(input.value))); }
  catch (e) { output.innerHTML = `<span class="err">❌ JSON 格式错误：${e.message}</span>`; }
};
document.getElementById("clearBtn").onclick = () => {
  input.value = ""; output.textContent = "结果将显示在这里...";
};
</script>
</body>
</html>
