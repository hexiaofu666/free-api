<body data-tool="rgb2hsv" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="cp-box" id="preview">#FF6500</div>
    <div class="crow">
      <div class="side">
        <div class="fin"><label>红 (R:0~255)</label><input id="r" type="number" min="0" max="255" value="255"></div>

      </div>
      <span class="to">TO</span>
      <div class="side">
        <div class="fin"><label>色相 H (0~360)</label><input id="h" type="number" min="0" max="360" step="0.1"></div>
        <div class="fin"><label>饱和度 S (0~100%)</label><input id="s" type="number" min="0" max="100" step="0.1"></div>

  <div class="resttips">
    <h4>关于RGB/HSV相互转换工具介绍：</h4>
    <p>1、HSV 是一种描述颜色的方式，它基于颜色模型中的色调（Hue）、饱和度（Saturation）和明度（Value）。</p>
    <p>2、RGB（Red, Green, Blue）是一种加色模型，它使用红、绿、蓝三种原色光的混合来创建其他所有颜色。</p>
    <p>3、本工具可以通过修改 RGB 或 HSV 颜色的值让它们之间进行相互转换。</p>

<script>
const $ = id => document.getElementById(id);
const clamp = v => Math.min(255, Math.max(0, Math.round(+v || 0)));
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase(); }
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  const s = max ? +(d / max * 100).toFixed(1) : 0;
  const v = +(max * 100).toFixed(1);
  return [h, s, v];
}
function hsv2rgb(h, s, v) {
  s /= 100; v /= 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let rgb;
  if (h < 60) rgb = [c, x, 0];
  else if (h < 120) rgb = [x, c, 0];
  else if (h < 180) rgb = [0, c, x];
  else if (h < 240) rgb = [0, x, c];
  else if (h < 300) rgb = [x, 0, c];
  else rgb = [c, 0, x];
  return rgb.map(u => Math.round((u + m) * 255));
}
function paint(r, g, b) {
  const hex = toHex(r, g, b);
  $("preview").style.background = hex;
  $("preview").textContent = hex;
}
function fromRgb() {
  const r = clamp($("r").value), g = clamp($("g").value), b = clamp($("b").value);
  const [h, s, v] = rgb2hsv(r, g, b);
  $("h").value = h; $("s").value = s; $("v").value = v;
  paint(r, g, b);
}
function fromHsv() {
  let h = +$("h").value || 0, s = Math.min(100, Math.max(0, +$("s").value || 0)), v = Math.min(100, Math.max(0, +$("v").value || 0));
  h = ((h % 360) + 360) % 360;
  const [r, g, b] = hsv2rgb(h, s, v);
  $("r").value = r; $("g").value = g; $("b").value = b;
  paint(r, g, b);
}
["r", "g", "b"].forEach(id => $(id).addEventListener("input", fromRgb));
["h", "s", "v"].forEach(id => $(id).addEventListener("input", fromHsv));
fromRgb();
</script>
