<body data-tool="bomremover" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>粘贴十六进制字节（可含空格换行）</label>
        <textarea id="hexin" style="height:90px;" placeholder="EF BB BF 3C 21 44 4F 43 ..."></textarea>
      </div>
      <div class="fitem"><label>或上传文件检测</label><input type="file" id="file"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">检测 BOM</button>
      <button class="fbtn brown" id="stripBtn">移除 BOM 并输出十六进制</button>
      <button class="fbtn gray" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">检测结果</strong></div>
      <div id="res" style="padding:0 2px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于 BOM 头批量检测移除工具介绍：</h4>
    <ol>
      <li>BOM（Byte Order Mark）是文件开头的隐藏字节标记，用来标识编码。UTF-8 的 BOM 是 EF BB BF。</li>
      <li>很多程序（PHP、Shell 脚本、JSON 解析）遇到 BOM 会报错或出现乱码，网页中也可能导致首屏多出空白。</li>
      <li>本工具可粘贴十六进制字节检测，也可直接上传文件，识别 UTF-8 / UTF-16 BE / UTF-16 LE / UTF-32 的 BOM。</li>
      <li>点击「移除 BOM」会输出去掉标记后的十六进制，便于对照确认。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.7.0"></script>
<script src="../assets/chrome.js?v=1.7.0"></script>
<script>
const BOMS = [
  { bytes: [0xEF, 0xBB, 0xBF], enc: "UTF-8", name: "UTF-8 BOM" },
  { bytes: [0xFE, 0xFF], enc: "UTF-16BE", name: "UTF-16 大端 BOM" },
  { bytes: [0xFF, 0xFE, 0x00, 0x00], enc: "UTF-32LE", name: "UTF-32 小端 BOM" },
  { bytes: [0x00, 0x00, 0xFE, 0xFF], enc: "UTF-32BE", name: "UTF-32 大端 BOM" },
  { bytes: [0xFF, 0xFE], enc: "UTF-16LE", name: "UTF-16 小端 BOM" }
];

/* 十六进制字符串 -> 字节数组 */
function __xfHexToBytes(s) {
  const h = String(s || "").replace(/[^0-9a-fA-F]/g, "");
  if (h.length % 2 !== 0) return { error: "十六进制字符个数为奇数，无法按字节解析" };
  const out = [];
  for (let i = 0; i < h.length; i += 2) out.push(parseInt(h.substr(i, 2), 16));
  return { bytes: out };
}

/* 检测 BOM */
function __xfBomDetect(bytes) {
  if (!bytes || !bytes.length) return { hasBom: false };
  for (const b of BOMS) {
    if (bytes.length >= b.bytes.length && b.bytes.every((v, i) => bytes[i] === v)) {
      return { hasBom: true, enc: b.enc, name: b.name, sig: b.bytes, len: b.bytes.length };
    }
  }
  return { hasBom: false, first: bytes.slice(0, 4).map(x => x.toString(16).padStart(2, "0").toUpperCase()) };
}

/* 移除 BOM */
function __xfBomStrip(bytes) {
  const d = __xfBomDetect(bytes);
  if (!d.hasBom) return { stripped: false, bytes: bytes.slice() };
  return { stripped: true, removed: d.sig.length, enc: d.enc, bytes: bytes.slice(d.sig.length) };
}

function __xfBytesToHex(bytes) {
  return bytes.map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
}

window.__xfHexToBytes = __xfHexToBytes;
window.__xfBomDetect = __xfBomDetect;
window.__xfBomStrip = __xfBomStrip;
window.__xfBytesToHex = __xfBytesToHex;

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
let curBytes = null;

function render(html, tip) { $("res").innerHTML = html; $("tip").textContent = tip; }

function run() {
  const p = __xfHexToBytes($("hexin").value);
  if (p.error) { render('<p style="color:#e54d42;font-size:13px;">' + esc(p.error) + "</p>", "检测失败"); return; }
  if (!p.bytes.length) { render('<p style="color:#999;font-size:13px;">请输入十六进制字节，或上传文件。</p>', "等待输入"); curBytes = null; return; }
  curBytes = p.bytes;
  const d = __xfBomDetect(p.bytes);
  if (d.hasBom) {
    render('<div class="bom-hit"><b>检测到 BOM：' + esc(d.name) + '</b><div>编码：' + esc(d.enc) + '</div><div>字节：<code>' + __xfBytesToHex(d.sig) + "</code>（共 " + d.len + " 字节）</div></div>", "检测结果");
  } else {
    render('<div class="bom-none">未检测到 BOM。<br><span>开头字节：<code>' + esc(d.first.join(" ")) + "</code></span></div>", "检测结果");
  }
}

function strip() {
  let bytes = curBytes;
  if (!bytes) {
    const p = __xfHexToBytes($("hexin").value);
    if (p.error) { render('<p style="color:#e54d42;font-size:13px;">' + esc(p.error) + "</p>", "处理失败"); return; }
    bytes = p.bytes;
  }
  if (!bytes || !bytes.length) { render('<p style="color:#999;font-size:13px;">请先输入或上传内容。</p>', "等待输入"); return; }
  const r = __xfBomStrip(bytes);
  if (!r.stripped) { render('<div class="bom-none">未检测到 BOM，无需移除。</div>', "移除结果"); return; }
  render('<div class="bom-hit"><b>已移除 ' + esc(r.enc) + ' BOM（' + r.removed + ' 字节）</b>' +
    '<div class="bom-hex">移除后十六进制：<br><code>' + esc(__xfBytesToHex(r.bytes).slice(0, 400)) + (r.bytes.length * 3 > 400 ? " …" : "") + "</code></div></div>", "移除结果");
}

$("runBtn").onclick = run;
$("stripBtn").onclick = strip;
$("clrBtn").onclick = () => { $("hexin").value = ""; $("file").value = ""; curBytes = null; render('<p style="color:#999;font-size:13px;">请输入十六进制字节，或上传文件。</p>', "等待输入"); };
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const bytes = Array.prototype.slice.call(new Uint8Array(reader.result));
    curBytes = bytes;
    $("hexin").value = __xfBytesToHex(bytes.slice(0, 32));
    const d = __xfBomDetect(bytes);
    if (d.hasBom) render('<div class="bom-hit"><b>文件 ' + esc(f.name) + " 检测到 " + esc(d.name) + '</b><div>编码：' + esc(d.enc) + '</div><div>字节：<code>' + __xfBytesToHex(d.sig) + "</code></div></div>", "文件检测结果");
    else render('<div class="bom-none">文件 ' + esc(f.name) + " 未检测到 BOM。<br><span>开头字节：<code>" + esc(d.first.join(" ")) + "</code></span></div>", "文件检测结果");
  };
  reader.readAsArrayBuffer(f.slice(0, 64));
};
$("hexin").addEventListener("input", run);
render('<p style="color:#999;font-size:13px;">请输入十六进制字节，或上传文件。</p>', "等待输入");
</script>
<style>
.bom-hit{border:1px solid #ffe0c7;background:#fff8f2;border-radius:8px;padding:12px 14px;font-size:13px;color:#333;line-height:1.9;max-width:720px;}
.bom-hit b{color:#ff6500;}
.bom-hit code{font-family:Consolas,Monaco,monospace;color:#1f6feb;word-break:break-all;}
.bom-hex{margin-top:6px;}
.bom-none{font-size:13px;color:#666;line-height:1.9;}
.bom-none code{font-family:Consolas,Monaco,monospace;color:#1f6feb;}
html.dark .bom-hit{background:#2c2620;border-color:#4a3a28;color:#ddd;}
html.dark .bom-none{color:#aaa;}
</style>
</body>
</html>
