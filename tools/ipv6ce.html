    <h4>关于 IPv6 地址压缩展开工具介绍：</h4>
    <ol>
      <li>IPv6 地址由 8 组 4 位十六进制数组成，用冒号分隔；连续的全零组可以用 :: 压缩表示。</li>
      <li>压缩（规范化）会把 2001:0db8:0000:0000:0000:0000:0000:0001 缩写成 2001:db8::1。</li>
      <li>展开则把 :: 还原为完整的 8 组，并补齐每组 4 位，便于逐段比对与配置。</li>
      <li>本工具还会给出带嵌入 IPv4 的写法与二进制位串，方便教学与排错。</li>

<script>
/* 解析 IPv6 -> 8 组数字（每组 0-65535），非法返回 null */
function __xfV6Parse(addr) {
  let s = String(addr == null ? "" : addr).trim();
  if (!s) return null;
  if (s.startsWith("[") && s.endsWith("]")) s = s.slice(1, -1);
  s = s.split("%")[0];
  if (s.indexOf("::") !== s.lastIndexOf("::")) return null;
  let head = [], tail = [], dbl = false;
  if (s.indexOf("::") >= 0) {
    dbl = true;
    const p = s.split("::");
    head = p[0] ? p[0].split(":") : [];
    tail = p[1] ? p[1].split(":") : [];
  } else {
    head = s.split(":");
  }
  const all = head.concat(tail);
  if (all.length > 8) return null;
  if (!dbl && all.length !== 8) return null;
  const groups = [];
  for (let i = 0; i < all.length; i++) {
    const g = all[i];
    if (g === "") return null;
    /* 末尾嵌入的 IPv4 写法（如 ::ffff:192.168.1.1）折算为 2 组 */
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(g)) {
      const o = g.split(".").map(Number);
      if (i !== all.length - 1 || o.some(n => n > 255)) return null;
      groups.push((o[0] << 8) | o[1], (o[2] << 8) | o[3]);
      continue;
    }
    if (!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
    groups.push(parseInt(g, 16));
  }
  const fill = 8 - groups.length;
  if (dbl && fill < 1) return null;
  if (!dbl && fill !== 0) return null;
  const full = dbl ? groups.slice(0, head.length).concat(new Array(fill).fill(0)).concat(groups.slice(head.length)) : groups;
  return full.length === 8 ? full : null;
}

/* 压缩：8 组 -> 规范 :: 形式 */
function __xfV6Compress(addr) {
  let g = Array.isArray(addr) ? addr.slice() : __xfV6Parse(addr);
  if (!g) return null;
  const hex = g.map(n => n.toString(16));
  let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
  for (let i = 0; i < 8; i++) {
    if (g[i] === 0) { if (curStart < 0) curStart = i; curLen++; if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; } }
    else { curStart = -1; curLen = 0; }
  }
  if (bestLen < 2) return hex.join(":");
  const left = hex.slice(0, bestStart).join(":");
  const right = hex.slice(bestStart + bestLen).join(":");
  if (!left && !right) return "::";
  if (!left) return "::" + right;
  if (!right) return left + "::";
  return left + "::" + right;
}

/* 展开：-> 8 组各 4 位的完整形式 */
function __xfV6Expand(addr) {
  const g = Array.isArray(addr) ? addr : __xfV6Parse(addr);
  if (!g) return null;
  return g.map(n => n.toString(16).padStart(4, "0")).join(":");
}

/* 带嵌入 IPv4 的写法 */
function __xfV6Mapped(addr) {
  const g = Array.isArray(addr) ? addr : __xfV6Parse(addr);
  if (!g) return null;
  const v4 = g.slice(6).map(n => [n >> 8, n & 255]).reduce((a, b) => a.concat(b), []).join(".");
  const first6Zero = g.slice(0, 6).every(n => n === 0);
  const mapped = g.slice(0, 5).every(n => n === 0) && g[5] === 0xffff;
  if (first6Zero) return "::" + v4;
  if (mapped) return "::ffff:" + v4;
  return null;
}

/* 二进制位串 */
function __xfV6Bin(addr) {
  const g = Array.isArray(addr) ? addr : __xfV6Parse(addr);
  if (!g) return null;
  return g.map(n => n.toString(2).padStart(16, "0")).join(" ");
}

window.__xfV6Parse = __xfV6Parse;
window.__xfV6Compress = __xfV6Compress;
window.__xfV6Expand = __xfV6Expand;
window.__xfV6Mapped = __xfV6Mapped;
window.__xfV6Bin = __xfV6Bin;

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function run() {
  const v = $("ip").value.trim();
  const g = __xfV6Parse(v);
  if (!g) {
    $("res").innerHTML = '<p style="color:#e54d42;font-size:13px;padding:6px 0;">不是合法的 IPv6 地址，请检查冒号与分组是否完整（应为 8 组十六进制）。</p>';
    $("tip").textContent = "解析失败";
    return;
  }
  const rows = [
    ["压缩形式（规范）", __xfV6Compress(g)],
    ["完整展开（8 组）", __xfV6Expand(g)],
    ["分组十进制", g.join(" . ")],
    ["二进制位串", __xfV6Bin(g)]
  ];
  const mp = __xfV6Mapped(g);
  if (mp) rows.push(["嵌入 IPv4 写法", mp]);
  const maxIdx = g.reduce((acc, n, i) => n > g[acc] ? i : acc, 0);
  rows.push(["最大值分组位置", "第 " + (maxIdx + 1) + " 组 = 0x" + g[maxIdx].toString(16)]);
  $("tip").textContent = "地址解析成功";
  $("res").innerHTML = '<div class="v6rows">' + rows.map(([n, val]) =>
    '<div class="v6row"><div class="v6lab"><b>' + n + "</b></div>" +
    '<div class="v6val"><code>' + esc(val) + '</code><button class="v6cp" data-v="' + esc(val) + '">复制</button></div></div>'
  ).join("") + "</div>";
  Array.prototype.forEach.call($("res").querySelectorAll(".v6cp"), btn => {
    btn.onclick = () => navigator.clipboard.writeText(btn.getAttribute("data-v")).then(() => { btn.textContent = "已复制"; setTimeout(() => btn.textContent = "复制", 1200); });
  });
}

$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("ip").value = "2001:0db8:0000:0000:0000:0000:0000:0001"; run(); };
$("ip").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("ip").value = "2001:db8::1";
run();
</script>
