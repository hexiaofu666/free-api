<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火星文转换工具 - 词海工具箱</title>
<meta name="description" content="在线火星文转换工具，把普通文字转为火星文风格，支持一键还原，内置常用字符对照表。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="huoxingwen" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>原文本</label><textarea id="src" rows="5">你好，我喜欢你，这是一个测试。</textarea></div>
      <div class="fitem"><label>转换方向</label>
        <select id="mode"><option value="to">普通文字 → 火星文</option><option value="back">火星文 → 普通文字</option></select>
      </div>
      <div class="fitem"><label>装饰符号</label>
        <select id="deco"><option value="on">添加装饰符号</option><option value="off">不添加</option></select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">转换</button><button class="fbtn plain" id="revBtn">反向转换</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">转换结果</strong></div>
      <textarea id="res" rows="6" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于火星文转换工具介绍：</h4>
    <ol>
      <li>火星文是一种网络亚文化文字风格，通过形近字与符号替换普通文字。</li>
      <li>内置常用字符对照表，覆盖常见人称、语气词与高频汉字。</li>
      <li>反向转换可以把火星文还原为普通文字，仅对表中字符有效。</li>
      <li>装饰符号会在文本中插入 ﹏ ゞ 等符号，关闭后只做字符替换。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var HUO_MAP = {
  "你": "伱", "我": "涐", "他": "彵", "的": "の", "了": "孒", "是": "湜", "不": "卜",
  "爱": "嬡", "好": "恏", "很": "哏", "会": "浍", "说": "説", "看": "阜", "想": "缃",
  "们": "扪", "在": "茬", "有": "洧", "没": "莈", "吗": "嬤", "呢": "呢", "啊": "錒",
  "一": "①", "二": "②", "三": "③", "四": "④", "五": "⑤", "六": "⑥", "七": "⑦",
  "八": "⑧", "九": "⑨", "十": "⑩", "个": "個", "这": "適", "那": "哪", "什": "甚",
  "么": "庅", "过": "過", "来": "唻", "去": "厾", "天": "兲", "人": "亾", "心": "吢",
  "里": "裡", "后": "後", "就": "噈", "还": "還", "要": "婹", "给": "給", "做": "莋",
  "时": "溡", "候": "糇", "觉": "覺", "得": "嘚", "起": "起", "开": "閞", "关": "関",
  "点": "點", "多": "哆", "少": "仯", "大": "汏", "小": "尐", "真": "嫃", "对": "対"
};
var HUO_DECO = ["﹏", "ゞ", "〆", "゛", "ツ", "シ"];
function __xfToHuo(text) {
  var s = String(text), out = "";
  for (var i = 0; i < s.length; i++) { var c = s.charAt(i); out += HUO_MAP[c] || c; }
  return out;
}
function __xfHuoToText(text) {
  var s = String(text), out = "";
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i), hit = null;
    for (var k in HUO_MAP) { if (HUO_MAP[k] === c) { hit = k; break; } }
    out += hit || c;
  }
  return out;
}
function __xfHuoDecorate(text, seed) {
  var s = String(text), out = "", n = seed === undefined ? 3 : seed;
  for (var i = 0; i < s.length; i++) { out += s.charAt(i); if ((i + 1) % n === 0) out += HUO_DECO[i % HUO_DECO.length]; }
  return out;
}
function __xfHuoMapSize() { var n = 0; for (var k in HUO_MAP) n++; return n; }
function run() {
  var mode = $("mode").value;
  var o = mode === "back" ? __xfHuoToText($("src").value) : __xfToHuo($("src").value);
  if (mode === "to" && $("deco").value === "on") o = __xfHuoDecorate(o, 4);
  $("res").value = o;
  $("tip").textContent = "✅ 转换完成（对照表 " + __xfHuoMapSize() + " 组）";
  return o;
}
$("runBtn").onclick = run;
$("revBtn").onclick = function () { $("mode").value = "back"; return run(); };
run();
</script>
</body>
