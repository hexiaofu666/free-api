<body data-tool="beaufort" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vin"><textarea id="input" placeholder="输入要加密/解密的内容...."></textarea></div>
    <div class="vsetup">
      <div class="fitem"><label>密钥</label><input type="text" id="key" placeholder="仅字母，如 KEY"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="encBtn">加密</button>
      <button class="fbtn blue" id="decBtn">解密</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>转换结果</strong><span id="copyBtn">复制</span></div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于博福特密码介绍：</h4>
    <ol>
      <li>博福特密码（Beaufort Cipher）由弗朗西斯·博福特爵士创造，是维吉尼亚密码的变体。</li>
      <li>与维吉尼亚的区别：加密公式为 C = (K - P) mod 26，即从密钥字母开始反向计数明文字母。</li>
      <li>它是自反密码：加密和解密使用同一公式、同一密钥，加密一次再加密一次即还原。</li>
      <li>密钥仅接受字母（不区分大小写），循环使用；文本中的数字、汉字、标点、空格保持不变。</li>
      <li>同样可用卡西斯基试验和频率分析攻破，安全性有限，适合教学与谜题。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.4"></script>
<script src="../assets/chrome.js?v=1.5.4"></script>
<script>
const $=id=>document.getElementById(id);
function beau(s, key){
  const k = key.toUpperCase().replace(/[^A-Z]/g, "");
  if (!k) return null;
  let ki = 0;
  return [...s].map(c => {
    const cp = c.codePointAt(0);
    const kv = k.charCodeAt(ki % k.length) - 65;
    if (cp >= 65 && cp <= 90){ const v = (kv - (cp - 65) + 26) % 26; ki++; return String.fromCharCode(v + 65); }
    if (cp >= 97 && cp <= 122){ const v = (kv - (cp - 97) + 26) % 26; ki++; return String.fromCharCode(v + 97); }
    return c;
  }).join("");
}
function show(res){ $("output").value = res; $("outBox").classList.add("on"); }
function run(){
  const s = $("input").value;
  if (!s) return alert("请输入内容");
  const r = beau(s, $("key").value);
  show(r === null ? "❌ 密钥无效：请输入至少一个字母" : r);
}
$("encBtn").onclick = run;
$("decBtn").onclick = run;
$("clearBtn").onclick = () => { $("input").value=""; $("output").value=""; $("outBox").classList.remove("on"); };
$("copyBtn").onclick = () => { $("output").select(); document.execCommand("copy"); };
</script>
</body>
