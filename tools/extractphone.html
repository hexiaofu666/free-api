<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线手机号码提取工具 - 词海工具箱</title>
<meta name="description" content="在线手机号码提取工具，从文本中批量提取中国大陆手机号与固定电话，自动去重并标注号段。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/extractphone.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="extractphone" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>原文本</label><textarea id="src" rows="7">张三 13812345678，李四 15987654321。
座机 010-88886666，王五 186 0000 1111。乱码 12345678901</textarea></div>
      <div class="fitem"><label>提取类型</label>
        <select id="mode"><option value="mobile">仅手机号</option><option value="all">手机号 + 固定电话</option></select>
      </div>
      <div class="fitem"><label>去除分隔符</label>
        <select id="clean"><option value="yes">去除空格与横杠</option><option value="no">保留原格式</option></select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">提取号码</button><button class="fbtn plain" id="demoBtn">填入示例</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">提取结果</strong></div>
      <textarea id="res" rows="7" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于在线手机号码提取工具介绍：</h4>
    <ol>
      <li>手机号按中国大陆 1 开头的 11 位号码识别，号段第二位限 3~9。</li>
      <li>固定电话支持 0 开头的区号格式，含 3 位或 4 位区号与可选中横杠。</li>
      <li>去除分隔符后 186 0000 1111 会归一为 18600001111，便于统一处理。</li>
      <li>去重区分手机号与座机，重复号码只保留首次出现。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfExtractMobiles(text) {
  var re = /1[3-9]\d[\s\-]?\d{4}[\s\-]?\d{4}/g;
  return String(text).match(re) || [];
}
function __xfExtractTels(text) {
  var re = /0\d{2,3}[\s\-]?\d{7,8}/g;
  return String(text).match(re) || [];
}
function __xfCleanPhone(s) { return String(s).replace(/[\s\-]/g, ""); }
function __xfIsValidMobile(s) { return /^1[3-9]\d{9}$/.test(__xfCleanPhone(s)); }
function __xfExtractPhones(text, mode, clean) {
  var out = [], seen = {};
  var m1 = __xfExtractMobiles(text).filter(function (x) { return __xfIsValidMobile(x); });
  m1.forEach(function (x) { out.push(clean === "no" ? x : __xfCleanPhone(x)); });
  if (mode === "all") {
    __xfExtractTels(text).forEach(function (x) { out.push(clean === "no" ? x : __xfCleanPhone(x)); });
  }
  if (clean !== "no") {
    var uniq = [];
    out.forEach(function (x) { if (!seen[x]) { seen[x] = 1; uniq.push(x); } });
    out = uniq;
  }
  return { list: out, count: out.length, mobile: m1.length };
}
function run() {
  var o = __xfExtractPhones($("src").value, $("mode").value, $("clean").value);
  $("res").value = o.list.join("\n");
  $("tip").textContent = o.count ? "✅ 提取到 " + o.count + " 个号码" : "⚠️ 未发现符合规则的号码";
  return o;
}
$("runBtn").onclick = run;
$("demoBtn").onclick = function () {
  $("src").value = "张三 13812345678，李四 159 8765 4321。\n座机 010-88886666\n重复 13812345678";
  return run();
};
run();
</script>
</body>
</html>
