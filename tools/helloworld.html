<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>搜索语言</label><input type="text" id="kw" placeholder="如：python、java、rust、中文名也行"></div>
      <div class="fitem"><label>语言</label><select id="lang"></select></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查看代码</button>
      <button class="fbtn gray" id="allBtn">全部语言清单</button>
      <button class="fbtn brown" id="copyBtn">复制代码</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">示例代码</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:220px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Hello World代码大全介绍：</h4>
    <ol>
      <li>收录 60 种编程语言的 Hello World 示例，覆盖编译型、解释型、函数式、逻辑式与硬件描述语言。</li>
      <li>可以在搜索框输入英文名（python）或中文名（脚本、网页）来快速过滤语言列表。</li>
      <li>Hello World 是学习新语言时验证环境配置是否正确的第一个程序。</li>
      <li>部分语言（如 Java、C#）需要先安装运行时并注意文件名与类名一致，例如 Java 的 HelloWorld.java。</li>
      <li>示例代码可直接复制使用，注意不同语言的换行与缩进规范。</li>
    </ol>
  </div>

<script>
var LANGS = [

  ["F#", "F Sharp", "printfn \"Hello, World!\""],
  ["Fortran", "Fortran", "program hello\n    print *, 'Hello, World!'\nend program hello"],
  ["Go", "Golang", "package main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello, World!\")\n}"],

  ["Java", "Java", "public class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}"],
  ["JavaScript", "JS（浏览器）", "document.write('Hello, World!');\n// 或在控制台：console.log('Hello, World!');"],

  ["Brainfuck", "Brainfuck", "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++."],
  ["Crystal", "Crystal", "puts \"Hello, World!\""],
  ["GDScript", "Godot 脚本", "extends Node\n\nfunc _ready():\n    print(\"Hello, World!\")"],
  ["Hack", "Hack", "<?hh\necho \"Hello, World!\";"],
  ["Idris", "Idris", "main : IO ()\nmain = putStrLn \"Hello, World!\""],

];
function __xfHelloList() { return LANGS.map(function (l) { return { lang: l[0], cn: l[1], code: l[2] }; }); }
function __xfHelloSearch(kw) {
  var k = String(kw || "").trim().toLowerCase();
  var all = __xfHelloList();
  if (!k) return all;
  return all.filter(function (x) { return x.lang.toLowerCase().indexOf(k) >= 0 || x.cn.indexOf(k) >= 0; });
}
window.__xfHelloList = __xfHelloList;
window.__xfHelloSearch = __xfHelloSearch;

var $ = function (id) { return document.getElementById(id); };
function fillSelect(kw) {
  var list = __xfHelloSearch(kw);
  $("lang").innerHTML = list.map(function (x) { return "<option value='" + x.lang + "'>" + x.lang + "（" + x.cn + "）</option>"; }).join("");
  return list;
}
function show() {
  var l = __xfHelloList().filter(function (x) { return x.lang === $("lang").value; })[0];
  if (!l) { $("res").value = "请选择语言"; return; }
  $("res").value = "// " + l.lang + "（" + l.cn + "）\n\n" + l.code;
  $("tip").textContent = "✅ " + l.lang + " Hello World";
  $("state").textContent = l.code.split("\n").length + " 行";
}
function all() {
  $("res").value = __xfHelloList().map(function (x, i) { return (i + 1) + ". " + x.lang + "（" + x.cn + "）"; }).join("\n") + "\n\n共 " + LANGS.length + " 种语言，可在上方下拉框中选择查看代码。";
  $("tip").textContent = "全部语言清单";
  $("state").textContent = LANGS.length + " 种";
}
$("runBtn").onclick = show;
$("allBtn").onclick = all;
$("lang").onchange = show;
$("kw").addEventListener("input", function () { fillSelect(this.value); show(); });
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无内容"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
fillSelect("");
show();
</script>
