<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异或加密在线加解密 - 词海工具箱</title>

<script src="../assets/theme.js?v=1.5.4"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.4">
<script>

var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<meta name="description" content="XOR对称加密，密钥循环复用，输出Base64，支持中文">
<link rel="canonical" href="https://tools.hdemba.cn/tools/xor.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="xor" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vin"><textarea id="input" placeholder="加密：输入明文；解密：粘贴 Base64 密文...."></textarea></div>
    <div class="vsetup">
      <div class="fitem"><label>密钥</label><input type="text" id="key" placeholder="任意文本密钥"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="encBtn">加密（→Base64）</button>
      <button class="fbtn blue" id="decBtn">解密（Base64→）</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>转换结果</strong><span id="copyBtn">复制</span></div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于异或加密介绍：</h4>
    <ol>
      <li>XOR（异或）加密是最简单的对称加密：明文字节与密钥字节逐位异或，再异或一次即可还原。</li>
      <li>密钥长度短于文本时自动循环复用，这是 XOR 加密最常见的实现方式。</li>
      <li>所有文本（含中文、emoji）均按 UTF-8 编码转为字节参与运算；加密结果输出 Base64，方便在网页、JSON 中传输。</li>
      <li>解密时使用相同密钥；密钥错误或密文损坏会导致还原出乱码或提示解码失败。</li>
      <li>适合学习原理、临时伪装文本；正式场景请使用 AES 等标准算法。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.4"></script>
<script src="../assets/chrome.js?v=1.5.4"></script>
<script>
const $=id=>document.getElementById(id);
function xorBytes(bytes, keyBytes){
  return bytes.map((b, i) => b ^ keyBytes[i % keyBytes.length]);
}
function show(res){ $("output").value = res; $("outBox").classList.add("on"); }
function getKey(){
  const k = $("key").value;
  if (!k) { alert("请输入密钥"); return null; }
  return Array.from(new TextEncoder().encode(k));
}
$("encBtn").onclick = () => {
  const s = $("input").value;
  if (!s) return alert("请输入内容");
  const kb = getKey(); if (!kb) return;
  const out = xorBytes(Array.from(new TextEncoder().encode(s)), kb);
  let bin = "";
  out.forEach(b => bin += String.fromCharCode(b));
  show(btoa(bin));
};
$("decBtn").onclick = () => {
  const s = $("input").value.trim();
  if (!s) return alert("请输入密文");
  const kb = getKey(); if (!kb) return;
  let bytes;
  try { bytes = Array.from(atob(s), c => c.charCodeAt(0)); }
  catch (e) { return alert("Base64 格式无效，请检查密文"); }
  const dec = new TextDecoder("utf-8", { fatal: true });
  try { show(dec.decode(new Uint8Array(xorBytes(bytes, kb)))); }
  catch (e) { alert("解密失败：密钥错误或密文损坏，无法还原为 UTF-8 文本"); }
};
$("clearBtn").onclick = () => { $("input").value=""; $("output").value=""; $("outBox").classList.remove("on"); };
$("copyBtn").onclick = () => { $("output").select(); document.execCommand("copy"); };
</script>
</body>
</html>
