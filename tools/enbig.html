<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文大小写转换工具 - 词海工具箱</title>
<meta name="description" content="在线英文大小写转换工具，支持全大写、全小写、首字母大写、词首大写、大小写交替与驼峰命名转换。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/enbig.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="enbig" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>原文本</label><textarea id="src" rows="5">hello world, this is a TEST string.</textarea></div>
      <div class="fitem"><label>转换方式</label>
        <select id="mode">
          <option value="upper">全部大写 UPPER</option>
          <option value="lower">全部小写 lower</option>
          <option value="sentence">句首字母大写</option>
          <option value="title">每个单词首字母大写</option>
          <option value="toggle">大小写互换</option>
          <option value="alternate">大小写交替</option>
          <option value="camel">小驼峰 camelCase</option>
          <option value="pascal">大驼峰 PascalCase</option>
          <option value="snake">下划线 snake_case</option>
          <option value="kebab">短横线 kebab-case</option>
        </select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">转换</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">转换结果</strong></div>
      <textarea id="res" rows="6" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于英文大小写转换工具介绍：</h4>
    <ol>
      <li>句首字母大写会同时把每个句号、问号、感叹号后的首字母转为大写。</li>
      <li>大小写互换把大写变小写、小写变大写，适合快速调整文本格式。</li>
      <li>命名转换会把文本切分为单词后按驼峰、下划线或短横线规则重组。</li>
      <li>命名转换会自动忽略标点与多余空格，适合把标题转为变量名。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfToWords(text) {
  return String(text).replace(/[^A-Za-z0-9]+/g, " ").trim().split(/\s+/).filter(function (x) { return x !== ""; });
}
function __xfCap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s; }
function __xfConvertCase(text, mode) {
  var s = String(text);
  if (mode === "upper") return s.toUpperCase();
  if (mode === "lower") return s.toLowerCase();
  if (mode === "sentence") return s.toLowerCase().replace(/(^\s*[a-z])|([.?!]\s+[a-z])/g, function (m) { return m.toUpperCase(); });
  if (mode === "title") return s.replace(/[A-Za-z]+/g, function (w) { return __xfCap(w); });
  if (mode === "toggle") {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      out += c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase();
    }
    return out;
  }
  if (mode === "alternate") {
    var out2 = "", k = 0;
    for (var j = 0; j < s.length; j++) {
      var ch = s.charAt(j);
      if (!/[A-Za-z]/.test(ch)) { out2 += ch; continue; }
      out2 += (k++ % 2 === 0) ? ch.toUpperCase() : ch.toLowerCase();
    }
    return out2;
  }
  var words = __xfToWords(s).map(function (w) { return w.toLowerCase(); });
  if (mode === "camel") return words.map(function (w, i) { return i === 0 ? w : __xfCap(w); }).join("");
  if (mode === "pascal") return words.map(__xfCap).join("");
  if (mode === "snake") return words.join("_");
  if (mode === "kebab") return words.join("-");
  return s;
}
function run() {
  var o = __xfConvertCase($("src").value, $("mode").value);
  $("res").value = o;
  $("tip").textContent = "✅ 转换完成";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
