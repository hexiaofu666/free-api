<script>
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;">');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" style="color:#ff6500;">$1</a>');
  s=s.replace(/\*\*\*([^*]+)\*\*\*/g,"<strong><em>$1</em></strong>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  return s;
}
function render(src){
  const lines=src.split("\n");
  let html="",i=0,inUl=false,inOl=false;
  const closeUl=()=>{if(inUl){html+="</ul>";inUl=false;}};
  const closeOl=()=>{if(inOl){html+="</ol>";inOl=false;}};
  const closeAll=()=>{closeUl();closeOl();};
  while(i<lines.length){
    let L=lines[i];
    /* 代码块 */
    if(/^```/.test(L)){
      closeAll();
      const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      html+=`<pre><code>${esc(buf.join("\n"))}</code></pre>`;
      continue;
    }
    /* 标题 */
    const h=L.match(/^(#{1,6})\s+(.*)/);
    if(h){
      closeAll();
      const lv=h[1].length;
      html+=`<h${lv}>${inline(h[2])}</h${lv}>`;i++;continue;
    }
    /* 分割线 */
    if(/^(\s*)(-{3,}|\*{3,})\s*$/.test(L)){closeAll();html+="<hr>";i++;continue;}
    /* 引用 */
    if(/^>\s?/.test(L)){
      closeAll();
      const buf=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,""));i++;}
      html+=`<blockquote>${buf.map(b=>inline(b)).join("<br>")}</blockquote>`;continue;
    }
    /* 表格 */
    if(i+1<lines.length&&/\|/.test(L)&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])&&/-/.test(lines[i+1])){
      closeAll();
      const parseRow=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const head=parseRow(L);i+=2;
      let rows=[];
      while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()){rows.push(parseRow(lines[i]));i++;}
      html+="<table><thead><tr>"+head.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>"+
        rows.map(r=>"<tr>"+r.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("")+"</tbody></table>";
      continue;
    }
    /* 无序列表 */
    if(/^\s*[-*+]\s+/.test(L)){
      closeOl();
      if(!inUl){html+="<ul>";inUl=true;}
      html+=`<li>${inline(L.replace(/^\s*[-*+]\s+/,""))}</li>`;i++;continue;
    }
    /* 有序列表 */
    if(/^\s*\d+\.\s+/.test(L)){
      closeUl();
      if(!inOl){html+="<ol>";inOl=true;}
      html+=`<li>${inline(L.replace(/^\s*\d+\.\s+/,""))}</li>`;i++;continue;
    }
    /* 空行 */
    if(!L.trim()){closeAll();i++;continue;}
    /* 普通段落 */
    closeAll();
    html+=`<p>${inline(L)}</p>`;i++;
  }
  closeAll();
  return html;
}
let t=null;
$("src").addEventListener("input",()=>{
  clearTimeout(t);
  t=setTimeout(()=>{$("prev").innerHTML=render($("src").value);},150);
});

\`\`\`

---`;
  $("prev").innerHTML=render($("src").value);
};
