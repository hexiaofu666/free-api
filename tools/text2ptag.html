<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本回车换行转P标签 - 词海工具箱</title>
<meta name="description" content="在线文本换行转 HTML 段落标签工具，把纯文本的换行转为 p 标签或 br 标签，支持转义 HTML 字符。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/text2ptag.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="text2ptag" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>纯文本</label><textarea id="src" rows="6">第一段内容第一行
第一段内容第二行

第二段内容</textarea></div>
      <div class="fitem"><label>转换方式</label>
        <select id="mode">
          <option value="p">每个非空行 → &lt;p&gt; 标签</option>
          <option value="pgroup">连续行合并为一段再转 &lt;p&gt;</option>
          <option value="br">换行 → &lt;br&gt; 标签</option>
        </select>
      </div>
      <div class="fitem"><label>转义 HTML 特殊字符</label>
        <select id="esc"><option value="yes">转义（推荐）</option><option value="no">不转义</option></select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">转换</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">HTML 代码结果</strong></div>
      <textarea id="res" rows="7" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于文本回车换行转P标签介绍：</h4>
    <ol>
      <li>每个非空行转 p 标签会把每行独立包裹，适合逐行内容的排版。</li>
      <li>连续行合并为一段会把空行作为段落分隔，更符合正文排版习惯。</li>
      <li>转义 HTML 特殊字符可防止原文中的尖括号破坏页面结构，建议保持开启。</li>
      <li>转换结果可直接粘贴到 CMS 编辑器的源码模式中使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfHtmlEsc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function __xfSplitLines(text) { return String(text).replace(/\r\n?/g, "\n").split("\n"); }
function __xfTextToP(text, mode, escape) {
  var lines = __xfSplitLines(text);
  var esc = function (s) { return escape === "no" ? s : __xfHtmlEsc(s); };
  if (mode === "br") return lines.map(esc).join("<br>\n");
  if (mode === "pgroup") {
    var groups = [], cur = [];
    lines.forEach(function (l) {
      if (l.trim() === "") { if (cur.length) { groups.push(cur); cur = []; } }
      else cur.push(l);
    });
    if (cur.length) groups.push(cur);
    return groups.map(function (g) { return "<p>" + esc(g.join("\n")) + "</p>"; }).join("\n");
  }
  return lines.filter(function (l) { return l.trim() !== ""; }).map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("\n");
}
function run() {
  var o = __xfTextToP($("src").value, $("mode").value, $("esc").value);
  $("res").value = o;
  $("tip").textContent = "✅ 已生成 " + (o.match(/<p>/g) || []).length + " 个段落标签";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
