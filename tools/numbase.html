<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本与进制互转 - 词海工具箱</title>
<meta name="description" content="文本与进制互转工具：把文本按字符转成二进制、八进制、十进制或十六进制，也可反向还原成可读文本。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/numbase.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="numbase" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>进制</label>
        <select id="radix">
          <option value="2">二进制（2）</option>
          <option value="8">八进制（8）</option>
          <option value="10" selected>十进制（10）</option>
          <option value="16">十六进制（16）</option>
        </select>
      </div>
      <div class="fitem"><label>分隔符</label>
        <select id="sep"><option value="space" selected>空格</option><option value="comma">逗号</option><option value="none">无</option><option value="dash">短横线</option></select>
      </div>
      <div class="fitem"><label>补零位数</label>
        <select id="pad"><option value="auto" selected>自动（按编码定长）</option><option value="0">不补零</option><option value="4">4 位</option><option value="8">8 位</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="toNumBtn">文本 → 进制</button>
      <button class="fbtn blue" id="toTextBtn">进制 → 文本</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">输入内容</div>
      <textarea id="src" style="min-height:110px;">Hi 词海</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">转换结果</strong></div>
      <textarea id="res" readonly style="height:160px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于文本与进制互转介绍：</h4>
    <ol>
      <li>转换以 UTF-8 字节为单位：ASCII 字符占 1 字节，中文通常占 3 字节，emoji 占 4 字节。</li>
      <li>二进制自动按 8 位补齐、八进制按 3 位、十六进制按 2 位，从而保证每段正好对应一个字节，便于反向还原。</li>
      <li>选择「无分隔符」时反向转换会按定长自动切分（二进 8 位、八进 3 位、十六进 2 位），因此必须保持补齐。</li>
      <li>十六进制常用于内存调试与协议分析，二进制常用于教学演示字符编码原理。</li>
      <li>反向转换会校验每一段是否落在 0-255 范围，超出范围会明确指出是第几段出错。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var SEP = { space: " ", comma: ",", none: "", dash: "-" };
function __xfToBytes(str) {
  var b = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 128) b.push(c);
    else if (c < 2048) b.push(192 | (c >> 6), 128 | (c & 63));
    else b.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
  }
  return b;
}
function __xfBytesToStr(b) {
  var s = "", i = 0;
  while (i < b.length) {
    var c = b[i++];
    if (c < 128) s += String.fromCharCode(c);
    else if (c < 224) s += String.fromCharCode(((c & 31) << 6) | (b[i++] & 63));
    else if (c < 240) s += String.fromCharCode(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
    else { var cp = ((c & 7) << 18) | ((b[i++] & 63) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63); cp -= 0x10000; s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 1023)); }
  }
  return s;
}
/* 文本 → 进制串 */
function __xfTextToRadix(text, radix, sep, pad) {
  var bytes = __xfToBytes(text), s = SEP[sep] !== undefined ? SEP[sep] : " ";
  var auto = radix === 2 ? 8 : (radix === 8 ? 3 : (radix === 16 ? 2 : 3));
  var width = pad === "auto" ? auto : (parseInt(pad, 10) || 0);
  return bytes.map(function (x) {
    var v = x.toString(radix);
    while (v.length < width) v = "0" + v;
    return v;
  }).join(s);
}
/* 进制串 → 文本 */
function __xfRadixToText(str, radix, sep) {
  var s = SEP[sep] !== undefined ? SEP[sep] : " ";
  var parts = s ? String(str).split(s) : String(str).match(new RegExp(".{1," + (radix === 2 ? 8 : (radix === 8 ? 3 : 2)) + "}", "g")) || [];
  var bytes = [];
  for (var i = 0; i < parts.length; i++) {
    var t = parts[i].replace(/[^0-9a-fA-F]/g, "");
    if (!t && sep !== "none") return { ok: false, error: "第 " + (i + 1) + " 段为空或含非法字符" };
    if (!t) continue;
    var v = parseInt(t, radix);
    if (isNaN(v) || v > 255) return { ok: false, error: "第 " + (i + 1) + " 段「" + parts[i] + "」不是合法的 " + radix + " 进制字节" };
    bytes.push(v);
  }
  return { ok: true, text: __xfBytesToStr(bytes), bytes: bytes.length };
}
window.__xfTextToRadix = __xfTextToRadix;
window.__xfRadixToText = __xfRadixToText;
window.__xfToBytes = __xfToBytes;

var $ = function (id) { return document.getElementById(id); };
$("toNumBtn").onclick = function () {
  var out = __xfTextToRadix($("src").value, +$("radix").value, $("sep").value, $("pad").value);
  $("res").value = out;
  $("tip").textContent = "✅ 已转为 " + $("radix").value + " 进制（" + __xfToBytes($("src").value).length + " 字节）";
};
$("toTextBtn").onclick = function () {
  var r = __xfRadixToText($("src").value, +$("radix").value, $("sep").value);
  if (!r.ok) { $("res").value = "❌ " + r.error; $("tip").textContent = "❌ 转换失败"; return; }
  $("res").value = r.text;
  $("tip").textContent = "✅ 已还原文本（" + r.bytes + " 字节）";
};
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
["radix", "sep", "pad"].forEach(function (id) { $(id).addEventListener("change", function () { if ($("res").value) $("toNumBtn").click(); }); });
$("toNumBtn").click();
</script>
</body>
</html>
