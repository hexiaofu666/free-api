<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正六边形面积计算器 - 词海工具箱</title>
<meta name="description" content="在线正六边形面积计算器，输入边长算出面积、周长、外接圆与内切圆半径，适合蜂窝板材下料估算。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/hexagonarea.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="hexagonarea" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>边长 a</label><input type="text" id="src" value="10"></div>
      <div class="fitem"><label>厚度（算体积用）</label><input type="text" id="thk" value="2"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button><button class="fbtn brown" id="volBtn">按厚度算体积</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">正六边形：6 个等边三角形组成</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于正六边形面积计算器介绍：</h4>
    <ol>
      <li>正六边形可拆成 6 个全等等边三角形，面积公式 S = 3√3/2 × a²。</li>
      <li>外接圆半径等于边长 a，内切圆半径（边心距）等于 √3/2 × a。</li>
      <li>周长 = 6a，外接圆半径与内切圆半径之比恒为 2:√3。</li>
      <li>按厚度算体积使用「厚度」输入框，体积 = 底面积 × 厚度，用于估算板材用量。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfHexagon(a, dec) {
  var x = Number(a);
  if (!isFinite(x) || x <= 0) return null;
  var area = 3 * Math.sqrt(3) / 2 * x * x;
  var rOuter = x, rInner = Math.sqrt(3) / 2 * x;
  return {
    a: x, area: area, peri: 6 * x, rOuter: rOuter, rInner: rInner,
    text: { area: String(__xfRound(area, dec)), peri: String(__xfRound(6 * x, dec)), rOuter: String(__xfRound(rOuter, dec)), rInner: String(__xfRound(rInner, dec)) }
  };
}
function __xfHexVolume(a, thickness, dec) {
  var o = __xfHexagon(a, dec);
  var t = Number(thickness);
  if (!o || !isFinite(t) || t <= 0) return null;
  return { area: o.area, thickness: t, volume: o.area * t, text: String(__xfRound(o.area * t, dec)) };
}
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfHexagon($("src").value, dec);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的边长"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>面积 S = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.area + "</b></div>" +
    "<div>周长 = " + o.text.peri + "　外接圆半径 R = " + o.text.rOuter + "　内切圆半径 r = " + o.text.rInner + "</div>" +
    "<div style='color:#888;'>验算：6 个等边三角形，单个面积 = " + __xfRound(o.area / 6, 6) + "</div>";
  return o;
}
function runVol() {
  var dec = Number($("dec").value) || 0;
  var o = __xfHexVolume($("src").value, $("thk").value, dec);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的厚度"; return; }
  $("tip").textContent = "✅ 体积计算完成";
  $("res").innerHTML = "<div>底面积 S = " + __xfRound(o.area, dec) + "　厚度 t = " + o.thickness + "</div>" +
    "<div>体积 V = <b style='color:#4d8bb8;font-size:16px;'>" + o.text + "</b></div>";
  return o;
}
$("runBtn").onclick = run;
$("volBtn").onclick = runVol;
run();
</script>
</body>
</html>
