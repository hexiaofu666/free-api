<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温度单位换算 - 词海工具箱</title>
<meta name="description" content="在线温度单位换算器，摄氏度、华氏度、开尔文、兰氏度四种温标互相换算，附常见温度对照。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/unittemp.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="unittemp" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>数值</label><input type="text" id="val" value="25"></div>
      <div class="fitem"><label>源单位</label>
        <select id="from"><option value="c">摄氏度 ℃</option><option value="f">华氏度 ℉</option><option value="k">开尔文 K</option><option value="r">兰氏度 °R</option></select>
      </div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn green" id="runBtn">换算</button><button class="fbtn brown" id="tabBtn">常用温度对照</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">四种温标互相换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于温度单位换算介绍：</h4>
    <ol>
      <li>摄氏度与华氏度换算公式：℉ = ℃ × 9/5 + 32，℃ = (℉ - 32) × 5/9。</li>
      <li>开尔文与摄氏度关系为 K = ℃ + 273.15，是最常用的绝对温标。</li>
      <li>兰氏度以华氏度为刻度起点为绝对零度，°R = ℉ + 459.67。</li>
      <li>常用温度对照表列出水的冰点、室温、体温、沸点等参考值。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfTempToC(v, from) {
  var n = Number(v);
  if (!isFinite(n)) return null;
  if (from === "f") return (n - 32) * 5 / 9;
  if (from === "k") return n - 273.15;
  if (from === "r") return (n - 491.67) * 5 / 9;
  return n;
}
function __xfTempConvert(v, from) {
  var c = __xfTempToC(v, from);
  if (c === null) return null;
  return { c: c, f: c * 9 / 5 + 32, k: c + 273.15, r: (c + 273.15) * 9 / 5 };
}
function __xfTempTable() {
  var pts = [{ n: "绝对零度", c: -273.15 }, { n: "水结冰", c: 0 }, { n: "常温 25℃", c: 25 },
    { n: "人体体温", c: 37 }, { n: "水沸腾（标准大气压）", c: 100 }];
  return pts.map(function (p) {
    var o = __xfTempConvert(p.c, "c");
    return { name: p.n, c: __xfRound(o.c, 2), f: __xfRound(o.f, 2), k: __xfRound(o.k, 2) };
  });
}
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfTempConvert($("val").value, $("from").value);
  if (!o) { $("tip").textContent = "⚠️ 请输入合法数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML =
    "<div>摄氏度 ℃：<b style='color:#5a8f7b;font-size:15px;'>" + __xfRound(o.c, dec) + "</b></div>" +
    "<div>华氏度 ℉：<b style='color:#5a8f7b;'>" + __xfRound(o.f, dec) + "</b></div>" +
    "<div>开尔文 K：<b style='color:#5a8f7b;'>" + __xfRound(o.k, dec) + "</b></div>" +
    "<div>兰氏度 °R：<b style='color:#5a8f7b;'>" + __xfRound(o.r, dec) + "</b></div>";
  return o;
}
function runTab() {
  var list = __xfTempTable();
  $("tip").textContent = "✅ 常用温度对照";
  $("res").innerHTML = list.map(function (x) {
    return "<div>" + x.name + "：℃ " + x.c + "　℉ " + x.f + "　K " + x.k + "</div>";
  }).join("");
  return list;
}
$("runBtn").onclick = run;
$("tabBtn").onclick = runTab;
run();
</script>
</body>
</html>
