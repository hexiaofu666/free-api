<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闰年在线查询 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.5"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.5">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="在线判断指定年份是否为闰年">
<link rel="canonical" href="https://tools.hdemba.cn/tools/leapyear.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="leapyear" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>查询年份</label><input type="number" id="year" placeholder="如 2028"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查询闰年</button>
      <button class="fbtn brown" id="nearBtn">附近闰年</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>查询结果</strong><span id="copyBtn">复制</span></div>
      <textarea id="output" readonly style="min-height:200px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于闰年查询工具介绍：</h4>
    <ol>
      <li>公历闰年判定规则（同时满足任意一条即为闰年）：</li>
      <li>① 能被 4 整除且不能被 100 整除，如 2024、2028 年。</li>
      <li>② 能被 400 整除，如 2000、2400 年；而 1900、2100 年虽能被 100 整除但不能被 400 整除，是平年。</li>
      <li>闰年 2 月有 29 天，全年 366 天；平年 2 月 28 天，全年 365 天。四年一闰，百年不闰，四百年再闰。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.5"></script>
<script src="../assets/chrome.js?v=1.5.5"></script>
<script>
const $=id=>document.getElementById(id);
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
$("runBtn").onclick=()=>{
  const y=+$("year").value;
  if(!y||y<1||y>9999){alert("请输入 1-9999 之间的年份");return;}
  const leap=isLeap(y);
  const lines=[`${y}年 ${leap?"是":"不是"}闰年。`,""];
  lines.push(leap?"该年 2 月有 29 天，全年共 366 天。":"该年 2 月有 28 天，全年共 365 天。");
  if(!leap){
    let prev=y-1,next=y+1;
    while(!isLeap(prev))prev--;
    while(!isLeap(next))next++;
    lines.push("",`上一个闰年：${prev} 年`,"下一个闰年："+next+" 年");
  }
  $("output").value=lines.join("\n");
  $("outBox").classList.add("on");
};
$("nearBtn").onclick=()=>{
  const y=+$("year").value||new Date().getFullYear();
  const list=[];
  for(let i=y-8;i<=y+8;i++) if(isLeap(i)) list.push(i+(i===y?"（今年）":""));
  $("output").value=`${y} 年前后最近的闰年：\n\n`+list.join("、");
  $("outBox").classList.add("on");
};
$("clearBtn").onclick=()=>{$("output").value="";$("outBox").classList.remove("on");};
$("copyBtn").onclick=()=>{$("output").select();document.execCommand("copy");};
</script>
</body>
</html>
