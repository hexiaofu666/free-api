<body data-tool="lcmcalc" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>整数列表</label><input type="text" id="src" placeholder="例如：4, 6, 8" value="4, 6, 8"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">请输入两个及以上整数</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于最小公倍数计算器介绍：</h4>
    <ol>
      <li>输入两个及以上整数（逗号、空格或换行分隔），即时给出最小公倍数。</li>
      <li>算法为两两求 lcm(a,b) = a ÷ gcd(a,b) × b，可避免中间结果溢出。</li>
      <li>结果区同时给出各数的倍数关系，便于检查是否为公倍数。</li>
      <li>最小公倍数常用于分数通分、周期同步等问题。</li>
    </ol>
  </div>
</div></div></div>

<script>
var $ = function (id) { return document.getElementById(id); };
function __xfFloor(n) { return n < 0 ? Math.ceil(n) : Math.floor(n); }
function __xfParseNums(text) {
  var parts = String(text).split(/[^0-9.]+/);
  var arr = [];
  for (var i = 0; i < parts.length; i++) { if (parts[i] === "") continue; var v = Number(parts[i]); if (isFinite(v)) arr.push(__xfFloor(v)); }
  return arr;
}
function __xfGcd(a, b) { a = Math.abs(__xfFloor(a)); b = Math.abs(__xfFloor(b)); while (b) { var t = a % b; a = b; b = t; } return a; }
function __xfLcm(a, b) {
  a = Math.abs(__xfFloor(a)); b = Math.abs(__xfFloor(b));
  if (!a || !b) return 0;
  return a / __xfGcd(a, b) * b;
}
function __xfLcmAll(arr) {
  if (!arr || !arr.length) return null;
  var v = arr[0];
  for (var i = 1; i < arr.length; i++) v = __xfLcm(v, arr[i]);
  return v;
}
function run() {
  var nums = __xfParseNums($("src").value);
  if (nums.length < 2) { $("tip").textContent = "⚠️ 请至少输入两个整数"; $("res").innerHTML = ""; return; }
  var v = __xfLcmAll(nums);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>输入整数：" + nums.join("、") + "</div>" +
    "<div>最小公倍数：<b style='color:#4d8bb8;font-size:16px;'>" + v + "</b></div>" +
    "<div style='color:#888;'>验算：" + nums.map(function (n) { return v + "÷" + n + "=" + (v / n); }).join("，") + "</div>";
  return v;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("src").value = ""; $("res").innerHTML = ""; $("tip").textContent = "请输入两个及以上整数"; };
run();
</script>
