<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片在线转Base64 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.4"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.4">
<style>
.drop-area {
  border: 2px dashed #ddd; border-radius: 6px; padding: 40px 20px;
  text-align: center; color: #999; font-size: 13px; cursor: pointer;
  transition: border-color .2s; margin-bottom: 16px;
}
.drop-area:hover, .drop-area.over { border-color: #ff6500; color: #ff6500; }
.b64-out {
  width: 100%; height: 180px; resize: vertical; border: 1px solid #eee; border-radius: 4px;
  padding: 12px; font-size: 12px; font-family: Consolas, Monaco, monospace;
  line-height: 1.6; outline: none; color: #34495e; word-break: break-all;
}
.b64-info { font-size: 12px; color: #bbb; margin-top: 8px; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<meta name="description" content="将本地图片转为 Base64 编码">
<link rel="canonical" href="https://tools.hdemba.cn/tools/img2base64.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="img2base64" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="mdiv">
      <div class="mlf">
        <div class="drop-area" id="dropArea">
          📷 点击选择图片，或把图片拖到这里<br>
          <small>支持 png / jpg / gif / webp / svg，全程本地处理不上传</small>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <textarea class="b64-out" id="output" readonly placeholder="Base64 编码结果将显示在这里..."></textarea>
        <div class="b64-info" id="info"></div>
      </div>
      <div class="mlr">
        <button class="fbtn blue" id="copyBtn">复制 Base64</button>
        <button class="fbtn plain" id="clearBtn">清空</button>
        <p style="font-size:12px;color:#bbb;line-height:2;">Base64 可直接嵌入 HTML/CSS，省去图片请求，适合小图标。图片过大时编码会很长。</p>
      </div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于图片转Base64工具介绍：</h4>
    <p>将本地图片转换为 Base64 编码（Data URL），可直接嵌入网页或 CSS 中。所有处理均在浏览器本地完成，图片不会上传到任何服务器。</p>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.4"></script>
<script src="../assets/chrome.js?v=1.5.4"></script>
<script>
const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const output = document.getElementById("output");
const info = document.getElementById("info");
dropArea.onclick = () => fileInput.click();
["dragover", "dragenter"].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.add("over");
}));
["dragleave", "drop"].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.remove("over");
}));
dropArea.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); };
function loadFile(f) {
  if (!f.type.startsWith("image/")) return alert("请选择图片文件");
  const reader = new FileReader();
  reader.onload = () => {
    output.value = reader.result;
    info.textContent = `✅ ${f.name} · 原始大小 ${(f.size / 1024).toFixed(1)} KB · 编码后 ${(reader.result.length / 1024).toFixed(1)} KB`;
  };
  reader.readAsDataURL(f);
}
document.getElementById("copyBtn").onclick = () => {
  if (!output.value) return alert("还没有转换结果");
  navigator.clipboard.writeText(output.value).then(() => alert("✅ 已复制到剪贴板"));
};
document.getElementById("clearBtn").onclick = () => {
  output.value = ""; info.textContent = ""; fileInput.value = "";
};
</script>
</body>
</html>
