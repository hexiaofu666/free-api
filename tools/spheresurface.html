<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆球表面积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆球表面积计算器，输入半径或直径算出球面面积，并给出大圆面积与球体积参考值。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/spheresurface.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="spheresurface" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知</label>
        <select id="mode"><option value="r">半径 r</option><option value="d">直径 d</option><option value="s">表面积 S</option></select>
      </div>
      <div class="fitem"><label>数值</label><input type="text" id="src" value="3"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">球表面积 S = 4πr²</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆球表面积计算器介绍：</h4>
    <ol>
      <li>球表面积公式 S = 4πr²，正好等于大圆面积的四倍。</li>
      <li>可按半径、直径或已知表面积反推半径，三种输入方式都支持。</li>
      <li>结果同时给出体积，便于做球形罐体、气球的用料估算。</li>
      <li>球面积随半径平方增长，半径翻倍则表面积变为 4 倍。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfSphereAll(mode, v, dec) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return null;
  var r = mode === "d" ? n / 2 : mode === "s" ? Math.sqrt(n / (4 * Math.PI)) : n;
  var surface = 4 * Math.PI * r * r;
  return {
    r: r, d: 2 * r, surface: surface, greatCircle: Math.PI * r * r, volume: 4 / 3 * Math.PI * r * r * r,
    text: { surface: String(__xfRound(surface, dec)), greatCircle: String(__xfRound(Math.PI * r * r, dec)), volume: String(__xfRound(4 / 3 * Math.PI * r * r * r, dec)) }
  };
}
function run() {
  var o = __xfSphereAll($("mode").value, $("src").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>球表面积 S = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.surface + "</b></div>" +
    "<div>半径 r = " + __xfRound(o.r, 6) + "　直径 d = " + __xfRound(o.d, 6) + "</div>" +
    "<div style='color:#888;'>大圆面积 = " + o.text.greatCircle + "（恰为表面积的 1/4），球体积 = " + o.text.volume + "</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
