<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS3D翻转卡片生成器 - 词海工具箱</title>
<meta name="description" content="生成 CSS 3D 翻转卡片代码，包含正面背面结构、透视距离、翻转方向与动画时长，复制即可用于产品展示。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/css3dflip.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="css3dflip" data-cat="seo">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>翻转方向</label>
        <select id="dir"><option value="Y" selected>水平翻转（Y 轴）</option><option value="X">垂直翻转（X 轴）</option></select>
      </div>
      <div class="fitem"><label>透视距离 px</label><input type="number" id="pp" value="1000" min="200" max="4000"></div>
      <div class="fitem"><label>动画时长 ms</label><input type="number" id="dur" value="600" min="100" max="3000"></div>
      <div class="fitem"><label>卡片宽 x 高 px</label><input type="text" id="size" value="260x160"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">生成代码</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">HTML + CSS</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:260px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于CSS3D翻转卡片生成器介绍：</h4>
    <ol>
      <li>透视距离越小 3D 效果越夸张，1000 像素左右接近自然的视觉感受。</li>
      <li>backface-visibility 设为 hidden 可隐藏卡片背面，避免翻转时看到镜像文字。</li>
      <li>父元素加 perspective、子元素加 preserve-3d 是 3D 翻转生效的两个关键条件。</li>
      <li>垂直翻转只需把 rotateY 换成 rotateX，背面初始角度也要同步改成 rotateX(180deg)。</li>
      <li>鼠标悬停触发适合桌面端，移动端可改为点击切换类名来触发同样的过渡动画。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfFlipCss(opts) {
  opts = opts || {};
  var dir = opts.dir === "X" ? "X" : "Y";
  var persp = Number(opts.perspective) || 1000;
  var dur = Number(opts.duration) || 600;
  var size = opts.size || "260x160";
  var css = [
    ".flip-card {",
    "  width: " + size.split("x")[0] + "px;",
    "  height: " + (size.split("x")[1] || 160) + "px;",
    "  perspective: " + persp + "px;",
    "}",
    ".flip-card-inner {",
    "  position: relative;",
    "  width: 100%;",
    "  height: 100%;",
    "  transition: transform " + dur + "ms;",
    "  transform-style: preserve-3d;",
    "}",
    ".flip-card:hover .flip-card-inner {",
    "  transform: rotate" + dir + "(180deg);",
    "}",
    ".flip-card-front, .flip-card-back {",
    "  position: absolute;",
    "  width: 100%;",
    "  height: 100%;",
    "  backface-visibility: hidden;",
    "  border-radius: 8px;",
    "  display: flex;",
    "  align-items: center;",
    "  justify-content: center;",
    "}",
    ".flip-card-front { background: #ff6500; color: #fff; }",
    ".flip-card-back { background: #22303f; color: #fff; transform: rotate" + dir + "(180deg); }"
  ].join("\n");
  var html = [
    '<div class="flip-card">',
    '  <div class="flip-card-inner">',
    '    <div class="flip-card-front">正面</div>',
    '    <div class="flip-card-back">背面</div>',
    '  </div>',
    '</div>'
  ].join("\n");
  return { css: css, html: html, code: "<!-- HTML -->\n" + html + "\n\n<!-- CSS -->\n" + css };
}
window.__xfFlipCss = __xfFlipCss;
function run() {
  var r = __xfFlipCss({ dir: $("dir").value, perspective: $("pp").value, duration: $("dur").value, size: $("size").value });
  $("res").value = r.code;
  $("state").textContent = $("dir").value + " 轴翻转";
  $("tip").textContent = "✅ 已生成翻转卡片代码";
  return r;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
