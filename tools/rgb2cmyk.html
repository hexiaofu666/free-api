<body data-tool="rgb2cmyk" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="cp-box" id="preview">#FF6500</div>
    <div class="crow">
      <div class="side">
        <div class="fin"><label>红 (R:0~255)</label><input id="r" type="number" min="0" max="255" value="255"></div>
        <div class="fin"><label>绿 (G:0~255)</label><input id="g" type="number" min="0" max="255" value="101"></div>
        <div class="fin"><label>蓝 (B:0~255)</label><input id="b" type="number" min="0" max="255" value="0"></div>
      </div>
      <span class="to">TO</span>
      <div class="side">
        <div class="fin"><label>青 C (0~100%)</label><input id="c" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>品红 M (0~100%)</label><input id="m" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>黄 Y (0~100%)</label><input id="y" type="number" min="0" max="100" step="0.1"></div>
        <div class="fin"><label>黑 K (0~100%)</label><input id="k" type="number" min="0" max="100" step="0.1"></div>
      </div>
    </div>
    <p style="font-size:12px;color:#bbb;line-height:2;">修改任意一侧的值，另一侧实时同步转换。CMYK 为印刷四色模式。</p>
  </div>
  <div class="resttips">
    <h4>关于RGB/CMYK相互转换工具介绍：</h4>
    <p>1、RGB 是屏幕显示使用的加色模型，CMYK（青、品红、黄、黑）是印刷使用的减色模型。</p>
    <p>2、两者的色域不同，RGB 转 CMYK 后实际印刷效果可能与屏幕显示略有差异，本工具给出的是标准数学转换结果。</p>
    <p>3、修改任意一侧的值即可实时得到另一侧的转换结果。</p>
  </div>
</div></div></div>

<script>
const $ = id => document.getElementById(id);
const clamp = v => Math.min(255, Math.max(0, Math.round(+v || 0)));
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase(); }
function rgb2cmyk(r, g, b) {
  const R = r / 255, G = g / 255, B = b / 255;
  const k = 1 - Math.max(R, G, B);
  if (k === 1) return [0, 0, 0, 100];
  const c = (1 - R - k) / (1 - k), m = (1 - G - k) / (1 - k), y = (1 - B - k) / (1 - k);
  return [c, m, y, k].map(u => +(u * 100).toFixed(1));
}
function cmyk2rgb(c, m, y, k) {
  return [c, m, y].map(u => Math.round(255 * (1 - u / 100) * (1 - k / 100)));
}
function paint(r, g, b) {
  const hex = toHex(r, g, b);
  $("preview").style.background = hex;
  $("preview").textContent = hex;
}
function fromRgb() {
  const r = clamp($("r").value), g = clamp($("g").value), b = clamp($("b").value);
  const [c, m, y, k] = rgb2cmyk(r, g, b);
  $("c").value = c; $("m").value = m; $("y").value = y; $("k").value = k;
  paint(r, g, b);
}
function fromCmyk() {
  const c = Math.min(100, Math.max(0, +$("c").value || 0));
  const m = Math.min(100, Math.max(0, +$("m").value || 0));
  const y = Math.min(100, Math.max(0, +$("y").value || 0));
  const k = Math.min(100, Math.max(0, +$("k").value || 0));
  const [r, g, b] = cmyk2rgb(c, m, y, k);
  $("r").value = r; $("g").value = g; $("b").value = b;
  paint(r, g, b);
}
["r", "g", "b"].forEach(id => $(id).addEventListener("input", fromRgb));
["c", "m", "y", "k"].forEach(id => $(id).addEventListener("input", fromCmyk));
fromRgb();
</script>
</body>
