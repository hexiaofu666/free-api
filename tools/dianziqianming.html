<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子签名在线生成 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.2"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.2">
<style>
.sign-wrap { border: 1px dashed #ddd; border-radius: 6px; background: #fff; touch-action: none; }
.sign-wrap canvas { display: block; width: 100%; height: 260px; cursor: crosshair; }
.sign-opts { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; font-size: 13px; }
.sign-opts label { display: flex; align-items: center; gap: 6px; }
.sign-opts input[type=color] { width: 32px; height: 28px; border: 1px solid #eee; border-radius: 4px; padding: 0; background: none; }
.sign-opts input[type=range] { width: 90px; }
</style>
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body data-tool="dianziqianming" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="sign-wrap" id="wrap"><canvas id="pad" width="640" height="260"></canvas></div>
    <div class="sign-opts">
      <label>笔色 <input type="color" id="color" value="#1a1a1a"></label>
      <label>粗细 <input type="range" id="width" min="1" max="10" value="3"><span id="wv">3</span></label>
      <button class="fbtn plain" id="undoBtn" style="width:auto;display:inline-block;height:32px;line-height:30px;padding:0 14px;">撤销</button>
      <button class="fbtn plain" id="clearBtn" style="width:auto;display:inline-block;height:32px;line-height:30px;padding:0 14px;">清空</button>
      <button class="fbtn teal" id="saveBtn" style="width:auto;display:inline-block;height:32px;line-height:32px;padding:0 14px;">下载 PNG</button>
    </div>
  </div>
  <div class="resttips">
    <h4>关于电子签名生成器介绍：</h4>
    <ol>
      <li>用鼠标或手指在上方白色区域手写签名，支持触屏设备。</li>
      <li>可自定义笔迹颜色与粗细，支持撤销上一步与一键清空。</li>
      <li>点击「下载 PNG」即可保存为透明背景图片，可插入文档或合同。</li>
      <li>签名全程在本页完成，笔迹数据不会上传服务器。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.2"></script>
<script src="../assets/chrome.js?v=1.5.2"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$("pad"), ctx=cv.getContext("2d");
let drawing=false, undoStack=[];
function pos(e){
  const r=cv.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return [(p.clientX-r.left)*cv.width/r.width,(p.clientY-r.top)*cv.height/r.height];
}
function start(e){
  e.preventDefault();
  undoStack.push(ctx.getImageData(0,0,cv.width,cv.height));
  if(undoStack.length>30)undoStack.shift();
  drawing=true;
  const [x,y]=pos(e);
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineWidth=+$("width").value;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle=$("color").value;
}
function move(e){
  if(!drawing)return;
  e.preventDefault();
  const [x,y]=pos(e);
  ctx.lineTo(x,y);ctx.stroke();
}
function end(){drawing=false;}
cv.addEventListener("mousedown",start);cv.addEventListener("mousemove",move);
window.addEventListener("mouseup",end);
cv.addEventListener("touchstart",start,{passive:false});
cv.addEventListener("touchmove",move,{passive:false});
cv.addEventListener("touchend",end);
$("width").addEventListener("input",()=>$("wv").textContent=$("width").value);
$("clearBtn").onclick=()=>{undoStack.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.clearRect(0,0,cv.width,cv.height);};
$("undoBtn").onclick=()=>{const s=undoStack.pop();if(s)ctx.putImageData(s,0,0);};
$("saveBtn").onclick=()=>{
  const a=document.createElement("a");
  a.download="签名-"+Date.now()+".png";
  a.href=cv.toDataURL("image/png");
  a.click();
};
</script>
</body>
</html>
