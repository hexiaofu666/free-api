<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年月日利率互转计算器 - 词海工具箱</title>
<meta name="description" content="在线年月日利率互转计算器，按年利率等于月利率乘十二、等于日利率乘三百六十的口径，一键换算三种利率表达。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/lilvzhuanhuan.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="lilvzhuanhuan" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知利率类型</label>
        <select id="from"><option value="year">年利率</option><option value="month">月利率</option><option value="day">日利率</option></select>
      </div>
      <div class="fitem"><label>利率数值（%）</label><input type="text" id="val" value="3.6"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">换算</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写后点击换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于年月日利率互转计算器介绍：</h4>
    <ol>
      <li>换算口径：年利率 = 月利率 × 12 = 日利率 × 360，这是银行常用的折算方式。</li>
      <li>民间借贷中的月息一分即月利率 1%，对应年利率 12%。</li>
      <li>日利率常用万分之几表示，例如日利率 0.01% 即万分之一。</li>
      <li>信用卡分期与消费贷常宣传日利率，换算成年化后更能看清真实成本。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRateConvert(v, from) {
  var year;
  if (from === "year") year = v;
  else if (from === "month") year = v * 12;
  else if (from === "day") year = v * 360;
  else return null;
  return { year: year, month: year / 12, day: year / 360 };
}
function __xfRound6(v) { return Math.round(v * 1e6) / 1e6; }
function run() {
  var v = Number($("val").value), from = $("from").value || "year";
  if (!isFinite(v) || v <= 0) { $("tip").textContent = "⚠️ 请输入大于 0 的利率数值"; $("res").innerHTML = ""; return null; }
  var o = __xfRateConvert(v, from);
  var NAMES = { year: "年利率", month: "月利率", day: "日利率" };
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML = "<div>已知：" + NAMES[from] + " " + v + "%</div>" +
    "<div>年利率：<b style='color:#4d8bb8;'>" + __xfRound6(o.year) + "%</b></div>" +
    "<div>月利率：<b style='color:#4d8bb8;'>" + __xfRound6(o.month) + "%</b></div>" +
    "<div>日利率：<b style='color:#4d8bb8;'>" + __xfRound6(o.day) + "%</b></div>" +
    "<div style='color:#888;'>日利率约合万分之 " + __xfRound6(o.day * 100) + "</div>";
  return o;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
