<script>
var $ = function (id) { return document.getElementById(id); };
var LOREM_WORDS = ["lorem","ipsum","dolor","sit","amet","consectetur","adipiscing","elit","sed","do","eiusmod","tempor","incididunt","ut","labore","et","dolore","magna","aliqua","enim","ad","minim","veniam","quis","nostrud","exercitation","ullamco","laboris","nisi","aliquip","ex","ea","commodo","consequat"];
function __xfLorem(count, rnd, start) {
  rnd = rnd || Math.random;
  var n = parseInt(count, 10); if (isNaN(n)) n = 5; n = Math.max(1, n);
  var out = [];
  for (var i = 0; i < n; i++) {
    if (i < 2 && start !== false) out.push(i === 0 ? "lorem" : "ipsum");
    else out.push(LOREM_WORDS[Math.min(LOREM_WORDS.length - 1, Math.floor(rnd() * LOREM_WORDS.length))]);
  }
  var s = out.join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}
function __xfLoremParagraphs(pcount, sentPer, wps, rnd, start) {
  rnd = rnd || Math.random;
  var pc = parseInt(pcount, 10); if (isNaN(pc)) pc = 3; pc = Math.max(1, pc);
  var sc = parseInt(sentPer, 10); if (isNaN(sc)) sc = 4; sc = Math.max(1, sc);
  var wc = parseInt(wps, 10); if (isNaN(wc)) wc = 8; wc = Math.max(1, wc);
  var ps = [];
  for (var p = 0; p < pc; p++) {
    var sents = [];
    for (var s = 0; s < sc; s++) sents.push(__xfLorem(wc, rnd, s === 0 && p === 0 && start !== false));
    ps.push(sents.join(" "));
  }
  return ps.join("\n\n");
}
window.__xfLorem = __xfLorem;
window.__xfLoremParagraphs = __xfLoremParagraphs;
function run() {
  var out = __xfLoremParagraphs($("p").value, $("s").value, $("w").value, null, $("st").value === "yes");
  $("res").value = out;
  $("state").textContent = out.split(/\s+/).length + " 个词";
  $("tip").textContent = "✅ 已生成";
  return out;
}
