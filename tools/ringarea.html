<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆环面积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆环面积计算器，输入外圆与内圆半径算出圆环面积、环宽与内外圆周长，适合垫圈管件估算。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/ringarea.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="ringarea" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>外圆半径 R</label><input type="text" id="R" value="10"></div>
      <div class="fitem"><label>内圆半径 r</label><input type="text" id="r" value="6"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button><button class="fbtn brown" id="swapBtn">交换内外圆</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">圆环面积 S = π(R² - r²)</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆环面积计算器介绍：</h4>
    <ol>
      <li>圆环面积公式 S = π(R² - r²)，其中 R 为外圆半径、r 为内圆半径。</li>
      <li>若内圆半径大于外圆半径，程序自动交换两者，保证结果非负。</li>
      <li>环宽 = R - r，同时给出内外圆周长，便于计算密封圈、垫片的用料长度。</li>
      <li>内圆半径为 0 时结果退化为整圆面积，可直接作为圆面积工具使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfRing(R, r, dec) {
  var a = Number(R), b = Number(r);
  if (!isFinite(a) || !isFinite(b) || a < 0 || b < 0) return null;
  var outer = Math.max(a, b), inner = Math.min(a, b);
  var area = Math.PI * (outer * outer - inner * inner);
  return {
    R: outer, r: inner, width: outer - inner, area: area, swapped: a < b,
    cOuter: 2 * Math.PI * outer, cInner: 2 * Math.PI * inner,
    text: { area: String(__xfRound(area, dec)), width: String(__xfRound(outer - inner, dec)), cOuter: String(__xfRound(2 * Math.PI * outer, dec)), cInner: String(__xfRound(2 * Math.PI * inner, dec)) }
  };
}
function run() {
  var o = __xfRing($("R").value, $("r").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入非负半径"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成" + (o.swapped ? "（已自动交换内外圆）" : "");
  $("res").innerHTML =
    "<div>圆环面积 S = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.area + "</b></div>" +
    "<div>环宽 = " + o.text.width + "　外周长 = " + o.text.cOuter + "　内周长 = " + o.text.cInner + "</div>" +
    "<div style='color:#888;'>外圆半径 " + o.R + "，内圆半径 " + o.r + "，验算 π×(" + o.R + "²-" + o.r + "²) = " + o.text.area + "</div>";
  return o;
}
$("runBtn").onclick = run;
$("swapBtn").onclick = function () { var t = $("R").value; $("R").value = $("r").value; $("r").value = t; return run(); };
run();
</script>
</body>
</html>
