<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆锥体积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆锥体积计算器，输入底面半径与高算出圆锥体积、母线长与底面积，同时对比等底等高圆柱。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/conevolume.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="conevolume" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>底面半径 r</label><input type="text" id="r" value="3"></div>
      <div class="fitem"><label>高 h</label><input type="text" id="h" value="4"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">圆锥体积 V = πr²h ÷ 3</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆锥体积计算器介绍：</h4>
    <ol>
      <li>圆锥体积是同底等高圆柱体积的三分之一，公式 V = πr²h/3。</li>
      <li>母线长 l = √(r² + h²)，是展开扇形半径，做锥形帽、漏斗时要用到。</li>
      <li>结果区会给出等底等高圆柱体积，方便核对三分之一关系。</li>
      <li>输入单位保持一致，例如半径与高都用厘米，则体积单位为立方厘米。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfConeVolume(r, h, dec) {
  var x = Number(r), y = Number(h);
  if (!isFinite(x) || !isFinite(y) || x <= 0 || y <= 0) return null;
  var base = Math.PI * x * x, vol = base * y / 3;
  return {
    r: x, h: y, base: base, volume: vol, slant: Math.sqrt(x * x + y * y), cylinder: base * y,
    text: { volume: String(__xfRound(vol, dec)), base: String(__xfRound(base, dec)), slant: String(__xfRound(Math.sqrt(x * x + y * y), dec)), cylinder: String(__xfRound(base * y, dec)) }
  };
}
function run() {
  var o = __xfConeVolume($("r").value, $("h").value, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的半径与高"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>圆锥体积 V = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.volume + "</b></div>" +
    "<div>底面积 = " + o.text.base + "　母线长 l = " + o.text.slant + "</div>" +
    "<div style='color:#888;'>等底等高圆柱体积 = " + o.text.cylinder + "，圆锥恰为其 1/3</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
