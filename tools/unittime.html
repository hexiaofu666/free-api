<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间单位换算 - 词海工具箱</title>
<meta name="description" content="在线时间单位换算器，纳秒到年到世纪全部覆盖，秒、分、时、天、周、月、年、世纪一次换算。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/unittime.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="unittime" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>数值</label><input type="text" id="val" value="1"></div>
      <div class="fitem"><label>源单位</label><select id="from"></select></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar"><button class="fbtn green" id="runBtn">换算</button><button class="fbtn brown" id="secBtn">秒数反查</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">以秒为基准换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于时间单位换算介绍：</h4>
    <ol>
      <li>以秒为基准，覆盖纳秒到世纪的时间单位。</li>
      <li>月按 30 天、年按 365 天计算，属于常用近似口径，非日历精确值。</li>
      <li>1 刻 = 15 分钟，1 时辰 = 2 小时，用于换算中国传统的计时单位。</li>
      <li>秒数反查会给出换算后最接近的天、时、分组合，便于阅读。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
var TIME = [
  { k: "ns", n: "纳秒", f: 1e-9 }, { k: "us", n: "微秒", f: 1e-6 }, { k: "ms", n: "毫秒", f: 0.001 },
  { k: "s", n: "秒", f: 1 }, { k: "min", n: "分钟", f: 60 }, { k: "ke", n: "刻（15 分钟）", f: 900 },
  { k: "shichen", n: "时辰（2 小时）", f: 7200 }, { k: "h", n: "小时", f: 3600 }, { k: "d", n: "天", f: 86400 },
  { k: "w", n: "周", f: 604800 }, { k: "mon", n: "月（30 天）", f: 2592000 }, { k: "y", n: "年（365 天）", f: 31536000 },
  { k: "cy", n: "世纪", f: 3153600000 }
];
function __xfTimeUnit(key) { for (var i = 0; i < TIME.length; i++) if (TIME[i].k === key) return TIME[i]; return null; }
function __xfTimeConvert(v, from) {
  var u = __xfTimeUnit(from), n = Number(v);
  if (!u || !isFinite(n)) return null;
  var base = n * u.f, out = {};
  TIME.forEach(function (x) { out[x.k] = base / x.f; });
  return out;
}
function __xfSecondsHuman(sec) {
  var s = Number(sec);
  if (!isFinite(s) || s < 0) return null;
  var d = Math.floor(s / 86400), r = s % 86400;
  var h = Math.floor(r / 3600); r = r % 3600;
  var m = Math.floor(r / 60), ss = Math.round((r % 60) * 1000) / 1000;
  return { d: d, h: h, m: m, s: ss, text: d + " 天 " + h + " 时 " + m + " 分 " + ss + " 秒" };
}
function __xfTimeList() { return TIME; }
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfTimeConvert($("val").value, $("from").value);
  if (!o) { $("tip").textContent = "⚠️ 请输入合法数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML = TIME.map(function (u) {
    return "<div>" + u.n + "：" + __xfRound(o[u.k], dec) + "</div>";
  }).join("");
  return o;
}
function runSec() {
  var o = __xfSecondsHuman(Number($("val").value));
  if (!o) { $("tip").textContent = "⚠️ 请输入非负秒数"; return; }
  $("tip").textContent = "✅ 秒数反查";
  $("res").innerHTML = "<div>" + $("val").value + " 秒 = <b style='color:#5a8f7b;font-size:15px;'>" + o.text + "</b></div>";
  return o;
}
(function init() {
  var sel = $("from");
  TIME.forEach(function (u) { var op = document.createElement("option"); op.value = u.k; op.textContent = u.n; sel.appendChild(op); });
  sel.value = "h";
})();
$("runBtn").onclick = run;
$("secBtn").onclick = runSec;
run();
</script>
</body>
</html>
