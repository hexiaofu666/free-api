<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片旋转在线 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.7.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.7.0">
<meta name="description" content="在线图片批量旋转工具，支持顺时针旋转90度180度270度，浏览器本地处理不上传">
<link rel="canonical" href="https://tools.hdemba.cn/tools/imgrotate.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="imgrotate" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>选择图片（可多张）</label><input type="file" id="file" accept="image/*" multiple style="height:38px;padding:6px 10px;"></div>
      <div class="fitem"><label>旋转角度</label>
        <select id="deg">
          <option value="90">顺时针 90°</option>
          <option value="180">顺时针 180°</option>
          <option value="270">顺时针 270°</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始旋转并下载</button>
      <button class="fbtn brown" id="zipBtn" style="display:none;">打包下载全部</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>旋转结果</strong><span id="cnt"></span></div>
      <div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于图片旋转工具介绍：</h4>
    <ol>
      <li>本工具可以将多张图片进行不同角度的旋转，可顺时针旋转90度，180度，270度。</li>
      <li>点击或拖拽多张图片到上传入口，工具会自动显示上传的图片文件。</li>
      <li>选择旋转角度后，点击"开始旋转并下载"即可批量处理，单张下载或打包下载。</li>
      <li>本工具只在您的浏览器中处理，图片不会上传至服务器，请放心使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.7.0"></script>
<script src="../assets/chrome.js?v=1.7.0"></script>
<script src="../assets/lib/zip.js"></script>
<script>
const $=id=>document.getElementById(id);
let imgs=[];
function loadFiles(fs){
  imgs=[];
  const tasks=[...fs].map(f=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{imgs.push({name:f.name,img});res();};
    img.src=URL.createObjectURL(f);
  }));
  Promise.all(tasks).then(()=>{ if(imgs.length)$("runBtn").click(); });
}
$("file").onchange=e=>loadFiles(e.target.files);
$("runBtn").onclick=()=>{
  if(!imgs.length){alert("请先选择图片");return;}
  const deg=+$("deg").value, list=$("list");
  list.innerHTML=""; window._out=[];
  imgs.forEach(it=>{
    const swap=deg%180!==0;
    const cv=document.createElement("canvas");
    cv.width=swap?it.img.height:it.img.width;
    cv.height=swap?it.img.width:it.img.height;
    const ctx=cv.getContext("2d");
    ctx.translate(cv.width/2,cv.height/2);
    ctx.rotate(deg*Math.PI/180);
    ctx.drawImage(it.img,-it.img.width/2,-it.img.height/2);
    const url=cv.toDataURL("image/png");
    const base=it.name.replace(/\.[^.]+$/,"");
    window._out.push({name:`${base}_rot${deg}.png`,dataUrl:url});
    const box=document.createElement("div");
    box.style.textAlign="center";
    box.innerHTML=`<img src="${url}" style="max-width:100%;max-height:120px;border:1px solid #eee;border-radius:4px;display:block;margin:0 auto;">
      <a download="${base}_rot${deg}.png" href="${url}" style="font-size:12px;color:#ff6500;">下载</a>`;
    list.appendChild(box);
  });
  $("cnt").textContent=`共 ${imgs.length} 张，已旋转 ${deg}°`;
  $("zipBtn").style.display=imgs.length>1?"":"none";
  $("outBox").classList.add("on");
};
$("zipBtn").onclick=()=>{
  const files=window._out.map(p=>({name:p.name,data:new Uint8Array(Array.from(atob(p.dataUrl.split(",")[1]),c=>c.charCodeAt(0)))}));
  const a=document.createElement("a");
  a.download="rotated.zip"; a.href=URL.createObjectURL(zipMake(files)); a.click();
};
$("clearBtn").onclick=()=>{$("outBox").classList.remove("on");$("list").innerHTML="";imgs=[];$("zipBtn").style.display="none";};
</script>
</body>
</html>
