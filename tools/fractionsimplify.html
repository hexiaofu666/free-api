<!DOCTYPE html>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="在线分数约分工具，把分数化成最简分数，同时给出最大公约数、带分数与小数结果。">

<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";

<body data-tool="fractionsimplify" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>分数列表</label><input type="text" id="src" value="6/8, 100/250, 18/24" placeholder="如 6/8，可多个用逗号分隔"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">约分</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">化为最简分数</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于分数约分与化简介绍：</h4>
    <ol>
      <li>约分即分子分母同除以它们的最大公约数，得到最简分数。</li>
      <li>支持一次输入多个分数，用逗号、空格或换行分隔。</li>
      <li>结果会给出原始分数的最大公约数，方便核对约分倍数。</li>
      <li>假分数会同时给出带分数形式，便于理解实际大小。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
function __xfGcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function __xfReduce(n, d) {
  if (d === 0) return null;
  if (d < 0) { n = -n; d = -d; }
  var g = __xfGcd(n, d);
  return { n: n / g, d: d / g, gcd: g, origN: n, origD: d };
}
function __xfFracText(f) { return f.d === 1 ? String(f.n) : f.n + "/" + f.d; }
function __xfMixed(f) {
  if (f.d === 1 || Math.abs(f.n) < f.d) return null;
  var sign = f.n < 0 ? "-" : "", a = Math.abs(f.n);
  return sign + Math.floor(a / f.d) + " " + (a % f.d) + "/" + f.d;
}
function __xfParseList(text) {
  return String(text).split(/[,\s]+/).filter(function (s) { return s !== ""; }).map(function (s) {
    var m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) return __xfReduce(Number(m[1]), Number(m[2]));
    if (/^-?\d+$/.test(s)) return __xfReduce(Number(s), 1);
    return null;
  });
}
function run() {
  var list = __xfParseList($("src").value), dec = Number($("dec").value) || 0;
  if (!list.length) { $("tip").textContent = "⚠️ 请输入分数"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 共处理 " + list.length + " 个分数";
  $("res").innerHTML = list.map(function (f) {
    if (!f) return "<div style='color:#c00;'>格式错误或分母为 0</div>";
    var mixed = __xfMixed(f);
    return "<div>" + f.origN + "/" + f.origD + " = <b style='color:#4d8bb8;'>" + __xfFracText(f) + "</b>" +
      "<span style='color:#888;'>（最大公约数 " + f.gcd + "，小数 " + __xfRound(f.n / f.d, dec) + (mixed ? "，带分数 " + mixed : "") + "）</span></div>";
  }).join("");
  return list;
}
$("runBtn").onclick = run;
run();
</script>
</body>
