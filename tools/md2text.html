<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown转纯文本 - 词海工具箱</title>
<meta name="description" content="把 Markdown 文档转换为干净纯文本，自动去掉标题井号、加粗斜体标记、链接语法与列表符号，保留文字内容。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/md2text.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="md2text" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>列表符号处理</label>
        <select id="li"><option value="strip" selected>去掉符号</option><option value="keep">保留符号</option></select>
      </div>
      <div class="fitem"><label>代码块内容</label>
        <select id="code"><option value="keep" selected>保留</option><option value="drop">删除</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">转换</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">Markdown 源码</div>
      <textarea id="src" style="min-height:180px;"># 词海工具箱

欢迎使用 **词海工具箱**，这里有 [在线工具](https://tools.hdemba.cn)。

- 免费使用
- 无需登录

> 让工作更简单😀</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">纯文本结果</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:200px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于Markdown转纯文本介绍：</h4>
    <ol>
      <li>标题的井号、引用的尖括号、列表的项目符号都会被去掉，只保留文字本身。</li>
      <li>链接与图片会保留可读文本（图片保留 alt 文字），丢弃 URL 部分。</li>
      <li>加粗、斜体、行内代码的标记符会被移除，文字内容不受影响。</li>
      <li>代码块内容默认保留；若只想提取正文，可将其选择为删除。</li>
      <li>转换后可继续配合字数统计或敏感词检测工具做二次处理。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfMd2Text(md, opts) {
  opts = opts || {};
  var s = String(md);
  if (opts.dropCode) s = s.replace(/```[\s\S]*?```/g, "");
  else s = s.replace(/```[a-zA-Z0-9]*\n?/g, "").replace(/```/g, "");
  s = s.replace(/^\s{0,3}#{1,6}\s*/gm, "");
  s = s.replace(/^\s{0,3}>\s?/gm, "");
  s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1");
  s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
  s = s.replace(/(\*\*|__)(.*?)\1/g, "$2");
  s = s.replace(/(\*|_)(.*?)\1/g, "$2");
  s = s.replace(/`([^`]*)`/g, "$1");
  if (opts.keepList !== true) s = s.replace(/^\s{0,3}([-*+]|\d+\.)\s+/gm, "");
  s = s.replace(/^\s{0,3}([-*_]\s*){3,}$/gm, "");
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.replace(/^\s+|\s+$/g, "");
}
window.__xfMd2Text = __xfMd2Text;
function run() {
  var out = __xfMd2Text($("src").value, { keepList: $("li").value === "keep", dropCode: $("code").value === "drop" });
  $("res").value = out;
  $("state").textContent = out.length + " 字符";
  $("tip").textContent = "✅ 转换完成";
  return out;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
