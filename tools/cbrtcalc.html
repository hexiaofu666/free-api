<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立方根计算器 - 词海工具箱</title>
<meta name="description" content="在线立方根计算器（三次方根），支持负数与小数，同时标注是否为完全立方数并给出验算。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/cbrtcalc.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="cbrtcalc" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>被开方数</label><input type="text" id="src" placeholder="支持负数，如 -27, 8, 2" value="27, 8, -125"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">三次方根计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于立方根计算器介绍：</h4>
    <ol>
      <li>立方根对负数同样有定义，例如 ³√(-125) = -5。</li>
      <li>使用 Math.cbrt 计算，对负数与极大数值都比幂函数更稳定。</li>
      <li>完全立方数会被标注，例如 27 = 3³。</li>
      <li>小数位仅控制显示精度，内部保持双精度计算。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
function __xfCbrt(x, dec) {
  var v = Number(x);
  if (!isFinite(v)) return null;
  return { value: Math.cbrt(v), text: String(__xfRound(Math.cbrt(v), dec === undefined ? 6 : dec)) };
}
function __xfIsPerfectCube(x) {
  var v = Number(x);
  if (!isFinite(v)) return false;
  var r = Math.round(Math.cbrt(v));
  return r * r * r === v;
}
function run() {
  var parts = String($("src").value).split(/[^0-9.\-]+/).filter(function (s) { return s !== "" && s !== "-" && s !== "."; });
  if (!parts.length) { $("tip").textContent = "⚠️ 请输入数值"; $("res").innerHTML = ""; return; }
  var dec = Number($("dec").value) || 0, out = [];
  $("tip").textContent = "✅ 共计算 " + parts.length + " 个数值";
  $("res").innerHTML = parts.map(function (s) {
    var v = Number(s), r = __xfCbrt(v, dec);
    if (!r) return "<div style='color:#c00;'>" + v + " 无法计算</div>";
    var pc = __xfIsPerfectCube(v);
    out.push(r);
    return "<div>³√<b>" + v + "</b> = <b style='color:#4d8bb8;'>" + r.text + "</b>　<span style='color:#888;'>" +
      (pc ? "完全立方数（= " + Math.round(Math.cbrt(v)) + "³）" : "非完全立方数") +
      "，验算 " + r.text + "³ ≈ " + __xfRound(Math.pow(r.value, 3), 6) + "</span></div>";
  }).join("");
  return out;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("src").value = ""; $("res").innerHTML = ""; $("tip").textContent = "三次方根计算"; };
run();
</script>
</body>
</html>
