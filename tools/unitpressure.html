<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>压力单位换算 - 词海工具箱</title>
<meta name="description" content="在线压力单位换算器，帕斯卡、千帕、兆帕、巴、标准大气压、毫米汞柱、psi 等压力单位互转。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/unitpressure.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="unitpressure" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>数值</label><input type="text" id="val" value="1"></div>
      <div class="fitem"><label>源单位</label><select id="from"></select></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar"><button class="fbtn green" id="runBtn">换算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">以帕斯卡为基准换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于压力单位换算介绍：</h4>
    <ol>
      <li>以帕斯卡为基准，覆盖工程与气象常用压力单位。</li>
      <li>1 标准大气压 = 101325 帕，1 巴 = 100000 帕，1 兆帕 = 1000000 帕。</li>
      <li>1 毫米汞柱 ≈ 133.322 帕，血压计上的 mmHg 即此单位。</li>
      <li>1 psi ≈ 6894.76 帕，常用于汽车胎压，1 kgf/cm² = 98066.5 帕。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
var PRESS = [
  { k: "pa", n: "帕斯卡 Pa", f: 1 }, { k: "hpa", n: "百帕 hPa", f: 100 }, { k: "kpa", n: "千帕 kPa", f: 1000 },
  { k: "mpa", n: "兆帕 MPa", f: 1e6 }, { k: "bar", n: "巴 bar", f: 1e5 }, { k: "mbar", n: "毫巴 mbar", f: 100 },
  { k: "atm", n: "标准大气压 atm", f: 101325 }, { k: "mmhg", n: "毫米汞柱 mmHg", f: 133.322387415 },
  { k: "mmh2o", n: "毫米水柱 mmH2O", f: 9.80665 }, { k: "psi", n: "psi", f: 6894.757293168 },
  { k: "kgfcm2", n: "千克力/平方厘米", f: 98066.5 }
];
function __xfPressUnit(key) { for (var i = 0; i < PRESS.length; i++) if (PRESS[i].k === key) return PRESS[i]; return null; }
function __xfPressConvert(v, from) {
  var u = __xfPressUnit(from), n = Number(v);
  if (!u || !isFinite(n)) return null;
  var base = n * u.f, out = {};
  PRESS.forEach(function (x) { out[x.k] = base / x.f; });
  return out;
}
function __xfPressList() { return PRESS; }
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfPressConvert($("val").value, $("from").value);
  if (!o) { $("tip").textContent = "⚠️ 请输入合法数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML = PRESS.map(function (u) {
    return "<div>" + u.n + "：" + __xfRound(o[u.k], dec) + "</div>";
  }).join("");
  return o;
}
(function init() {
  var sel = $("from");
  PRESS.forEach(function (u) { var op = document.createElement("option"); op.value = u.k; op.textContent = u.n; sel.appendChild(op); });
  sel.value = "kpa";
})();
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
