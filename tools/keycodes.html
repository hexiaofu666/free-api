<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键盘按键码查询 - 词海工具箱</title>
<meta name="description" content="在线查询键盘按键对应的 code、keyCode 与 key 值，提供常用按键码表并支持在页面直接按键读取实时键值。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/keycodes.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="keycodes" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>搜索按键</label><input type="text" id="kw" value="" placeholder="如 enter / arrow / 65"></div>
      <div class="fitem"><label>显示条数</label>
        <select id="lim"><option value="20">20</option><option value="50" selected>50</option><option value="200">全部</option></select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查询键码</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vin" style="margin-top:15px;">
      <div class="vhead" style="padding:6px 2px;font-size:12px;">实时按键读取（点击下方区域后按任意键）</div>
      <textarea id="src" readonly style="min-height:60px;">请在页面任意位置按下键盘按键…</textarea>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">按键码表</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:280px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于键盘按键码查询介绍：</h4>
    <ol>
      <li>现代浏览器推荐使用 event.code 判断物理按键，它不受键盘布局与大小写影响。</li>
      <li>keyCode 与 which 属于历史属性，浏览器仍兼容但已不推荐在新代码中使用。</li>
      <li>左右 Shift、Ctrl、Alt 的 code 不同但 keyCode 相同，需要区分左右时应读取 code。</li>
      <li>搜索框支持按名称模糊匹配，也支持直接输入数字查询对应的 keyCode。</li>
      <li>在页面按下组合键时，实时区域会同步显示是否按下了 Shift、Ctrl 与 Alt。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var KEY_MAP = {
  "Backspace": 8, "Tab": 9, "Enter": 13, "ShiftLeft": 16, "ShiftRight": 16, "ControlLeft": 17, "ControlRight": 17,
  "AltLeft": 18, "AltRight": 18, "CapsLock": 20, "Escape": 27, "Space": 32, "PageUp": 33, "PageDown": 34,
  "End": 35, "Home": 36, "ArrowLeft": 37, "ArrowUp": 38, "ArrowRight": 39, "ArrowDown": 40, "Insert": 45,
  "Delete": 46, "Digit0": 48, "Digit1": 49, "Digit2": 50, "Digit3": 51, "Digit4": 52, "Digit5": 53,
  "Digit6": 54, "Digit7": 55, "Digit8": 56, "Digit9": 57, "KeyA": 65, "KeyB": 66, "KeyC": 67, "KeyD": 68,
  "KeyE": 69, "KeyF": 70, "KeyG": 71, "KeyH": 72, "KeyI": 73, "KeyJ": 74, "KeyK": 75, "KeyL": 76,
  "KeyM": 77, "KeyN": 78, "KeyO": 79, "KeyP": 80, "KeyQ": 81, "KeyR": 82, "KeyS": 83, "KeyT": 84,
  "KeyU": 85, "KeyV": 86, "KeyW": 87, "KeyX": 88, "KeyY": 89, "KeyZ": 90, "F1": 112, "F2": 113,
  "F3": 114, "F4": 115, "F5": 116, "F6": 117, "F7": 118, "F8": 119, "F9": 120, "F10": 121,
  "F11": 122, "F12": 123, "NumLock": 144, "ScrollLock": 145, "Semicolon": 186, "Equal": 187, "Comma": 188,
  "Minus": 189, "Period": 190, "Slash": 191, "Backquote": 192, "BracketLeft": 219, "Backslash": 220,
  "BracketRight": 221, "Quote": 222
};
function __xfKeyRows() {
  return Object.keys(KEY_MAP).map(function (code) { return { code: code, keyCode: KEY_MAP[code] }; })
    .sort(function (a, b) { return a.keyCode - b.keyCode || (a.code < b.code ? -1 : 1); });
}
function __xfKeyName(code) {
  var c = parseInt(code, 10), hit = __xfKeyRows().filter(function (r) { return r.keyCode === c; });
  return hit.length ? hit[0].code : null;
}
function __xfSearchKey(kw) {
  var k = String(kw || "").toLowerCase();
  return __xfKeyRows().filter(function (r) {
    if (!k) return true;
    return r.code.toLowerCase().indexOf(k) >= 0 || String(r.keyCode) === k;
  });
}
function __xfKeyInfo(e) {
  if (!e) return null;
  return { code: e.code, key: e.key, keyCode: e.keyCode, which: e.which, shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey };
}
window.__xfKeyRows = __xfKeyRows;
window.__xfKeyName = __xfKeyName;
window.__xfSearchKey = __xfSearchKey;
window.__xfKeyInfo = __xfKeyInfo;
function run() {
  var lim = parseInt($("lim").value, 10) || 50;
  var rows = __xfSearchKey($("kw").value).slice(0, lim);
  var lines = ["code               keyCode"];
  rows.forEach(function (r) { lines.push(r.code + (r.code.length < 18 ? new Array(19 - r.code.length).join(" ") : " ") + r.keyCode); });
  $("res").value = lines.join("\n");
  $("state").textContent = rows.length + " 条";
  $("tip").textContent = "✅ 共 " + __xfKeyRows().length + " 个常用按键";
  return rows;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var info = __xfKeyInfo(e);
  $("src").value = "code: " + info.code + "  key: " + info.key + "  keyCode: " + info.keyCode + "  which: " + info.which;
});
run();
</script>
</body>
</html>
