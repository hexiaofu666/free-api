<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际电话区号查询 - 词海工具箱</title>
<meta name="description" content="查询世界主要国家和地区的国际电话区号与 ISO 代码，支持按中文名、英文名或区号搜索，出国联系更省心。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.7.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.7.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/countrycode.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="countrycode" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>搜索</label><input type="text" id="kw" value="" placeholder="输入国家名或区号，如 中国 或 81"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">查询</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">查询结果</strong><span id="state"></span></div>
      <textarea id="res" readonly style="height:280px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于国际电话区号查询介绍：</h4>
    <ol>
      <li>国际区号前面需要加国际长途前缀，中国大陆拨出时前缀为 00，其他地区可能不同。</li>
      <li>拨号顺序为前缀加国家区号加对方号码，例如从内地拨美国为 00 加 1 加号码。</li>
      <li>美国、加拿大等北美地区共用区号 1，具体归属通过后面的区域码区分。</li>
      <li>搜索框支持按区号数字检索，例如输入 81 可直接定位到日本。</li>
      <li>中国香港、中国澳门与中国台湾的区号分别为 852、853 与 886。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.7.0"></script>
<script src="../assets/chrome.js?v=1.7.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var CODE_RAW = "中国,+86,CN;美国,+1,US;日本,+81,JP;韩国,+82,KR;英国,+44,GB;法国,+33,FR;德国,+49,DE;意大利,+39,IT;西班牙,+34,ES;葡萄牙,+351,PT;俄罗斯,+7,RU;加拿大,+1,CA;澳大利亚,+61,AU;新西兰,+64,NZ;印度,+91,IN;巴西,+55,BR;阿根廷,+54,AR;墨西哥,+52,MX;新加坡,+65,SG;马来西亚,+60,MY;泰国,+66,TH;越南,+84,VN;菲律宾,+63,PH;印度尼西亚,+62,ID;荷兰,+31,NL;比利时,+32,BE;瑞士,+41,CH;瑞典,+46,SE;挪威,+47,NO;丹麦,+45,DK;芬兰,+358,FI;奥地利,+43,AT;波兰,+48,PL;希腊,+30,GR;土耳其,+90,TR;埃及,+20,EG;南非,+27,ZA;尼日利亚,+234,NG;沙特阿拉伯,+966,SA;阿联酋,+971,AE;以色列,+972,IL;伊朗,+98,IR;巴基斯坦,+92,PK;孟加拉国,+880,BD;斯里兰卡,+94,LK;尼泊尔,+977,NP;缅甸,+95,MM;柬埔寨,+855,KH;老挝,+856,LA;蒙古,+976,MN;哈萨克斯坦,+7,KZ;乌克兰,+380,UA;捷克,+420,CZ;匈牙利,+36,HU;罗马尼亚,+40,RO;爱尔兰,+353,IE;智利,+56,CL;秘鲁,+51,PE;哥伦比亚,+57,CO;中国香港,+852,HK;中国澳门,+853,MO;中国台湾,+886,TW";
function __xfCodeList() {
  return CODE_RAW.split(";").map(function (x) {
    var p = x.split(",");
    return { name: p[0], code: p[1], iso: p[2] };
  });
}
function __xfCountryCode(kw) {
  var k = String(kw || "").trim().toLowerCase();
  if (!k) return __xfCodeList();
  return __xfCodeList().filter(function (c) {
    return c.name.toLowerCase().indexOf(k) >= 0 || c.code.indexOf(k) >= 0 || c.iso.toLowerCase().indexOf(k) >= 0;
  });
}
function __xfCodeOf(name) {
  var n = String(name).trim();
  var hit = __xfCodeList().filter(function (c) { return c.name === n; });
  return hit.length ? hit[0].code : null;
}
window.__xfCodeList = __xfCodeList;
window.__xfCountryCode = __xfCountryCode;
window.__xfCodeOf = __xfCodeOf;
function run() {
  var list = __xfCountryCode($("kw").value);
  $("res").value = list.map(function (c) { return c.name + "\t" + c.code + "\t" + c.iso; }).join("\n");
  $("state").textContent = list.length + " 条";
  $("tip").textContent = "✅ 共 " + __xfCodeList().length + " 个国家和地区";
  return list;
}
$("runBtn").onclick = run;
$("copyBtn").onclick = function () { if (!$("res").value) return alert("暂无结果"); navigator.clipboard.writeText($("res").value).then(function () { alert("✅ 已复制"); }); };
run();
</script>
</body>
</html>
