<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重量单位换算 - 词海工具箱</title>
<meta name="description" content="在线重量质量单位换算器，千克、克、吨、斤、两、磅、盎司、克拉、英石等常用重量单位互转。">

<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];

<body data-tool="unitweight" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>数值</label><input type="text" id="val" value="1"></div>
      <div class="fitem"><label>源单位</label><select id="from"></select></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="6" min="0" max="12"></div>
    </div>
    <div class="abar"><button class="fbtn green" id="runBtn">换算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">以千克为基准换算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于重量单位换算介绍：</h4>
    <ol>
      <li>以千克为基准，覆盖公制、英制与中国市制常用重量单位。</li>
      <li>1 斤 = 500 克，1 两 = 50 克，1 钱 = 5 克，买菜称重换算很常用。</li>
      <li>1 磅 = 0.45359237 千克，1 盎司 = 28.349523125 克，1 英石 = 14 磅。</li>
      <li>克拉用于宝石计量，1 克拉 = 0.2 克，即 1 克 = 5 克拉。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 6 : dec); return Math.round(v * p) / p; }
var WT = [
  { k: "mg", n: "毫克", f: 1e-6 }, { k: "g", n: "克", f: 0.001 }, { k: "kg", n: "千克", f: 1 },
  { k: "t", n: "吨", f: 1000 }, { k: "ct", n: "克拉", f: 0.0002 },
  { k: "jin", n: "斤", f: 0.5 }, { k: "liang", n: "两", f: 0.05 }, { k: "qian", n: "钱", f: 0.005 },
  { k: "lb", n: "磅", f: 0.45359237 }, { k: "oz", n: "盎司", f: 0.028349523125 },
  { k: "st", n: "英石", f: 6.35029318 }, { k: "uston", n: "短吨（美）", f: 907.18474 },
  { k: "ukton", n: "长吨（英）", f: 1016.0469088 }
];
function __xfWtUnit(key) { for (var i = 0; i < WT.length; i++) if (WT[i].k === key) return WT[i]; return null; }
function __xfWtConvert(v, from) {
  var u = __xfWtUnit(from), n = Number(v);
  if (!u || !isFinite(n)) return null;
  var base = n * u.f, out = {};
  WT.forEach(function (x) { out[x.k] = base / x.f; });
  return out;
}
function __xfWtList() { return WT; }
function run() {
  var dec = Number($("dec").value) || 0;
  var o = __xfWtConvert($("val").value, $("from").value);
  if (!o) { $("tip").textContent = "⚠️ 请输入合法数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 换算完成";
  $("res").innerHTML = WT.map(function (u) {
    return "<div>" + u.n + "：" + __xfRound(o[u.k], dec) + "</div>";
  }).join("");
  return o;
}
(function init() {
  var sel = $("from");
  WT.forEach(function (u) { var op = document.createElement("option"); op.value = u.k; op.textContent = u.n; sel.appendChild(op); });
  sel.value = "kg";
})();
$("runBtn").onclick = run;
run();
</script>
</body>
