<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆锥侧面积计算器 - 词海工具箱</title>
<meta name="description" content="在线圆锥侧面积计算器，输入半径与高或直接用母线长算出圆锥侧面展开面积与扇形参数。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/conelateral.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="conelateral" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>已知方式</label>
        <select id="mode"><option value="rh">半径 + 高</option><option value="rl">半径 + 母线</option></select>
      </div>
      <div class="fitem"><label>底面半径 r</label><input type="text" id="r" value="3"></div>
      <div class="fitem"><label>高 h / 母线 l</label><input type="text" id="b" value="4"></div>
      <div class="fitem"><label>小数位</label><input type="number" id="dec" value="4" min="0" max="10"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">侧面积 S侧 = πrl</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于圆锥侧面积计算器介绍：</h4>
    <ol>
      <li>侧面积公式 S侧 = πrl，l 为母线长，圆锥侧面展开后是一个扇形。</li>
      <li>母线长 l = √(r² + h²)，若已知母线可直接选择第二种方式输入。</li>
      <li>母线长必须不小于半径，否则无法构成圆锥，程序会给出提示。</li>
      <li>展开扇形弧长等于底面周长 2πr，据此可以核对手工计算。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfRound(v, dec) { var p = Math.pow(10, dec === undefined ? 4 : dec); return Math.round(v * p) / p; }
function __xfConeLateral(r, l, dec) {
  var x = Number(r), y = Number(l);
  if (!isFinite(x) || !isFinite(y) || x <= 0 || y <= 0) return null;
  var lateral = Math.PI * x * y;
  return { r: x, l: y, lateral: lateral, arc: 2 * Math.PI * x, angle: 360 * x / y, text: { lateral: String(__xfRound(lateral, dec)), arc: String(__xfRound(2 * Math.PI * x, dec)), angle: String(__xfRound(360 * x / y, 4)) } };
}
function run() {
  var r = Number($("r").value), b = Number($("b").value);
  var l = $("mode").value === "rh" ? Math.sqrt(r * r + b * b) : b;
  if ($("mode").value === "rh" && l < r) { $("tip").textContent = "⚠️ 参数不构成圆锥"; return; }
  var o = __xfConeLateral(r, l, Number($("dec").value) || 0);
  if (!o) { $("tip").textContent = "⚠️ 请输入大于 0 的数值"; $("res").innerHTML = ""; return; }
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML =
    "<div>侧面积 = <b style='color:#4d8bb8;font-size:16px;'>" + o.text.lateral + "</b></div>" +
    "<div style='color:#888;'>母线 l = " + __xfRound(o.l, 6) + "，展开扇形弧长 = " + o.text.arc + "，圆心角 = " + o.text.angle + "°</div>";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
