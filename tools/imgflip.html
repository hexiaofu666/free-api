<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片翻转在线 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.5.8"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.5.8">
<meta name="description" content="在线图片批量翻转工具，支持水平镜像翻转和垂直翻转，浏览器本地处理不上传">
<link rel="canonical" href="https://tools.hdemba.cn/tools/imgflip.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="imgflip" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>选择图片（可多张）</label><input type="file" id="file" accept="image/*" multiple style="height:38px;padding:6px 10px;"></div>
      <div class="fitem"><label>翻转方向</label>
        <select id="dir">
          <option value="h">水平翻转（左右镜像）</option>
          <option value="v">垂直翻转（上下镜像）</option>
          <option value="both">水平 + 垂直（对角镜像）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始翻转并下载</button>
      <button class="fbtn brown" id="zipBtn" style="display:none;">打包下载全部</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>翻转结果</strong><span id="cnt"></span></div>
      <div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于图片翻转工具介绍：</h4>
    <ol>
      <li>本工具可以将多张图片批量翻转：水平镜像、垂直镜像或对角镜像。</li>
      <li>支持批量上传，上传完成后会在网页上显示预览。</li>
      <li>选择翻转方向后，点击"开始翻转并下载"即可批量处理，单张或打包下载。</li>
      <li>本工具只在您的浏览器中处理，图片不会上传至服务器，请放心使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.5.8"></script>
<script src="../assets/chrome.js?v=1.5.8"></script>
<script src="../assets/lib/zip.js"></script>
<script>
const $=id=>document.getElementById(id);
let imgs=[];
function loadFiles(fs){
  imgs=[];
  const tasks=[...fs].map(f=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{imgs.push({name:f.name,img});res();};
    img.src=URL.createObjectURL(f);
  }));
  Promise.all(tasks).then(()=>{ if(imgs.length)$("runBtn").click(); });
}
$("file").onchange=e=>loadFiles(e.target.files);
$("runBtn").onclick=()=>{
  if(!imgs.length){alert("请先选择图片");return;}
  const dir=$("dir").value, list=$("list");
  list.innerHTML=""; window._out=[];
  const tag={h:"flipH",v:"flipV",both:"flipHV"}[dir];
  imgs.forEach(it=>{
    const cv=document.createElement("canvas");
    cv.width=it.img.width; cv.height=it.img.height;
    const ctx=cv.getContext("2d");
    ctx.save();
    ctx.translate(dir==="v"?0:cv.width, dir==="h"?0:cv.height);
    if(dir==="h")ctx.scale(-1,1);
    else if(dir==="v")ctx.scale(1,-1);
    else ctx.scale(-1,-1);
    ctx.drawImage(it.img,0,0);
    ctx.restore();
    const url=cv.toDataURL("image/png");
    const base=it.name.replace(/\.[^.]+$/,"");
    window._out.push({name:`${base}_${tag}.png`,dataUrl:url});
    const box=document.createElement("div");
    box.style.textAlign="center";
    box.innerHTML=`<img src="${url}" style="max-width:100%;max-height:120px;border:1px solid #eee;border-radius:4px;display:block;margin:0 auto;">
      <a download="${base}_${tag}.png" href="${url}" style="font-size:12px;color:#ff6500;">下载</a>`;
    list.appendChild(box);
  });
  $("cnt").textContent=`共 ${imgs.length} 张`;
  $("zipBtn").style.display=imgs.length>1?"":"none";
  $("outBox").classList.add("on");
};
$("zipBtn").onclick=()=>{
  const files=window._out.map(p=>({name:p.name,data:new Uint8Array(Array.from(atob(p.dataUrl.split(",")[1]),c=>c.charCodeAt(0)))}));
  const a=document.createElement("a");
  a.download="flipped.zip"; a.href=URL.createObjectURL(zipMake(files)); a.click();
};
$("clearBtn").onclick=()=>{$("outBox").classList.remove("on");$("list").innerHTML="";imgs=[];$("zipBtn").style.display="none";};
</script>
</body>
</html>
