<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当年第几天第几周计算器 - 词海工具箱</title>
<meta name="description" content="在线计算指定日期是当年的第几天与第几周，支持闰年判断，并同时给出ISO周数与剩余天数等实用信息。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);

<link rel="canonical" href="https://tools.hdemba.cn/tools/dayofyear.html">
<link rel="icon" href="/favicon.ico">

<body data-tool="dayofyear" data-cat="math">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>日期</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="y" value="2026" style="flex:1.4;"><input type="text" id="m" value="10" style="flex:1;"><input type="text" id="d" value="7" style="flex:1;">
        </div>
      </div>
      <div class="fitem" style="color:#888;font-size:12px;">依次填写 年 / 月 / 日</div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">计算</button>
      <button class="fbtn plain" id="clrBtn">清空</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">填写日期后点击计算</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于当年第几天第几周计算器介绍：</h4>
    <ol>
      <li>第几天从 1 月 1 日开始计数，1 月 1 日即当年第 1 天。</li>
      <li>周数采用 ISO 8601 标准：以周一为一周的第一天，含当年第一个周四的那一周为第 1 周。</li>
      <li>闰年 2 月有 29 天，全年 366 天，工具会自动判断闰年并给出全年总天数。</li>
      <li>同时输出星期、是否闰年与今年剩余天数，方便做年度规划与工时统计。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.0"></script>
<script src="../assets/chrome.js?v=1.9.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfIsLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function __xfDayOfYear(y, m, d) {
  var days = [31, __xfIsLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var n = d;
  for (var i = 0; i < m - 1; i++) n += days[i];
  return n;
}
function __xfTotalDays(y) { return __xfIsLeap(y) ? 366 : 365; }
function __xfIsoWeek(y, m, d) {
  var date = new Date(Date.UTC(y, m - 1, d));
  var dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  var fday = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fday + 3);
  return 1 + Math.round((date - firstThursday) / 604800000);
}
function __xfWeekday(y, m, d) {
  var w = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  return ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][w];
}
function run() {
  var y = Number($("y").value), m = Number($("m").value), d = Number($("d").value);
  if (!(y > 1900 && y < 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) { $("tip").textContent = "⚠️ 请输入有效日期"; $("res").innerHTML = ""; return null; }
  var n = __xfDayOfYear(y, m, d), total = __xfTotalDays(y), wk = __xfIsoWeek(y, m, d);
  $("tip").textContent = "✅ 计算完成";
  $("res").innerHTML = "<div>日期：" + y + " 年 " + m + " 月 " + d + " 日（" + __xfWeekday(y, m, d) + "）</div>" +
    "<div>是当年第 <b style='color:#b87f4d;font-size:16px;'>" + n + "</b> 天</div>" +
    "<div>是当年第 <b style='color:#b87f4d;font-size:16px;'>" + wk + "</b> 周（ISO 8601）</div>" +
    "<div>今年共 " + total + " 天，" + (__xfIsLeap(y) ? "是" : "不是") + "闰年</div>" +
    "<div style='color:#888;'>今年剩余 " + (total - n) + " 天</div>";
  return n;
}
$("runBtn").onclick = run;
$("clrBtn").onclick = function () { $("y").value = ""; $("m").value = ""; $("d").value = ""; $("res").innerHTML = ""; };
run();
</script>
</body>
</html>
