<body data-tool="ipv6gen" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>地址前缀</label><input type="text" id="prefix" placeholder="例如 2001:db8:abcd::"></div>
      <div class="fitem"><label>生成数量</label><input type="number" id="count" value="10" min="1" max="1000"></div>
      <div class="fitem"><label>生成模式</label>
        <select id="mode">
          <option value="rand" selected>随机（前 64 位固定）</option>
          <option value="seq">顺序递增</option>
        </select>
      </div>
      <div class="fitem"><label>输出格式</label>
        <select id="fmt">
          <option value="compress" selected>压缩形式 ::</option>
          <option value="expand">完整展开</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">生成地址</button>
      <button class="fbtn brown" id="copyBtn">复制结果</button>
    </div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">生成的 IPv6 地址</strong></div>
      <textarea id="res" readonly placeholder="生成结果在这里"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于在线 IPv6 地址生成器介绍：</h4>
    <ol>
      <li>输入一个 IPv6 前缀（如 2001:db8::），工具会保留前缀部分，随机或顺序填充后面的部分。</li>
      <li>随机模式固定前 64 位不变，后 64 位随机生成，符合常见子网划分习惯。</li>
      <li>顺序模式从前缀起始地址开始逐个递增，适合做批量测试数据的编号。</li>
      <li>生成结果支持压缩或展开两种写法，最多一次生成 1000 条，可复制到剪贴板。</li>
    </ol>
  </div>
</div></div></div>

<script>
function __xfV6Parse(addr) {
  let s = String(addr == null ? "" : addr).trim();
  if (!s) return null;
  if (s.startsWith("[") && s.endsWith("]")) s = s.slice(1, -1);
  s = s.split("%")[0];
  if (s.indexOf("::") !== s.lastIndexOf("::")) return null;
  let head = [], tail = [], dbl = false;
  if (s.indexOf("::") >= 0) { dbl = true; const p = s.split("::"); head = p[0] ? p[0].split(":") : []; tail = p[1] ? p[1].split(":") : []; }
  else head = s.split(":");
  const all = head.concat(tail);
  if (all.length > 8) return null;
  if (!dbl && all.length !== 8) return null;
  const groups = [];
  for (let i = 0; i < all.length; i++) {
    const g = all[i];
    /* 末尾嵌入的 IPv4 写法（如 ::ffff:192.168.1.1）折算为 2 组 */
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(g)) {
      const o = g.split(".").map(Number);
      if (i !== all.length - 1 || o.some(n => n > 255)) return null;
      groups.push((o[0] << 8) | o[1], (o[2] << 8) | o[3]);
      continue;
    }
    if (!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
    groups.push(parseInt(g, 16));
  }
  const fill = 8 - groups.length;
  if (dbl && fill < 1) return null;
  if (!dbl && fill !== 0) return null;
  const full = dbl ? groups.slice(0, head.length).concat(new Array(fill).fill(0)).concat(groups.slice(head.length)) : groups;
  return full.length === 8 ? full : null;
}
function __xfV6Compress(g) {
  if (!Array.isArray(g)) g = __xfV6Parse(g);
  if (!g) return null;
  const hex = g.map(n => n.toString(16));
  let bs = -1, bl = 0, cs = -1, cl = 0;
  for (let i = 0; i < 8; i++) { if (g[i] === 0) { if (cs < 0) cs = i; cl++; if (cl > bl) { bl = cl; bs = cs; } } else { cs = -1; cl = 0; } }
  if (bl < 2) return hex.join(":");
  const left = hex.slice(0, bs).join(":"), right = hex.slice(bs + bl).join(":");
  if (!left && !right) return "::";
  if (!left) return "::" + right;
  if (!right) return left + "::";
  return left + "::" + right;
}
function __xfV6Expand(g) {
  if (!Array.isArray(g)) g = __xfV6Parse(g);
  if (!g) return null;
  return g.map(n => n.toString(16).padStart(4, "0")).join(":");
}

/* 生成：rnd 为 0-1 随机函数（便于测试注入） */
function __xfV6Gen(prefix, count, mode, rnd) {
  rnd = rnd || Math.random;
  count = Math.max(1, Math.min(1000, parseInt(count, 10) || 1));
  const base = __xfV6Parse(prefix);
  if (!base) return null;
  const out = [];
  for (let i = 0; i < count; i++) {
    const g = base.slice();
    if (mode === "seq") {
      // 按 128 位加法递增：进位可跨过后四组一直向前传播，避免低位溢出时生成错误/重复地址
      const inc = [0, 0, 0, 0, 0, 0, Math.floor(i / 65536) & 0xffff, i & 0xffff];
      let carry = 0;
      for (let k = 7; k >= 0; k--) {
        const sum = g[k] + inc[k] + carry;
        g[k] = sum & 0xffff;
        carry = sum > 0xffff ? 1 : 0;
      }
    } else {
      for (let k = 4; k < 8; k++) g[k] = Math.floor(rnd() * 65536) & 0xffff;
    }
    out.push(g);
  }
  return out;
}

window.__xfV6Parse = __xfV6Parse;
window.__xfV6Compress = __xfV6Compress;
window.__xfV6Expand = __xfV6Expand;
window.__xfV6Gen = __xfV6Gen;

const $ = id => document.getElementById(id);
function run() {
  const fmt = $("fmt").value;
  const list = __xfV6Gen($("prefix").value, $("count").value, $("mode").value);
  if (!list) { $("res").value = ""; $("tip").textContent = "前缀不合法，请检查"; return; }
  const lines = list.map(g => fmt === "expand" ? __xfV6Expand(g) : __xfV6Compress(g));
  $("res").value = lines.join("\n");
  $("tip").textContent = "已生成 " + lines.length + " 个 IPv6 地址（" + ($("mode").value === "seq" ? "顺序" : "随机") + "）";
}
$("runBtn").onclick = run;
$("copyBtn").onclick = () => { if (!$("res").value) return alert("请先生成地址"); navigator.clipboard.writeText($("res").value).then(() => alert("✅ 已复制")); };
$("prefix").value = "2001:db8:abcd::";
run();
</script>
