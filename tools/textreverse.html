<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本反转工具 - 词海工具箱</title>
<meta name="description" content="在线文本反转工具，支持按字符倒序、按行倒序、按词倒序三种模式，可自定义词分隔符。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.0"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.0">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/textreverse.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="textreverse" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>原文本</label><textarea id="src" rows="6">词海工具箱
好用又免费</textarea></div>
      <div class="fitem"><label>反转方式</label>
        <select id="mode">
          <option value="char">整体字符倒序</option>
          <option value="line">按行倒序（行内不变）</option>
          <option value="linerev">每行字符倒序（行序不变）</option>
          <option value="word">按词倒序（词内不变）</option>
        </select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">反转</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">反转结果</strong></div>
      <textarea id="res" rows="6" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于文本反转工具介绍：</h4>
    <ol>
      <li>整体字符倒序会把全部文本按字符逆序排列，包含换行符。</li>
      <li>按行倒序只调整行的顺序，每行内部文字保持不变。</li>
      <li>按词倒序以空白符切分，词序颠倒但每个词本身不变。</li>
      <li>处理流程在浏览器本地执行，适合处理含敏感信息的文本。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.0"></script>
<script src="../assets/chrome.js?v=1.8.0"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfSplitLines(text) { return String(text).replace(/\r\n?/g, "\n").split("\n"); }
function __xfReverseChars(s) { var out = ""; s = String(s); for (var i = s.length - 1; i >= 0; i--) out += s.charAt(i); return out; }
function __xfReverseText(text, mode) {
  var s = String(text);
  if (mode === "line") return __xfSplitLines(s).reverse().join("\n");
  if (mode === "linerev") return __xfSplitLines(s).map(__xfReverseChars).join("\n");
  if (mode === "word") {
    var parts = s.split(/(\s+)/);
    var words = [], seps = [];
    parts.forEach(function (p, i) { if (i % 2 === 0) words.push(p); else seps.push(p); });
    words.reverse();
    var out = "";
    for (var i = 0; i < Math.max(words.length, seps.length); i++) {
      if (i < words.length) out += words[i];
      if (i < seps.length) out += seps[i];
    }
    return out;
  }
  return __xfReverseChars(s);
}
function run() {
  var o = __xfReverseText($("src").value, $("mode").value);
  $("res").value = o;
  $("tip").textContent = "✅ 反转完成";
  return o;
}
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
