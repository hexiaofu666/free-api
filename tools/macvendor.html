  <div class="resttips">
    <h4>关于 MAC 地址厂商查询工具介绍：</h4>
    <ol>
      <li>MAC 地址的前 3 个字节（24 位）叫 OUI，由 IEEE 分配给不同厂商，因此可以据此判断网卡厂商。</li>
      <li>本工具内置了一批常见厂商的 OUI 前缀，支持批量查询与厂商名称筛选。</li>
      <li>注意：虚拟机、可自定义 MAC 的设备可能使用任意前缀，结果仅供参考。</li>
      <li>如需更完整的数据，可对照 IEEE 官方 OUI 数据库；本工具适合日常快速判断。</li>

const OUI_LIST = [

  ["001A8A", "Samsung 三星"], ["002454", "Samsung 三星"], ["BC1485", "Samsung 三星"],
  ["F409D8", "Samsung 三星"], ["CC07AB", "Samsung 三星"],
  ["0018FE", "HP"], ["3C4A92", "HP"], ["9457A5", "HP"], ["B0A5A9", "HP"],
  ["002590", "Supermicro"], ["0026B9", "Dell"], ["14FEB5", "Dell"], ["18DBF2", "Dell"],

  ["0024D7", "Intel"], ["001B21", "Intel"], ["3C9509", "Intel"], ["8086F2", "Intel"],
  ["001CC4", "Realtek"], ["00E04C", "Realtek"], ["52540A", "Realtek"],
  ["0013D4", "TP-LINK"], ["EC086B", "TP-LINK"], ["AC84C6", "TP-LINK"], ["50FA84", "TP-LINK"],

  ["0026F2", "NETGEAR"], ["204E7F", "NETGEAR"], ["2CB05D", "NETGEAR"],

  ["DA A1 19", "Google (随机)"], ["9C4E36", "Intel"],
  ["FCFBFB", "Cisco"], ["0050BA", "D-Link"], ["1CBDB9", "D-Link"], ["CCB255", "D-Link"],
  ["002191", "D-Link"], ["340804", "D-Link"],

  ["FFFFFF", "广播地址"]

/* 规范化 MAC -> 12 位大写十六进制 */
function __xfMacNorm(mac) {
  const h = String(mac == null ? "" : mac).replace(/[^0-9a-fA-F]/g, "").toUpperCase();
  return h.length === 12 ? h : null;
}

/* 查询厂商 */
function __xfMacVendor(mac) {
  const h = __xfMacNorm(mac);
  if (!h) return { ok: false, error: "不是合法的 MAC 地址" };
  const oui = h.slice(0, 6);
  // 本地管理位判断（第 2 个十六进制字符的 bit1）
  const first = parseInt(h.slice(0, 2), 16);
  const local = (first & 0x02) === 0x02;
  const multicast = (first & 0x01) === 0x01;
  const hit = OUI_LIST.find(([p]) => p.replace(/\s/g, "") === oui);
  return {
    ok: true, mac: h.replace(/(..)(?=.)/g, "$1:"), oui: oui.slice(0, 2) + ":" + oui.slice(2, 4) + ":" + oui.slice(4, 6),
    vendor: hit ? hit[1] : "未收录（可查 IEEE OUI 数据库）",
    local: local, multicast: multicast
  };
}

window.__xfMacNorm = __xfMacNorm;
window.__xfMacVendor = __xfMacVendor;

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderTable() {
  const k = $("kw").value.trim().toLowerCase();
  const list = OUI_LIST.filter(([p, v]) => !k || v.toLowerCase().indexOf(k) >= 0 || p.toLowerCase().indexOf(k) >= 0);
  $("table").innerHTML = '<table class="mv-table"><thead><tr><th>OUI 前缀</th><th>厂商</th></tr></thead><tbody>' +
    list.map(([p, v]) => {
      const o = p.replace(/\s/g, "");
      return "<tr><td><code>" + o.slice(0, 2) + ":" + o.slice(2, 4) + ":" + o.slice(4, 6) + "</code></td><td>" + esc(v) + "</td></tr>";
    }).join("") + "</tbody></table>";
}

function run() {
  const lines = $("src").value.split("\n").map(x => x.trim()).filter(x => x !== "");
  if (!lines.length) { $("res").innerHTML = '<p style="color:#999;font-size:13px;">请输入至少一个 MAC 地址</p>'; $("tip").textContent = "等待输入"; return; }
  const rows = lines.map(line => {
    const r = __xfMacVendor(line);
    if (!r.ok) return '<div class="mv-item mv-bad"><code>' + esc(line) + '</code> <span class="mv-x">✘ ' + esc(r.error) + "</span></div>";
    const flags = [];
    if (r.local) flags.push("本地管理位");
    if (r.multicast) flags.push("组播位");
    return '<div class="mv-item"><div class="mv-top"><code>' + esc(r.mac) + '</code><span class="mv-vendor">' + esc(r.vendor) + "</span></div>" +
      '<div class="mv-meta">OUI 前缀：<code>' + esc(r.oui) + "</code>" + (flags.length ? " ｜ 标记：" + flags.join("、") : "") + "</div></div>";
  }).join("");
  $("res").innerHTML = rows;
  $("tip").textContent = "查询完成（共 " + lines.length + " 条）";
}
$("runBtn").onclick = run;
$("demoBtn").onclick = () => { $("src").value = "3C:22:FB:11:22:33\n00:1A:2B:3C:4D:5E\nF4:8C:50:AA:BB:CC\n00:0C:29:12:34:56\nF8:3D:FF:00:11:22"; run(); };
$("kw").addEventListener("input", renderTable);
renderTable();
run();
</script>
