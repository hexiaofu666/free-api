<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九宫格切图在线 - 词海工具箱</title>
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.6.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.6.1">
<meta name="description" content="九宫格切图在线工具，支持按行列或宽高切分图片，一键打包下载，适合微信朋友圈九宫格配图">
<link rel="canonical" href="https://tools.hdemba.cn/tools/imgsplit.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="imgsplit" data-cat="color">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>选择图片</label><input type="file" id="file" accept="image/*" style="height:38px;padding:6px 10px;"></div>
      <div class="fitem"><label>切分模式</label>
        <select id="mode">
          <option value="rc">按行数 × 列数</option>
          <option value="wh">按每块宽 × 高</option>
        </select>
      </div>
      <div class="fitem" id="rowItem"><label>剪裁行数</label><input type="number" id="rows" value="3" min="1" max="20"></div>
      <div class="fitem" id="colItem"><label>剪裁列数</label><input type="number" id="cols" value="3" min="1" max="20"></div>
      <div class="fitem" id="hItem" style="display:none;"><label>剪裁高度(px)</label><input type="number" id="ch" value="100" min="1"></div>
      <div class="fitem" id="wItem" style="display:none;"><label>剪裁宽度(px)</label><input type="number" id="cw" value="100" min="1"></div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">开始切图</button>
      <button class="fbtn brown" id="zipBtn" style="display:none;">打包下载全部</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>切图结果</strong><span id="cnt"></span></div>
      <div id="grid" style="display:grid;gap:8px;padding:10px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于九宫格切图工具介绍：</h4>
    <ol>
      <li>本工具可以将图片切割为微博或微信朋友圈中常用的九宫格图片。</li>
      <li>有两种切割模式：一种是指定行数和列数（如 3×3），一种是指定每块的宽度与高度。</li>
      <li>切割后的图片可以单张下载，也可以一次性打包成 ZIP 全部下载。</li>
      <li>本工具在浏览器中处理，你上传的图片不会上传至服务器，请放心使用。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.6.1"></script>
<script src="../assets/chrome.js?v=1.6.1"></script>
<script src="../assets/lib/zip.js"></script>
<script>
const $=id=>document.getElementById(id);
let img=null,pieces=[];
$("mode").onchange=()=>{
  const rc=$("mode").value==="rc";
  $("rowItem").style.display=rc?"":"none"; $("colItem").style.display=rc?"":"none";
  $("hItem").style.display=rc?"none":""; $("wItem").style.display=rc?"none":"";
};
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  img=new Image();
  img.onload=()=>{$("runBtn").click();};
  img.src=URL.createObjectURL(f);
};
$("runBtn").onclick=()=>{
  if(!img){alert("请先选择图片");return;}
  pieces=[];
  const cols=[],rows=[];
  if($("mode").value==="rc"){
    const r=Math.min(+$("rows").value||3,20), c=Math.min(+$("cols").value||3,20);
    for(let i=0;i<r;i++)rows.push([Math.floor(img.height*i/r),Math.floor(img.height*(i+1)/r)]);
    for(let j=0;j<c;j++)cols.push([Math.floor(img.width*j/c),Math.floor(img.width*(j+1)/c)]);
  }else{
    const h=+$("ch").value||100, w=+$("cw").value||100;
    for(let y=0;y<img.height;y+=h)rows.push([y,Math.min(y+h,img.height)]);
    for(let x=0;x<img.width;x+=w)cols.push([x,Math.min(x+w,img.width)]);
  }
  const grid=$("grid"); grid.innerHTML="";
  grid.style.gridTemplateColumns=`repeat(${cols.length},1fr)`;
  rows.forEach((ry,i)=>cols.forEach((cx,j)=>{
    const cv=document.createElement("canvas");
    cv.width=cx[1]-cx[0]; cv.height=ry[1]-ry[0];
    cv.getContext("2d").drawImage(img,cx[0],ry[0],cv.width,cv.height,0,0,cv.width,cv.height);
    const url=cv.toDataURL("image/png");
    pieces.push({name:`piece_${i+1}_${j+1}.png`,dataUrl:url});
    const box=document.createElement("div");
    box.style.textAlign="center";
    box.innerHTML=`<img src="${url}" style="width:100%;border:1px solid #eee;border-radius:4px;display:block;">
      <span style="font-size:11px;color:#999;">${i+1}-${j+1}</span>
      <a download="${pieces[pieces.length-1].name}" href="${url}" style="font-size:12px;color:#ff6500;display:block;">下载</a>`;
    grid.appendChild(box);
  }));
  $("cnt").textContent=`共 ${pieces.length} 块（${cols.length}列 × ${rows.length}行）`;
  $("zipBtn").style.display=pieces.length>1?"":"none";
  $("outBox").classList.add("on");
};
$("zipBtn").onclick=()=>{
  const files=pieces.map(p=>({name:p.name,data:new Uint8Array(Array.from(atob(p.dataUrl.split(",")[1]),c=>c.charCodeAt(0)))}));
  const a=document.createElement("a");
  a.download="imgsplit.zip"; a.href=URL.createObjectURL(zipMake(files)); a.click();
};
$("clearBtn").onclick=()=>{$("outBox").classList.remove("on");$("grid").innerHTML="";pieces=[];$("zipBtn").style.display="none";};
</script>
</body>
</html>
