<body data-tool="htpasswd" data-cat="dev">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>用户名</label><input id="user" placeholder="留空则只生成密码部分"></div>
      <div class="fitem"><label>密码</label><input id="pwd" placeholder="输入密码"></div>
      <div class="fitem"><label>加密方式</label>
        <select id="algo">
          <option value="apr1">APR1-MD5（Apache 推荐）</option>
          <option value="sha">SHA（{SHA} 格式）</option>
          <option value="plain">明文（不推荐）</option>
        </select>
      </div>
    </div>
    <div class="abar">
      <button class="fbtn teal" id="runBtn">生成条目</button>
      <button class="fbtn brown" id="demoBtn">演示数据</button>
      <button class="fbtn gray" id="clearBtn">清空数据</button>
    </div>
    <div class="vout" id="outBox">
      <div class="vhead"><strong>生成结果</strong><span id="copyBtn">复制</span></div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于htpasswd介绍：</h4>
    <ol>
      <li>htpasswd 是 Apache 服务器用于 Basic 认证的密码文件格式，每行一条「用户名:密文」。</li>
      <li>APR1-MD5 是 Apache 自有的 MD5 加 salt 变体，兼容性最好，推荐使用。</li>
      <li>SHA 格式为 {SHA} 前缀 + SHA-1 的 Base64 编码，兼容 Nginx、Lighttpd 等。</li>
      <li>生成后把内容追加到服务器密码文件即可（如 .htpasswd），并设置好 Web 服务器的认证配置。</li>
    </ol>
  </div>

<script>
const $=id=>document.getElementById(id);
const ITOA64="./0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
function to64(v,n){let r="";while(n-->0){r+=ITOA64[v&0x3f];v>>>=6;}return r;}
/* Apache APR1-MD5（crypt_apr1_md5 标准实现） */
function apr1(passwd,salt){
  salt=salt.slice(0,8);
  let ctx = passwd + "$apr1$" + salt;
  let final = hex2latin(md5latin(passwd + salt + passwd));
  for (let pl = passwd.length; pl > 0; pl -= 16)
    ctx += final.slice(0, Math.min(16, pl));
  for (let i = passwd.length; i > 0; i >>= 1)
    ctx += (i & 1) ? String.fromCharCode(0) : passwd[0];
  final = hex2latin(md5latin(ctx));
  for (let i = 0; i < 1000; i++) {
    let n = (i & 1) ? passwd : final;
    if (i % 3) n += salt;
    if (i % 7) n += passwd;
    n += (i & 1) ? final : passwd;
    final = hex2latin(md5latin(n));
  }
  const o=[]; for (let i=0;i<16;i++) o.push(final.charCodeAt(i));
  let out = "";
  out += to64((o[0]<<16)|(o[6]<<8)|o[12], 4);
  out += to64((o[1]<<16)|(o[7]<<8)|o[13], 4);
  out += to64((o[2]<<16)|(o[8]<<8)|o[14], 4);
  out += to64((o[3]<<16)|(o[9]<<8)|o[15], 4);
  out += to64((o[4]<<16)|(o[10]<<8)|o[5], 4);
  out += to64(o[11], 2);
  return "$apr1$" + salt + "$" + out;
}
/* {SHA} 格式：SHA-1 的 Base64 */
function sha1latin(s){
  const bitLen=s.length*8;
  const newLen=(((s.length+8)>>6)+1)*64;
  const m=new Uint8Array(newLen);
  for(let i=0;i<s.length;i++)m[i]=s.charCodeAt(i)&0xff;
  m[s.length]=0x80;
  new DataView(m.buffer).setUint32(newLen-4,bitLen>>>0);
  let h0=0x67452301,h1=0xefcdab89,h2=0x98badcfe,h3=0x10325476,h4=0xc3d2e1f0;
  const dv=new DataView(m.buffer), w=new Array(80);
  for(let off=0;off<newLen;off+=64){
    for(let j=0;j<16;j++)w[j]=dv.getUint32(off+j*4);
    for(let j=16;j<80;j++){const x=w[j-3]^w[j-8]^w[j-14]^w[j-16];w[j]=(x<<1)|(x>>>31);}
    let a=h0,b=h1,c=h2,d=h3,e=h4;
    for(let j=0;j<80;j++){
      let f,k;
      if(j<20){f=(b&c)|(~b&d);k=0x5a827999;}
      else if(j<40){f=b^c^d;k=0x6ed9eba1;}
      else if(j<60){f=(b&c)|(b&d)|(c&d);k=0x8f1bbcdc;}
      else{f=b^c^d;k=0xca62c1d6;}
      const t=(((a<<5)|(a>>>27))+f+e+k+w[j])|0;
      e=d;d=c;c=(b<<30)|(b>>>2);b=a;a=t;
    }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;
  }
  return [h0,h1,h2,h3,h4].map(x=>String.fromCharCode((x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255)).join("");
}
$("runBtn").onclick=()=>{
  const pwd=$("pwd").value, user=$("user").value.trim();
  if(!pwd) return alert("请输入密码");
  let hash;
  const algo=$("algo").value;
  if(algo==="apr1"){
    const chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const buf=new Uint8Array(8);crypto.getRandomValues(buf);
    const salt=[...buf].map(b=>chars[b%chars.length]).join("");
    hash=apr1(pwd,salt);
  }
  else if(algo==="sha")hash="{SHA}"+btoa(sha1latin(pwd));
  else hash=pwd;
  $("output").value=(user?user+":":"")+hash;
  $("outBox").classList.add("on");
};
$("demoBtn").onclick=()=>{$("user").value="admin";$("pwd").value="myPassword123";$("runBtn").click();};
$("clearBtn").onclick=()=>{$("user").value="";$("pwd").value="";$("output").value="";$("outBox").classList.remove("on");};
$("copyBtn").onclick=()=>{$("output").select();document.execCommand("copy");};
</script>
