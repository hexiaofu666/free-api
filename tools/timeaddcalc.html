<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间加减计算器 - 词海工具箱</title>
<meta name="description" content="在线时间加减计算器，以 Unix 时间戳为基准叠加天数小时分钟秒，支持负数做时间回退并输出格式化结果。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.8.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.8.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/timeaddcalc.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="timeaddcalc" data-cat="life">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>基准时间戳（秒，留空为当前时间）</label><input type="number" id="ts" value="" step="1"></div>
      <div class="fitem"><label>加减天数（可为负）</label><input type="number" id="dd" value="1" step="1"></div>
      <div class="fitem"><label>加减小时</label><input type="number" id="dh" value="2" step="1"></div>
      <div class="fitem"><label>加减分钟</label><input type="number" id="dm" value="3" step="1"></div>
      <div class="fitem"><label>加减秒</label><input type="number" id="ds" value="4" step="1"></div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">计算时间</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">基准时间戳叠加天数小时分钟秒</strong></div>
      <div id="res" style="padding:12px 15px;line-height:2;font-size:13px;"></div>
    </div>
  </div>
  <div class="resttips">
    <h4>关于时间加减计算器介绍：</h4>
    <ol>
      <li>基准时间戳单位为秒，留空时取当前系统时间，页面会实时填入当前值。</li>
      <li>天数小时分钟秒均可填负数实现时间回退，例如天数填负一表示向前推一天。</li>
      <li>输出同时给出结果时间戳与 UTC 格式时间，便于跨时区核对。</li>
      <li>时间戳仅支持 Unix 纪元之后的范围，超出会显示无效时间提示。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.8.1"></script>
<script src="../assets/chrome.js?v=1.8.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfPad(n) { return (n < 10 ? "0" : "") + n; }
function __xfAddSpan(d, h, m, s) {
  return (d || 0) * 86400000 + (h || 0) * 3600000 + (m || 0) * 60000 + (s || 0) * 1000;
}
function __xfAddTime(baseTs, d, h, m, s) {
  return baseTs + __xfAddSpan(d, h, m, s);
}
function __xfFmtUtc(ts) {
  var t = new Date(ts);
  if (!isFinite(t.getTime())) return "无效时间";
  return t.getUTCFullYear() + "-" + __xfPad(t.getUTCMonth() + 1) + "-" + __xfPad(t.getUTCDate()) + " " +
    __xfPad(t.getUTCHours()) + ":" + __xfPad(t.getUTCMinutes()) + ":" + __xfPad(t.getUTCSeconds());
}
function __xfFmtLocal(ts) {
  var t = new Date(ts);
  if (!isFinite(t.getTime())) return "无效时间";
  return t.getFullYear() + "-" + __xfPad(t.getMonth() + 1) + "-" + __xfPad(t.getDate()) + " " +
    __xfPad(t.getHours()) + ":" + __xfPad(t.getMinutes()) + ":" + __xfPad(t.getSeconds());
}
function run() {
  var raw = $("ts").value;
  var base = raw === "" ? Math.floor(Date.now() / 1000) : Math.floor(Number(raw));
  if (!isFinite(base)) { $("tip").textContent = "⚠️ 基准时间戳无效"; $("res").innerHTML = ""; return null; }
  var d = Number($("dd").value) || 0, h = Number($("dh").value) || 0;
  var m = Number($("dm").value) || 0, s = Number($("ds").value) || 0;
  var span = __xfAddSpan(d, h, m, s);
  var res = __xfAddTime(base * 1000, d, h, m, s);
  $("tip").textContent = "✅ 结果时间戳 " + Math.floor(res / 1000);
  $("res").innerHTML =
    "<div>基准时间：" + __xfFmtUtc(base * 1000) + " UTC</div>" +
    "<div>加减跨度：<b>" + span + "</b> 毫秒（" + d + " 天 " + h + " 时 " + m + " 分 " + s + " 秒）</div>" +
    "<div style='color:#c0392b;'>结果时间戳：<b>" + Math.floor(res / 1000) + "</b> 秒</div>" +
    "<div>结果时间（UTC）：<b>" + __xfFmtUtc(res) + "</b></div>" +
    "<div>结果时间（本地）：<b>" + __xfFmtLocal(res) + "</b></div>";
  return { result: res, span: span };
}
if ($("ts").value === "") { $("ts").value = Math.floor(Date.now() / 1000); }
$("runBtn").onclick = run;
run();
</script>
</body>
</html>
