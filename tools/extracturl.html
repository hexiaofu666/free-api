<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线网址提取工具 - 词海工具箱</title>
<meta name="description" content="在线网址提取工具，从文本或 HTML 源码中批量提取 URL 链接、自动去重并支持只保留主域名。">
<link rel="stylesheet" href="../assets/layui/icon.css">
<script src="../assets/theme.js?v=1.9.1"></script>
<link rel="stylesheet" href="../assets/style.css?v=1.9.1">
<script>
var _hmt = _hmt || [];
(function() {
var hm = document.createElement("script");
hm.src = "https://hm.baidu.com/hm.js?1da30f0e0a9fb8b51ed6762e8753bef1";
var s = document.getElementsByTagName("script")[0];
s.parentNode.insertBefore(hm, s);
})();
</script>
<link rel="canonical" href="https://tools.hdemba.cn/tools/extracturl.html">
<link rel="icon" href="/favicon.ico">
</head>
<body data-tool="extracturl" data-cat="office">
<div class="main"><div class="center"><div class="tools">
  <div class="tools-cent">
    <div class="vsetup" style="margin-top:0;">
      <div class="fitem"><label>原文本 / HTML</label><textarea id="src" rows="7"></textarea></div>
      <div class="fitem"><label>输出形式</label>
        <select id="mode"><option value="full">完整网址</option><option value="host">仅主域名</option></select>
      </div>
    </div>
    <div class="abar"><button class="fbtn teal" id="runBtn">提取网址</button><button class="fbtn plain" id="demoBtn">填入 HTML 示例</button></div>
    <div class="vout on">
      <div class="vhead"><strong id="tip">提取结果</strong></div>
      <textarea id="res" rows="7" readonly style="width:100%;box-sizing:border-box;border:0;background:transparent;padding:12px 15px;font-size:13px;"></textarea>
    </div>
  </div>
  <div class="resttips">
    <h4>关于在线网址提取工具介绍：</h4>
    <ol>
      <li>支持 http、https 开头的完整网址，也支持以 www. 开头的省略协议写法。</li>
      <li>会自动从 HTML 的 href、src 属性中提取链接，方便做外链盘点。</li>
      <li>主域名模式会去掉协议与路径，只保留域名部分，并按域名去重。</li>
      <li>提取结果自动去重，忽略末尾的标点符号如逗号、句号与右括号。</li>
    </ol>
  </div>
</div></div></div>
<script src="../assets/tools-data.js?v=1.9.1"></script>
<script src="../assets/chrome.js?v=1.9.1"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
function __xfExtractUrls(text) {
  var re = /(?:https?:\/\/|www\.)[A-Za-z0-9\-._~:/?#\[\]@!$&'()*+,;=%]+/g;
  var raw = String(text).match(re) || [];
  return raw.map(function (u) { return u.replace(/[.,;:'")\]}>]+$/, ""); }).filter(function (u) { return u.length > 6; });
}
function __xfUrlHost(url) {
  var s = String(url).replace(/^https?:\/\//i, "");
  s = s.split("/")[0].split("?")[0].split("#")[0];
  return s.replace(/^www\./i, "");
}
function __xfUrlList(text, mode) {
  var urls = __xfExtractUrls(text);
  var seen = {}, out = [];
  urls.forEach(function (u) {
    var v = mode === "host" ? __xfUrlHost(u) : u;
    if (!seen[v]) { seen[v] = 1; out.push(v); }
  });
  return { list: out, count: out.length, raw: urls.length };
}
function run() {
  var o = __xfUrlList($("src").value, $("mode").value);
  $("res").value = o.list.join("\n");
  $("tip").textContent = o.count ? "✅ 提取到 " + o.count + " 条链接" : "⚠️ 未发现网址";
  return o;
}
$("runBtn").onclick = run;
$("demoBtn").onclick = function () {
  $("src").value = '<a href="https://tools.hdemba.cn/tools/md5.html">MD5</a>\n<a href="http://www.example.com/a?b=1">示例</a>\n<img src="https://cdn.test.com/img/logo.png">';
  return run();
};
run();
</script>
</body>
</html>
